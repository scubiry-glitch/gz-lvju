<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>收银台 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
<style>
  .payhead{text-align:center;padding:18px 20px 8px;}
  .payhead .amt{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--ink);}
  .payhead .on{font-size:11px;color:var(--muted);margin-top:5px;}
  .payhead .cd{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:var(--gold-deep);background:var(--gold-soft);padding:3px 11px;border-radius:999px;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-booking.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">收银台<small>选择支付方式</small></div>
    </div>

    <div class="steps">
      <span class="st done"><span class="n">✓</span>预定下单</span><span class="sep">›</span>
      <span class="st on"><span class="n">2</span>支付</span><span class="sep">›</span>
      <span class="st"><span class="n">3</span>完成</span>
    </div>

    <div class="payhead">
      <div class="amt" id="payAmt">¥1,176</div>
      <div class="on" id="paySub">订单号 LJ20260614-8821 · 云上观景惠居 · 2 晚</div>
      <div class="cd" id="payCd">⏱ 请在 14:59 内完成支付</div>
    </div>

    <div class="seg">选择支付方式</div>
    <div>
      <div class="payopt sel"><div class="pi" style="background:var(--brand-soft)">🐚</div>
        <div class="nm">贝壳支付<small>资金存管 · 入住确认后结算给房东</small></div><div class="rd"></div></div>
      <div class="payopt"><div class="pi" style="background:#dcfce7">💚</div>
        <div class="nm">微信支付</div><div class="rd"></div></div>
      <div class="payopt"><div class="pi" style="background:#dbeafe">🏦</div>
        <div class="nm" id="bankPayName">江苏银行 APP<small>可分期 · 积分抵扣</small></div><div class="rd"></div></div>
      <div class="payopt"><div class="pi" style="background:#fef9c3">🧳</div>
        <div class="nm">同程支付</div><div class="rd"></div></div>
      <div class="payopt"><div class="pi" style="background:#ffedd5">🍔</div>
        <div class="nm">美团支付</div><div class="rd"></div></div>
    </div>

    <div style="font-size:11px;color:var(--muted);padding:14px 18px 18px;line-height:1.6;">
      🛡 贝壳存管：付款后资金冻结在监管账户，入住确认无误后才结算给房东，未入住可按协议退款。
    </div>
  </div>

  <div class="cta">
    <a class="btn" href="lvju-app-paid.html" id="payBtn" style="flex:1;text-align:center;">确认支付 ¥1,176</a>
  </div>
</div>
<script src="screens/_region.js"></script>
<script src="screens/_jzapi.js"></script>
<script>
(function(){
  var JZ = window.BZF_JZ;
  var bankNm = document.getElementById('bankPayName');
  if (bankNm) bankNm.firstChild.textContent = JZ.regionBankName() + ' APP';

  var q = new URLSearchParams(location.search);
  var oid = q.get('order');
  var channel = q.get('channel');

  // ── 旅居预订（channel=booking）：双因子查单 → 收银台 → POST /booking/pay ──
  if (channel === 'booking') {
    var bNo = q.get('order_no') || '';
    var bPhone = q.get('phone') || '';
    var bPrice = q.get('price') || '';
    if (!bNo || !bPhone) { document.getElementById('paySub').textContent = '缺少订单参数，请从订单页重新进入'; return; }
    var lookup = function(){
      return fetch('/api/juzhu/booking/lookup', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ order_no: bNo, contact_phone: bPhone }) })
        .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); });
    };
    lookup().then(function(res){
      if (!res.ok) { document.getElementById('paySub').textContent = '订单加载失败：' + (res.d.error || ''); return; }
      var o = res.d.order;
      if (o.pay_status === 'paid') { location.replace('lvju-app-paid.html?channel=booking&order_no=' + encodeURIComponent(bNo) + '&phone=' + encodeURIComponent(bPhone)); return; }
      if (o.status !== 'pending') { document.getElementById('paySub').textContent = '订单状态为「' + o.status + '」，无需支付'; return; }
      var amt = (o.price_total != null ? o.price_total : (parseInt(bPrice, 10) || 0));
      document.querySelector('.ttl').innerHTML = '收银台<small>旅居预订 · ' + (o.project_name ? window.BZF_JZ.esc(o.project_name) : '预订订单') + '</small>';
      document.getElementById('payAmt').textContent = '¥' + Number(amt).toLocaleString();
      document.getElementById('paySub').textContent = '订单号 ' + o.order_no + ' · ' + o.checkin + ' → ' + o.checkout + ' · ' + o.nights + ' 晚';
      document.getElementById('payBtn').textContent = '确认支付 ¥' + Number(amt).toLocaleString();
      document.getElementById('payBtn').href = '#';
      document.getElementById('payBtn').addEventListener('click', function(e){
        e.preventDefault();
        document.querySelectorAll('.payopt').forEach(function(x){ if (x.classList.contains('sel')) method = x.querySelector('.nm').textContent.trim(); });
        fetch('/api/juzhu/booking/pay', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ order_no: bNo, contact_phone: bPhone, pay_method: method }) })
          .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
          .then(function(res){
            if (!res.ok) { alert(res.d.error || '支付失败'); return; }
            location.href = 'lvju-app-paid.html?channel=booking&order_no=' + encodeURIComponent(bNo) + '&phone=' + encodeURIComponent(bPhone);
          })
          .catch(function(){ alert('网络异常，请稍后再试'); });
      });
    }).catch(function(){ document.getElementById('paySub').textContent = '网络异常，请稍后再试'; });
    return;
  }

  if (!oid || channel !== 'jiazheng') return;

  var JZ = window.BZF_JZ;
  var order = null;
  var method = '贝壳支付';

  document.querySelectorAll('.payopt').forEach(function(el){
    el.addEventListener('click', function(){
      document.querySelectorAll('.payopt').forEach(function(x){ x.classList.remove('sel'); });
      el.classList.add('sel');
      method = el.querySelector('.nm').textContent.trim();
    });
  });

  JZ.get(oid).then(function(o){
    order = o;
    if (o.pay_status === 'paid') {
      location.replace('lvju-app-paid.html?order=' + encodeURIComponent(oid) + '&channel=jiazheng');
      return;
    }
    document.querySelector('.ttl').innerHTML = '收银台<small>家政服务 · ' + JZ.esc(o.category) + '</small>';
    document.getElementById('payAmt').textContent = '¥' + Number(o.fee).toLocaleString();
    document.getElementById('paySub').textContent = '订单号 ' + o.id + ' · ' + o.house + ' · ' + o.expectTime;
    document.getElementById('payBtn').textContent = '确认支付 ¥' + Number(o.fee).toLocaleString();
    document.getElementById('payBtn').href = '#';
    document.getElementById('payBtn').addEventListener('click', function(e){
      e.preventDefault();
      JZ.pay(oid, method).then(function(){
        location.href = 'lvju-app-paid.html?order=' + encodeURIComponent(oid) + '&channel=jiazheng';
      }).catch(function(err){ alert(err.message); });
    });
  }).catch(function(err){
    document.getElementById('paySub').textContent = '订单加载失败：' + err.message;
  });
})();
</script>
</body>
</html>
