<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:,">
<title>旅游路线 · 精选行程 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar ghost">
      <a class="bk" href="lvju-app-home-demo.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">旅游路线<small>精选行程 · 玩在贵州</small></div>
      <div class="act"><span>🔍</span><span>♡</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg s-xijiang"></div>
      <div class="in">
        <div class="ek">Itineraries</div>
        <h1>跟着路线走<br>少走弯路</h1>
        <p>编辑精选行程，每站直达玩法笔记，住哪帮你选好</p>
      </div>
    </div>

    <div class="filt" id="filt"></div>
    <div id="routeList">
      <div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <div class="banner gold">
      <span class="bi">🏡</span>
      <div class="bt"><b>这条线路的住宿</b><p>找房枢纽按城市 / 价格 / 评分帮你挑好房</p></div>
      <a class="go" id="hubLink" href="lvju-app-search.html">看住宿 ›</a>
    </div>

  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a href="lvju-app-search.html"><span class="ti">🔎</span>找房</a>
    <a class="on"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 旅游路线：数据来自 GET /api/juzhu/routes?city=（routes 表 = 周边玩法 spots 的有序编排，
   后台 juzhu-admin「内容」tab 维护）。站点点击 → 笔记详情页（lvju-app-spot-post?id=）。 */
(function(){
  var CITY = new URLSearchParams(location.search).get('city') || (function(){ try { return localStorage.getItem('bzf_jz_city') || ''; } catch(e){ return ''; } })() || '贵阳';
  var DAY_FILTER = 0;   // 0 = 全部
  var routesData = [];
  var FB = ['s-xijiang', 's-stilt', 's-wanfeng', 's-huangguoshu', 's-xiaoqikong', 's-fanjingshan', 's-qingyan', 's-country'];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function paintFilt(){
    var days = [];
    routesData.forEach(function(r){ if (days.indexOf(r.days) < 0) days.push(r.days); });
    days.sort(function(a,b){ return a - b; });
    var el = document.getElementById('filt');
    if (!days.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<a data-d="0"' + (DAY_FILTER === 0 ? ' class="on"' : '') + '>全部</a>' +
      days.map(function(d){ return '<a data-d="' + d + '"' + (DAY_FILTER === d ? ' class="on"' : '') + '>' + d + ' 日</a>'; }).join('');
  }
  function coverBg(list, i) {   // 封面缺失时按序回落示例底图（与列表页同风格）
    for (var j = 0; j < list.length; j++) { if (list[j] && list[j].cover_image) return 'background-image:url(' + esc(list[j].cover_image) + ')'; }
    return null;
  }
  function routeHtml(r, idx) {
    var stops = (r.stops || []).filter(function(s){ return s.spot; });
    var bg = r.cover_image ? 'background-image:url(' + esc(r.cover_image) + ')'
      : (coverBg(stops, idx) || '');
    var dayRows = stops.map(function(s, i) {
      var sp = s.spot;
      var thumb = sp.cover_image
        ? '<div class="rthumb" style="background:url(' + esc(sp.cover_image) + ') center/cover;"></div>'
        : '<div class="rthumb ' + FB[(idx + i) % FB.length] + '"></div>';
      return '<div class="tlstep"><a class="t" href="lvju-app-spot-post.html?id=' + sp.id + '" style="display:block;">' +
        esc(s.note || sp.name) + ' <span class="badge">' + esc(sp.type_label || '') + '</span></a>' +
        '<div class="s">' + esc(sp.summary || '') + (sp.duration ? ' · ⏱ ' + esc(sp.duration) : '') + '</div>' + thumb + '</div>';
    }).join('');
    var lead = stops.length ? stops[0].spot.name : (r.summary || '');
    var head = (stops.length > 1 ? stops[0].spot.name + ' → ' + stops[stops.length - 1].spot.name : lead) + ' · ' + r.days + ' 日';
    return '<div class="rcard" data-days="' + r.days + '">' +
      '<div class="rcard-hd"' + (bg ? ' style="' + bg + ' center/cover;"' : '') + '>' +
        '<div class="rcard-cap"><b>' + esc(r.name) + '</b><small>' + esc(head) + '</small></div></div>' +
      '<div class="rcard-bd"><div class="tl">' +
        '<div class="tlday"><div class="d"><span class="n">1</span>' + esc(r.days) + ' 日行程 · ' + stops.length + ' 站</div>' + dayRows + '</div>' +
      '</div></div></div>';
  }
  function paint(){
    var wrap = document.getElementById('routeList');
    var rows = DAY_FILTER ? routesData.filter(function(r){ return r.days === DAY_FILTER; }) : routesData;
    if (!rows.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:30px 16px;color:#9aa5a1;font-size:12px;line-height:1.8;">' +
        '当前城市「' + esc(CITY) + '」暂无在架路线 · 可到找房枢纽切换城市<br/>' +
        '<a href="lvju-app-search.html?city=' + encodeURIComponent(CITY) + '" style="display:inline-block;margin-top:10px;padding:8px 22px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;font-weight:700;font-size:12.5px;">去找房枢纽</a></div>';
      return;
    }
    wrap.innerHTML = rows.map(routeHtml).join('');
  }
  document.getElementById('filt').addEventListener('click', function(e){
    var a = e.target.closest('[data-d]');
    if (!a) return;
    DAY_FILTER = Number(a.getAttribute('data-d'));
    paintFilt(); paint();
  });
  document.getElementById('hubLink').href = 'lvju-app-search.html?city=' + encodeURIComponent(CITY);
  fetch('/api/juzhu/routes?city=' + encodeURIComponent(CITY)).then(function(r){ return r.json(); }).then(function(c){
    routesData = c.routes || [];
    paintFilt(); paint();
  }).catch(function(){
    document.getElementById('routeList').innerHTML =
      '<div style="text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接内容数据 · 请稍后再试</div>';
  });
})();
</script>
<style>
  /* 路线卡（数据驱动版）：封面头 + 行程时间线，站点行点击进笔记 */
  .rcard{margin:0 14px 16px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--border);box-shadow:0 8px 22px rgba(15,42,38,.06);}
  .rcard-hd{height:104px;position:relative;background-size:cover;background-position:center;background-color:#0c4d44;}
  .rcard-hd::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,18,16,.62),rgba(8,18,16,.05) 65%);}
  .rcard-cap{position:absolute;left:14px;right:14px;bottom:10px;color:#fff;z-index:2;}
  .rcard-cap b{font-family:var(--serif);font-size:18px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.35);display:block;}
  .rcard-cap small{font-size:10.5px;opacity:.94;margin-top:2px;display:block;}
  .rcard-bd{padding:12px 14px 6px;}
  .rcard-bd .tlstep .t{color:var(--ink);font-weight:600;}
</style>
</body>
</html>
