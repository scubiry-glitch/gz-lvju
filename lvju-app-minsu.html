<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:,">
<title>惠居 · 整栋·星级·管家 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar ghost">
      <a class="bk" href="lvju-app-home-demo.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">惠居<small>整栋 · 星级 · 管家</small></div>
      <div class="act"><a href="lvju-app-map.html">🗺</a><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg s-stilt"></div>
      <div class="in">
        <div class="ek">Boutique Stay</div>
        <h1>住进一间<br>有主人的房子</h1>
        <p>整栋包栋、星级惠居，每一间都过旅居星级评定与验真</p>
        <div class="stat">
          <div><b>1,800+</b><span>认证惠居</span></div>
          <div><b>92%</b><span>星级达标</span></div>
          <div><b>验真</b><span>扫码可查</span></div>
        </div>
      </div>
    </div>

    <div class="filt" id="distFilt">
      <a class="on" data-d="">全部</a>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>惠居门店</h2><span class="more" id="sortNote">星级优先</span></div>
    <div class="wrap" id="listingWrap">
      <div style="grid-column:1/-1;text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <div class="banner">
      <span class="bi">🛡</span>
      <div class="bt"><b>每间惠居一张验真卡</b><p>公安实名 · 住建备案 · 安心险，扫码核验</p></div>
      <a class="go" href="lvju-rating-standard.html">了解 ›</a>
    </div>

  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a class="on"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 惠居/民宿频道（channel=minsu，彩贝 5 维评级口径）数据统一读新居住数据库 catalog。
   门店概念（参考长租「区→项目→户型」）：一栋/一院 = 一家惠居门店，
   顶部行政区筛选切换门店；卡片点开进详情看房型。 */
(function(){
  var API = '/api/juzhu/catalog?city=guiyang&channel=minsu';
  var dmap = {}, projects = [];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }

  function paint(dname){
    var wrap = document.getElementById('listingWrap');
    var rows = projects.filter(function(p){
      if (!dname) return true;
      var d = dmap[p.district_id];
      return (d && d.name === dname) || (p.address || '').indexOf(dname) >= 0;
    });
    document.getElementById('sortNote').textContent = '共 ' + rows.length + ' 栋在营';
    if (!rows.length) {
      wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">该区域暂无在架惠居 · 切换区域或从「找房」进入</div>';
      return;
    }
    wrap.innerHTML = rows.map(function(p){
      var d = dmap[p.district_id];
      var loc = (d && p.address && p.address.indexOf(d.name) === 0) ? p.address : Array.from(new Set([d ? d.name : '', p.address || ''].filter(Boolean))).join(' · ');
      var r = p.rating || {};
      var star = (p.rating_status === 'passed' && r.stars)
        ? '<span class="star">★ ' + r.stars + ' 星惠居</span>' : '';
      var tags = (p.tags || []).slice(0, 3);
      var img = p.cover_image
        ? '<div class="img" style="background:url(' + esc(p.cover_image) + ') center/cover,#0c4d44;">'
        : '<div class="img s-xijiang">';
      return '<a class="mcard" href="lvju-app-detail.html?id=' + p.id + '">' + img + star + '<span class="like">♡</span>' +
        '<div class="cap"><div class="nm">' + esc(p.name) + '</div><div class="lo">' + esc(loc) + '</div></div></div>' +
        '<div class="ci"><div class="tags">' + (tags.length ? tags.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') : '<span>在架</span>') + '</div>' +
        '<div class="pr"><b>' + (p.price_from != null ? '¥' + fmt(p.price_from) + '<small>/晚起</small>' : '价格面议') + '</b><span class="bk">预订</span></div></div>' +
        '</a>';
    }).join('');
  }

  fetch(API).then(function(r){ return r.json(); }).then(function(cat){
    (cat.districts || []).forEach(function(d){ dmap[d.id] = d; });
    projects = (cat.projects || []).filter(function(p){ return p.channel === 'minsu'; });

    if (!projects.length) {
      document.getElementById('listingWrap').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">该频道暂无在架惠居 · 托管商家录入并通过彩贝评级后自动上架</div>';
      document.getElementById('sortNote').textContent = '0 栋在营';
      return;
    }

    // 行政区筛选 chips（门店按区浏览）
    var filt = document.getElementById('distFilt');
    var usedD = [];
    projects.forEach(function(p){ if (p.district_id && dmap[p.district_id] && usedD.indexOf(dmap[p.district_id].name) < 0) usedD.push(dmap[p.district_id].name); });
    if (usedD.length) {
      filt.innerHTML = '<a class="on" data-d="">全部区域</a>' + usedD.map(function(n){
        return '<a data-d="' + esc(n) + '">' + esc(n) + '</a>';
      }).join('');
      filt.querySelectorAll('a').forEach(function(a){
        a.onclick = function(){
          filt.querySelectorAll('a').forEach(function(x){ x.classList.remove('on'); });
          a.classList.add('on');
          paint(a.getAttribute('data-d') || '');
        };
      });
    }

    paint('');
  }).catch(function(){
    document.getElementById('listingWrap').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接新居住数据库 · 请稍后再试</div>';
  });
})();
</script>
</body>
</html>
