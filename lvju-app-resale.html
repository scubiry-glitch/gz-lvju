<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>二手 · 在售·真房源 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar ghost">
      <a class="bk" href="lvju-app-home-demo.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">二手房<small>在售 · 真房源</small></div>
      <div class="act"><a href="lvju-app-map.html">🗺</a><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg s-city"></div>
      <div class="in">
        <div class="ek">Resale</div>
        <h1>真房源<br>真价格</h1>
        <p>真房源认证 · VR 看房 · 成交价透明，买得放心</p>
        <div class="stat">
          <div><b>9.8万</b><span>在售房源</span></div>
          <div><b>VR</b><span>在线看房</span></div>
          <div><b>认证</b><span>真房源</span></div>
        </div>
      </div>
    </div>

    <div class="filt">
      <a class="on">全部</a><a>满五唯一</a><a>地铁</a><a>学区</a><a>电梯</a><a>南北通透</a>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>在售二手房</h2><span class="more" id="sortNote">总价排序</span></div>
    <div class="wrap" id="listingWrap">
      <div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <div class="banner gold">
      <span class="bi">🧭</span>
      <div class="bt"><b>过户税费 / 贷款怎么办？</b><p>置业导购全程陪跑：测算 · 顾问 · 签约存管</p></div>
      <a class="go" href="lvju-app-guide.html">去导购 ›</a>
    </div>

  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a class="on"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 二手频道（channel=resale，一房一档=units）数据统一读新居住数据库 catalog。 */
(function(){
  // 城市提示：URL ?city= > localStorage bzf_jz_city（首页切换器写入）> 默认贵阳
  var CITY = new URLSearchParams(location.search).get('city') || (function(){ try { return localStorage.getItem('bzf_jz_city') || ''; } catch(e){ return ''; } })() || 'guiyang';
  var API = '/api/juzhu/catalog?city=' + encodeURIComponent(CITY) + '&channel=resale';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }

  fetch(API).then(function(r){ return r.json(); }).then(function(cat){
    var wrap = document.getElementById('listingWrap');
    var dmap = {}; (cat.districts || []).forEach(function(d){ dmap[d.id] = d; });
    var pmap = {}; (cat.projects || []).forEach(function(p){ pmap[p.id] = p; });
    var units = (cat.units || []).filter(function(u){ var p = pmap[u.project_id]; return p && p.channel === 'resale'; });
    var rows = units.length ? units.map(function(u){ var p = pmap[u.project_id]; return { p: p, u: u }; })
      : (cat.projects || []).filter(function(p){ return p.channel === 'resale'; }).map(function(p){ return { p: p, u: null }; });

    if (!rows.length) {
      wrap.innerHTML = '<div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">该频道暂无在售房源 · 中介/业主委托录入后自动上架</div>';
      document.getElementById('sortNote').textContent = '0 套在售';
      return;
    }
    document.getElementById('sortNote').textContent = '共 ' + rows.length + ' 套在售';
    wrap.innerHTML = rows.map(function(r){
      var p = r.p || {}, u = r.u || {};
      var d = dmap[p.district_id];
      var meta = ['贵阳', d ? d.name : '', u.area_sqm ? fmt(u.area_sqm) + '㎡' : '', u.layout_label || ''].filter(Boolean).join(' · ');
      var tags = ((u.tags || p.tags || [])).slice(0, 3);
      var total = u.price_total != null ? u.price_total : p.price_total;
      var unit = (u.area_sqm && total) ? '¥' + (Math.round(total * 10000 / u.area_sqm / 100) / 100).toFixed(2) + '万/㎡' : (p.name || '');
      var price = total != null ? '¥' + fmt(total) + '<small> 万</small>'
        : (p.price_from != null ? '¥' + fmt(p.price_from) + '<small> 万起</small>' : '价格面议');
      var th = (u.cover_image || p.cover_image)
        ? '<div class="th" style="background:url(' + esc(u.cover_image || p.cover_image) + ') center/cover,#0c4d44;">'
        : '<div class="th s-city">';
      return '<a class="lrow" href="lvju-app-resale-detail.html?id=' + p.id + '&unit=' + u.id + '">' + th +
        '<span class="star">在售</span></div>' +
        '<div class="info"><div class="nm">' + esc(u.name ? p.name + ' · ' + u.name : p.name) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div>' +
        '<div class="tags">' + (tags.length ? tags.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') : '<span>在售</span>') + '</div>' +
        '<div class="pr"><b>' + price + '</b>' + (unit ? '<span class="unit">' + esc(unit) + '</span>' : '') + '</div></div></a>';
    }).join('');
  }).catch(function(){
    document.getElementById('listingWrap').innerHTML =
      '<div style="text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接新居住数据库 · 请稍后再试</div>';
  });
})();
</script>
</body>
</html>
