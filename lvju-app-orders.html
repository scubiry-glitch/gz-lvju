<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:,">
<title>我的订单 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-me.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">我的订单</div>
      <div class="act"><span>🔍</span></div>
    </div>

    <div id="loginBox" style="margin:14px 14px 0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 15px;display:none;">
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;">登录后自动展示我的预订</div>
      <div id="lgMsg" style="font-size:11px;color:var(--muted);margin-bottom:10px;">默认使用贝壳 App 登录；当前环境未检测到贝壳 SDK，已切换为密码登录（首次输入密码即自动注册）</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="lgPhone" placeholder="手机号" inputmode="numeric" maxlength="11" style="flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;outline:0;" />
        <input id="lgPwd" placeholder="密码（≥8位，首登自动注册）" type="password" style="flex:1.4;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;outline:0;" />
      </div>
      <button id="lgGo" style="width:100%;border:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:10px 0;cursor:pointer;">密码登录 / 注册</button>
      <button id="lgSdk" style="width:100%;margin-top:8px;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:13px;border-radius:999px;padding:9px 0;cursor:pointer;display:none;">🐚 贝壳 SDK 登录（检测到 App 环境）</button>
      <div id="lgErr" style="font-size:11px;color:#991b1b;margin-top:7px;display:none;"></div>
    </div>

    <div id="myBox" style="margin:14px 14px 0;display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px;">
        <div style="font-size:13px;font-weight:700;color:var(--ink);">📋 我的预订 <span id="myCnt" style="font-size:11px;color:var(--muted);font-weight:400;"></span></div>
        <a id="myOut" style="font-size:11px;color:var(--muted);cursor:pointer;">退出登录</a>
      </div>
      <div id="myList"></div>
    </div>

    <div id="lookupBox" style="margin:14px 14px 0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;">
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;">🔍 预订查单 / 取消（免登录）</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="qNo" placeholder="订单号 BKG-…" style="flex:1;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;outline:0;" />
        <input id="qPhone" placeholder="下单手机号" inputmode="numeric" maxlength="11" style="flex:1;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;outline:0;" />
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="qGo" style="flex:1;border:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:9px 0;cursor:pointer;">查询</button>
        <button id="qCancel" style="flex:1;border:1px solid var(--border);background:#fff;color:var(--danger);font-weight:600;font-size:13px;border-radius:999px;padding:9px 0;cursor:pointer;display:none;">取消此订单</button>
      </div>
      <div id="qMsg" style="font-size:11px;color:var(--muted);margin-top:7px;">输入订单号 + 下单手机号（双因子），可查询进度或取消待确认订单</div>
      <div id="qCard" style="display:none;margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;"></div>
    </div>
  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a href="lvju-app-lvju.html"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a class="on"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 预订查单/取消：POST /api/juzhu/booking/lookup（order_no+手机号 双因子，规则9 禁 ?phone= 旁路）
   响应手机号为打码形式（规则10）。支持 ?order_no=&phone= 自动带入（下单成功页跳转）。 */
(function(){
  var q = new URLSearchParams(location.search);
  document.getElementById('qNo').value = q.get('order_no') || '';
  document.getElementById('qPhone').value = q.get('phone') || '';
  var STATUS = { pending: ['待商家确认', 'wait'], confirmed: ['已确认 · 待入住', 'stay'], cancelled: ['已取消', 'done'] };
  function stOf(o){
    if (o.status === 'pending') {
      if (o.pay_status === 'unpaid') return ['待支付', 'wait'];
      if (o.pay_status === 'paid') return ['已支付 · 待商家确认', 'stay'];
      return STATUS.pending;
    }
    if (o.status === 'confirmed' && o.pay_status === 'refunded') return ['已退款', 'done'];
    if (o.status === 'cancelled' && o.pay_status === 'refunded') return ['已取消 · 已退款', 'done'];
    return STATUS[o.status] || [o.status, 'stay'];
  }
  function payLink(o, phone){
    return 'lvju-app-pay.html?channel=booking&order_no=' + encodeURIComponent(o.order_no) + '&phone=' + encodeURIComponent(phone || '');
  }
  var cur = null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }
  function render(o){
    cur = o;
    var st = stOf(o);
    var card = document.getElementById('qCard');
    card.style.display = 'block';
    card.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-size:11px;color:var(--muted);">' + esc(o.order_no) + '</span>' +
        '<span style="font-size:11px;font-weight:700;color:var(--brand-deep);">' + esc(st[0]) + '</span>' +
      '</div>' +
      '<div style="font-size:14px;font-weight:700;color:var(--ink);margin:5px 0 2px;">' + esc(o.project_name || ('项目 #' + o.project_id)) + ' · ' + esc(o.channel === 'minsu' ? '惠居' : '租赁住宿') + '</div>' +
      '<div style="font-size:12px;color:var(--muted);">' + esc(o.checkin) + ' → ' + esc(o.checkout) + ' · ' + o.nights + ' 晚</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:2px;">联系人 ' + esc(o.contact_name) + ' · ' + esc(o.contact_phone_masked) + '</div>' +
      '<div style="font-size:13px;font-weight:700;color:var(--gold-deep);margin-top:5px;">合计 ¥' + fmt(o.price_total) + '</div>' +
      (o.status === 'pending' && o.pay_status === 'unpaid'
        ? '<a href="' + payLink(o, document.getElementById('qPhone').value.trim()) + '" style="display:block;text-align:center;margin-top:8px;background:var(--brand-deep);color:#fff;font-size:12px;font-weight:700;border-radius:9px;padding:9px 0;text-decoration:none;">去支付 →</a>'
        : '') +
      (o.pay_status === 'paid' ? '<div style="font-size:11px;color:var(--success);margin-top:4px;">✓ 已支付' + (o.pay_method ? ' · ' + esc(o.pay_method) : '') + '</div>' : '');
    document.getElementById('qCancel').style.display = o.status === 'pending' ? 'block' : 'none';
  }
  function msg(m, isErr){ var el = document.getElementById('qMsg'); el.textContent = m; el.style.color = isErr ? '#991b1b' : 'var(--muted)'; }
  function lookup(){
    var no = document.getElementById('qNo').value.trim(), ph = document.getElementById('qPhone').value.trim();
    if (!no || !ph) { msg('请填订单号和下单手机号', true); return; }
    msg('查询中…', false);
    document.getElementById('qCancel').style.display = 'none';
    document.getElementById('qCard').style.display = 'none';
    fetch('/api/juzhu/booking/lookup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ order_no: no, contact_phone: ph }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (!res.ok) { msg(res.j.error || '查询失败', true); return; }
        msg('查询成功（手机号已打码展示）', false);
        render(res.j.order);
      }).catch(function(){ msg('网络异常，请稍后再试', true); });
  }
  document.getElementById('qGo').addEventListener('click', lookup);
  document.getElementById('qCancel').addEventListener('click', function(){
    if (!cur || cur.status !== 'pending') return;
    if (!confirm('确定取消订单 ' + cur.order_no + ' 吗？')) return;
    fetch('/api/juzhu/booking/cancel', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ order_no: cur.order_no, contact_phone: document.getElementById('qPhone').value.trim() }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (!res.ok) { msg(res.j.error || '取消失败', true); return; }
        msg('已取消', false);
        cur.status = 'cancelled';
        render(cur);
      }).catch(function(){ msg('网络异常，请稍后再试', true); });
  });
  if (q.get('order_no') && q.get('phone')) lookup();

  /* ── 登录（贝壳 SDK 默认 → 密码兜底）+ 我的预订 ── */
  var lgBox = document.getElementById('loginBox');
  var myBox = document.getElementById('myBox');
  function tok(){ try { return localStorage.getItem('BJZ_TOKEN') || ''; } catch(e){ return ''; } }
  function authH(){ var h = {}; var t = tok(); if (t) h['Authorization'] = 'Bearer ' + t; return h; }
  function sdkProbe(){
    // App 内 jsbridge3 / jsbridgesdk 注入的全局；E2E 可用 window.__beikeSdk 模拟
    return window.LJBridge || window.jsbridge3 || window.BeiKeSdk || window.__beikeSdk || null;
  }
  function myRender(items){
    document.getElementById('myCnt').textContent = items.length ? '· ' + items.length + ' 笔' : '';
    if (!items.length) { document.getElementById('myList').innerHTML = '<div class="ordcard" style="text-align:center;"><div style="font-size:12px;color:var(--muted);padding:10px 2px;">还没有预订 · 去「找房」挑一间</div></div>'; return; }
    var ST = { pending: ['待商家确认', 'wait'], confirmed: ['已确认 · 待入住', 'stay'], cancelled: ['已取消', 'done'] };
    document.getElementById('myList').innerHTML = items.map(function(o){
      var st = stOf(o);
      var cover = o.project_cover
        ? '<div class="th" style="background:url(' + esc(o.project_cover) + ') center/cover;"></div>'
        : '<div class="th s-xijiang"></div>';
      return '<div class="ordcard">' +
        '<div class="oh"><span class="shop">🐚 贝壳旅居 · ' + esc(o.channel === 'minsu' ? '惠居' : '租赁住宿') + '</span><span class="stt ' + st[1] + '">' + esc(st[0]) + '</span></div>' +
        '<div class="ob">' + cover +
          '<div class="oi">' +
            '<div class="nm">' + esc(o.project_name || ('项目#' + o.project_id)) + '</div>' +
            '<div class="meta">' + esc(o.checkin) + ' → ' + esc(o.checkout) + ' · ' + o.nights + ' 晚</div>' +
            '<div class="amt">合计 <b>¥' + fmt(o.price_total) + '</b> · 订单号 …' + esc(o.order_no.slice(-4)) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="of">' +
          (o.status === 'pending' ? '<a data-myid="' + o.id + '" style="color:var(--danger);cursor:pointer;">取消订单</a>' : '') +
          (o.status === 'pending' && o.pay_status === 'unpaid' ? '<a href="' + payLink(o, o.contact_phone_raw) + '" style="color:var(--brand-deep);font-weight:700;cursor:pointer;">去支付 →</a>' : '') +
          '<a href="lvju-app-detail.html?id=' + o.project_id + '">房源详情</a>' +
          '<a class="primary" href="lvju-app-order-detail.html?order_no=' + encodeURIComponent(o.order_no) + '">订单详情</a>' +
        '</div>' +
      '</div>';
    }).join('');
    document.querySelectorAll('[data-myid]').forEach(function(a){
      a.onclick = function(){
        if (!confirm('确定取消该预订吗？')) return;
        var o = items.filter(function(x){ return String(x.id) === a.getAttribute('data-myid'); })[0];
        fetch('/api/juzhu/booking/cancel', { method:'POST', headers: Object.assign({'Content-Type':'application/json'}, authH()),
          body: JSON.stringify({ order_no: o.order_no, contact_phone: o.contact_phone_raw || '' }) })
          .then(function(r){ return r.json(); })
          .then(function(j){ if (j.error) { alert(j.error); return; } loadMine(); })
          .catch(function(){ alert('网络异常'); });
      };
    });
  }
  function loadMine(){
    lgBox.style.display = 'none';
    myBox.style.display = 'block';
    fetch('/api/juzhu/booking/my', { headers: authH() })
      .then(function(r){ if (r.status === 401) { try { localStorage.removeItem('BJZ_TOKEN'); } catch(e){} lgBox.style.display = 'block'; myBox.style.display = 'none'; throw new Error('401'); } return r.json(); })
      .then(function(j){ myRender(j.items || []); })
      .catch(function(e){ if (e.message !== '401') { document.getElementById('myList').innerHTML = '<div style="font-size:12px;color:#991b1b;">加载失败</div>'; } });
  }
  function afterLogin(j){
    try { localStorage.setItem('BJZ_TOKEN', j.token); } catch(e){}
    loadMine();
  }
  function trySdkLogin(){
    var sdk = sdkProbe();
    if (!sdk || typeof sdk.getUserInfo !== 'function') return Promise.resolve(false);
    return Promise.resolve().then(function(){ return sdk.getUserInfo(); }).then(function(info){
      var i = info && info.data ? info.data : info;
      var uid = i && (i.uid || i.userId || i.id), ph = i && (i.phone || i.mobile);
      if (!uid || !ph) return false;
      return fetch('/api/juzhu/auth/beike', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ uid: String(uid), phone: String(ph), name: (i.name || '').trim() }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j.ok) { afterLogin(j); return true; } return false; });
    }).catch(function(){ return false; });
  }
  function boot(){
    if (tok()) { loadMine(); return; }
    lgBox.style.display = 'block';
    trySdkLogin().then(function(ok){
      if (ok) return;
      lgBox.style.display = 'block';
      document.getElementById('lgMsg').textContent = '当前环境未检测到贝壳 SDK，已切换为密码登录（首次输入密码即自动注册）';
      document.getElementById('lgSdk').style.display = sdkProbe() ? 'block' : 'none';
    });
  }
  document.getElementById('lgGo').addEventListener('click', function(){
    var ph = document.getElementById('lgPhone').value.trim(), pw = document.getElementById('lgPwd').value;
    var eEl = document.getElementById('lgErr');
    if (!/^1\d{10}$/.test(ph) || pw.length < 8) { eEl.textContent = '手机号 11 位、密码至少 8 位'; eEl.style.display = 'block'; return; }
    eEl.style.display = 'none';
    fetch('/api/juzhu/auth/tenant', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone: ph, password: pw }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (!res.ok) { eEl.textContent = res.j.error || '登录失败'; eEl.style.display = 'block'; return; }
        afterLogin(res.j);
      }).catch(function(){ eEl.textContent = '网络异常'; eEl.style.display = 'block'; });
  });
  document.getElementById('lgSdk').addEventListener('click', function(){
    trySdkLogin().then(function(ok){ if (!ok) { document.getElementById('lgErr').textContent = 'SDK 登录失败，请用密码登录'; document.getElementById('lgErr').style.display = 'block'; } });
  });
  document.getElementById('myOut').addEventListener('click', function(){
    try { localStorage.removeItem('BJZ_TOKEN'); } catch(e){} location.reload();
  });
  boot();
})();
</script>
</body>
</html>
