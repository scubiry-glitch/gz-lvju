<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>预定下单 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
<style>
  .bfield{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);background:#fff;}
  .bfield .l{font-size:13px;color:var(--muted);flex-shrink:0;}
  .bfield input{flex:1;text-align:right;border:0;outline:0;font-size:14px;color:var(--ink);background:transparent;font-family:var(--font);}
  .okbox{margin:14px 18px;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:14px;padding:16px;text-align:center;}
  .okbox .no{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;color:var(--brand-deep);letter-spacing:.5px;}
  .err{margin:12px 18px;padding:10px 13px;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;font-size:12px;color:#991b1b;display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-detail.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">预定下单<small>填写并核对提交</small></div>
    </div>

    <div class="steps">
      <span class="st on"><span class="n">1</span>预定下单</span><span class="sep">›</span>
      <span class="st"><span class="n">2</span>商家确认</span><span class="sep">›</span>
      <span class="st"><span class="n">3</span>完成</span>
    </div>

    <div id="okBox" class="okbox" style="display:none;">
      <div style="font-size:26px;">✅</div>
      <div style="font-size:14px;font-weight:700;margin:6px 0 2px;">预订提交成功</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">订单号（请留存，配合手机号查单/取消）</div>
      <div class="no" id="okNo"></div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">商家确认后订单生效 · 状态可在「订单」页查询</div>
      <a href="lvju-app-orders.html" style="display:inline-block;margin-top:9px;font-size:12px;font-weight:600;color:var(--brand-deep);text-decoration:none;border:1px solid var(--brand);border-radius:999px;padding:6px 16px;">去订单页查状态 →</a>
    </div>

    <div id="formBox">
      <div class="minihouse">
        <div class="th s-xijiang" id="bThumb"></div>
        <div class="mi">
          <div class="nm" id="bName">加载中…</div>
          <div class="meta" id="bMeta"></div>
          <div class="st" id="bStar"></div>
        </div>
      </div>

      <div class="seg">入住信息</div>
      <div>
        <div class="bfield"><span class="l">入住日期</span><input type="date" id="fIn" /></div>
        <div class="bfield"><span class="l">离店日期</span><input type="date" id="fOut" /></div>
        <div class="bfield"><span class="l">房型</span>
          <select id="fUnit" style="border:0;outline:0;font-size:13px;text-align:right;background:transparent;color:var(--ink);"></select>
        </div>
      </div>

      <div class="seg">入住人 / 联系方式</div>
      <div>
        <div class="bfield"><span class="l">联系人</span><input id="fName" placeholder="姓名" /></div>
        <div class="bfield"><span class="l">手机号</span><input id="fPhone" placeholder="11 位手机号（用于查单/取消）" inputmode="numeric" maxlength="11" /></div>
      </div>

      <div class="seg">价格明细</div>
      <div class="panel">
        <div class="kv"><span class="k" id="pLine">房费 —</span><span class="v" id="pTotal">—</span></div>
        <div class="kv big"><span class="k">合计</span><span class="v" id="pSum">—</span></div>
      </div>

      <div id="bErr" class="err"></div>

      <div style="font-size:11px;color:var(--muted);padding:14px 18px 18px;line-height:1.6;">
        提交即同意《旅居预订与退改协议》。资金由 <b style="color:var(--brand-deep);">贝壳存管</b>，商家确认后订单生效；手机号仅用于订单查询与商家联系，不会完整展示。
      </div>
    </div>
  </div>

  <div class="cta">
    <div class="p" id="cTotal"><b>—</b><span>合计 · 待选日期</span></div>
    <a class="btn" id="bSubmit" style="cursor:pointer;">提交订单</a>
  </div>
</div>
<script>
/* 预订下单：读库（/projects/:id + /units）→ POST /api/juzhu/booking 真实落库。
   ?id= 项目（必填）、?unit= 户型、?checkin=/?checkout= 由详情页日历透传。 */
(function(){
  var q = new URLSearchParams(location.search);
  var id = parseInt(q.get('id') || '', 10);
  var err = document.getElementById('bErr');
  function showErr(m){ err.textContent = m; err.style.display = 'block'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }
  if (!id) { showErr('缺少房源参数 · 请从列表/详情进入'); document.getElementById('bSubmit').style.opacity = .4; return; }

  var unitSel = document.getElementById('fUnit');
  var perNight = 0;
  function calc(){
    var ci = document.getElementById('fIn').value, co = document.getElementById('fOut').value;
    var n = (ci && co) ? Math.round((new Date(co) - new Date(ci)) / 864e5) : 0;
    var total = (n >= 1 && perNight) ? perNight * n : 0;
    document.getElementById('pLine').textContent = '房费 ¥' + fmt(perNight) + ' × ' + (n > 0 ? n : '—') + ' 晚';
    document.getElementById('pTotal').textContent = total ? '¥' + fmt(total) : '—';
    document.getElementById('pSum').textContent = total ? '¥' + fmt(total) : '—';
    document.querySelector('#cTotal b').textContent = total ? '¥' + fmt(total) : '—';
    document.querySelector('#cTotal span').textContent = n >= 1 ? '共 ' + n + ' 晚' : '待选日期';
  }
  document.getElementById('fIn').addEventListener('change', calc);
  document.getElementById('fOut').addEventListener('change', calc);
  unitSel.addEventListener('change', function(){
    var o = unitSel.options[unitSel.selectedIndex];
    perNight = o && o.dataset && o.dataset.per ? +o.dataset.per : perNight;
    calc();
  });

  Promise.all([
    fetch('/api/juzhu/projects/' + id).then(function(r){ if (!r.ok) throw new Error('项目加载失败'); return r.json(); }),
    fetch('/api/juzhu/projects/' + id + '/units').then(function(r){ if (!r.ok) throw new Error('户型加载失败'); return r.json(); })
  ]).then(function(rs){
    var p = rs[0] || {}, d = rs[1] || {};
    var units = d.units || [];
    document.getElementById('bName').textContent = p.name || '';
    document.getElementById('bMeta').textContent = p.address || '';
    var r = p.rating; if (typeof r === 'string') { try { r = JSON.parse(r); } catch(e) { r = {}; } }
    r = r || {};
    document.getElementById('bStar').textContent = (p.rating_status === 'passed' && r.stars) ? '★ ' + r.stars + ' 星 · 已评级' : '在架';
    if (p.cover_image) document.getElementById('bThumb').style.background = 'url(' + p.cover_image + ') center/cover';
    perNight = p.price_from || 0;
    unitSel.innerHTML = '<option value="">不限房型（按起价）</option>' + units.map(function(u){
      var pn = u.rent_monthly ? Math.round(u.rent_monthly / 30) : (p.price_from || 0);
      return '<option value="' + u.id + '" data-per="' + pn + '">' + esc(u.name) + (u.area_sqm ? ' · ' + fmt(u.area_sqm) + '㎡' : '') + '</option>';
    }).join('');
    var qUnit = parseInt(q.get('unit') || '', 10);
    if (qUnit) unitSel.value = String(qUnit);
    if (unitSel.selectedIndex > 0) { var o = unitSel.options[unitSel.selectedIndex]; perNight = +o.dataset.per || perNight; }
    var ci = q.get('checkin'), co = q.get('checkout');
    if (ci) document.getElementById('fIn').value = ci;
    if (co) document.getElementById('fOut').value = co;
    calc();
  }).catch(function(e){
    showErr('房源加载失败：' + e.message);
  });

  document.getElementById('bSubmit').addEventListener('click', function(){
    err.style.display = 'none';
    var body = {
      project_id: id,
      unit_id: unitSel.value ? parseInt(unitSel.value, 10) : null,
      checkin: document.getElementById('fIn').value,
      checkout: document.getElementById('fOut').value,
      contact_name: document.getElementById('fName').value.trim(),
      contact_phone: document.getElementById('fPhone').value.trim()
    };
    fetch('/api/juzhu/booking', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (!res.ok) { showErr(res.j.error || '提交失败'); return; }
        document.getElementById('okNo').textContent = res.j.order_no;
        document.getElementById('okBox').style.display = 'block';
        document.getElementById('formBox').style.display = 'none';
        document.querySelector('.cta').style.display = 'none';
      })
      .catch(function(){ showErr('网络异常，请稍后再试'); });
  });
})();
</script>
</body>
</html>
