<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>预订成功 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-home-demo.html">✕</a>
      <div class="ttl">支付完成</div>
    </div>

    <div class="steps">
      <span class="st done"><span class="n">✓</span>预定下单</span><span class="sep">›</span>
      <span class="st done"><span class="n">✓</span>支付</span><span class="sep">›</span>
      <span class="st on"><span class="n">3</span>完成</span>
    </div>

    <div class="success">
      <div class="ck">✓</div>
      <h2 id="okTitle">预订成功</h2>
      <p id="okDesc">电子凭证已发送至 138****6688<br>资金由贝壳存管，入住确认后结算给房东</p>
    </div>

    <div class="minihouse" id="orderCard">
      <div class="th s-xijiang"></div>
      <div class="mi">
        <div class="nm" id="svcName">云上观景惠居</div>
        <div class="meta" id="svcMeta">6/14 — 6/16 · 2 晚 · 观景大床房</div>
        <div class="st" id="svcSt">订单号 LJ20260614-8821 · 待入住</div>
      </div>
    </div>

    <div class="seg" id="segLabel">入住须知</div>
    <div class="panel" id="infoPanel">
      <div class="kv"><span class="k">入住时间</span><span class="v">14:00 后</span></div>
      <div class="kv"><span class="k">离店时间</span><span class="v">12:00 前</span></div>
      <div class="kv"><span class="k">旅居管家</span><span class="v">杨晓芳 · L4 持证</span></div>
      <div class="kv"><span class="k">到店核验</span><span class="v">出示电子凭证二维码</span></div>
    </div>

    <div class="btnrow">
      <a class="ghost" href="index.html" id="btnHome">返回首页</a>
      <a class="solid" href="juzhu-order-progress.html" id="btnOrder">查看进度</a>
    </div>
    <div style="height:18px;"></div>
  </div>
</div>
<script src="screens/_region.js"></script>
<script src="screens/_jzapi.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var oid = q.get('order');

  // ── 旅居预订支付完成（channel=booking）：双因子查单回显 ──
  if (q.get('channel') === 'booking') {
    var bNo = q.get('order_no') || '', bPhone = q.get('phone') || '';
    document.querySelector('.ttl').textContent = '支付完成';
    document.getElementById('okTitle').textContent = '支付成功';
    document.getElementById('okDesc').innerHTML = '资金已存管冻结，商家确认后订单生效<br>可随时在「订单」页查看状态或申请取消';
    if (bNo && bPhone) {
      fetch('/api/juzhu/booking/lookup', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ order_no: bNo, contact_phone: bPhone }) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          var o = d.order || {};
          document.getElementById('svcName').textContent = o.project_name || '旅居预订';
          document.getElementById('svcMeta').textContent = o.checkin + ' → ' + o.checkout + ' · ' + o.nights + ' 晚';
          document.getElementById('svcSt').textContent = '订单号 ' + o.order_no + ' · 已支付 · 待商家确认';
          document.getElementById('infoPanel').innerHTML =
            '<div class="kv"><span class="k">预订项目</span><span class="v">' + (o.project_name || ('#' + o.project_id)) + '</span></div>' +
            '<div class="kv"><span class="k">实付金额</span><span class="v">¥' + Number(o.price_total).toLocaleString() + '</span></div>' +
            '<div class="kv"><span class="k">入住 / 离店</span><span class="v">' + o.checkin + ' / ' + o.checkout + '</span></div>' +
            '<div class="kv"><span class="k">后续流程</span><span class="v">商家确认后订单生效</span></div>';
          var bo = document.getElementById('btnOrder');
          bo.href = 'lvju-app-orders.html';
          bo.textContent = '查看我的预订';
        }).catch(function(){});
    }
    document.getElementById('btnOrder').href = 'lvju-app-orders.html';
    return;
  }

  if (!oid || q.get('channel') !== 'jiazheng') return;
  var JZ = window.BZF_JZ;
  JZ.get(oid).then(function(o){
    document.querySelector('.ttl').textContent = '支付完成';
    document.getElementById('okTitle').textContent = '支付成功';
    document.getElementById('okDesc').innerHTML = '资金已存管冻结，中台将按规则派单<br>可在进度页查看服务者接单状态';
    document.getElementById('svcName').textContent = o.category;
    document.getElementById('svcMeta').textContent = o.house + ' · ' + o.expectTime;
    document.getElementById('svcSt').textContent = '订单号 ' + o.id + ' · 待派单';
    document.getElementById('segLabel').textContent = '服务须知';
    document.getElementById('infoPanel').innerHTML =
      '<div class="kv"><span class="k">服务类型</span><span class="v">' + JZ.esc(o.type) + '</span></div>' +
      '<div class="kv"><span class="k">实付金额</span><span class="v">¥' + Number(o.fee).toLocaleString() + '</span></div>' +
      '<div class="kv"><span class="k">服务者标准</span><span class="v">L2+ 持证 · 已投保</span></div>' +
      '<div class="kv"><span class="k">中台派单</span><span class="v"><a href="screens/p-service-demand.html" style="color:var(--brand);">查看工单池 →</a></span></div>';
    document.getElementById('btnOrder').href = 'juzhu-order-progress.html?order=' + encodeURIComponent(o.id);
  });
})();
</script>
</body>
</html>
