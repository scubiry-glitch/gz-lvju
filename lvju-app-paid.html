<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>预订成功 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .ic-timer{display:inline-block;width:12px;height:12px;vertical-align:-1.5px;margin-right:3px;object-fit:contain;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-home-demo.html">✕</a>
      <div class="ttl">支付完成</div>
    </div>

    <div class="steps">
      <span class="st done"><span class="n">✓</span>预定下单</span><span class="sep">›</span>
      <span class="st done"><span class="n">✓</span>支付</span><span class="sep">›</span>
      <span class="st on"><span class="n">3</span>完成</span>
    </div>

    <div class="success">
      <div class="ck">✓</div>
      <h2 id="okTitle">预订成功</h2>
      <p id="okDesc">电子凭证已发送至 138****6688<br>资金由贝壳存管，入住确认后结算给房东</p>
    </div>

    <div class="minihouse" id="orderCard">
      <div class="th s-xijiang"></div>
      <div class="mi">
        <div class="nm" id="svcName">云上观景民宿</div>
        <div class="meta" id="svcMeta">6/14 — 6/16 · 2 晚 · 观景大床房</div>
        <div class="st" id="svcSt">订单号 LJ20260614-8821 · 待入住</div>
      </div>
    </div>

    <div class="seg" id="segLabel">入住须知</div>
    <div class="panel" id="infoPanel">
      <div class="kv"><span class="k">入住时间</span><span class="v">14:00 后</span></div>
      <div class="kv"><span class="k">离店时间</span><span class="v">12:00 前</span></div>
      <div class="kv"><span class="k">旅居管家</span><span class="v">杨晓芳 · L4 持证</span></div>
      <div class="kv"><span class="k">到店核验</span><span class="v">出示电子凭证二维码</span></div>
    </div>

    <div class="btnrow">
      <a class="ghost" href="index.html" id="btnHome">返回首页</a>
      <a class="solid" href="juzhu-order-progress.html" id="btnOrder">查看进度</a>
    </div>
    <div style="height:18px;"></div>
  </div>
</div>
<script src="screens/_region.js"></script>
<script src="jsbridgesdk.js?v=1"></script>
<script src="screens/_cashier.js?v=2"></script>
<script src="screens/_beike-login.js?v=18"></script>
<script src="screens/_jzapi.js?v=12"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var oid = q.get('order');
  var htmlEscape = function(value){ return String(value == null ? '' : value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];}); };

  // ── 旅居预订支付完成（channel=booking）：双因子查单回显 ──
  if (q.get('channel') === 'booking') {
    var bNo = q.get('order_no') || '', bPhone = q.get('phone') || '';
    var appOrderId = q.get('app_order_id') || '';
    document.querySelector('.ttl').textContent = '支付完成';
    document.getElementById('okTitle').textContent = '支付结果确认中';
    document.getElementById('okDesc').textContent = '正在向支付中台确认支付结果，请勿重复支付';
    if (bNo) {
      var headers = {'Content-Type':'application/json'};
      try {
        if (window.BZF_BEIKE_LOGIN && BZF_BEIKE_LOGIN.authHeaders) {
          var ah = BZF_BEIKE_LOGIN.authHeaders() || {};
          Object.keys(ah).forEach(function(k){ headers[k] = ah[k]; });
        } else {
          var token = localStorage.getItem('BJZ_TOKEN') || localStorage.getItem('BZF_SESSION_TOKEN') || '';
          if (token) headers.Authorization = 'Bearer ' + token;
        }
      } catch (_) {}
      var bookingTries=0, bookingTimer=null, bookingPayment=null, bookingInFlight=false;
      function refreshBooking(){
      if(bookingInFlight)return;
      bookingInFlight=true;bookingPayment=null;clearTimeout(bookingTimer);
      return fetch('/api/juzhu/payment/query', { method:'POST', headers: headers,
        body: JSON.stringify({ order_no: bNo, contact_phone: bPhone, app_order_id: appOrderId }) })
        .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'支付查询失败');bookingPayment=d;});})
        .catch(function(){ /* Legacy lookup remains the fallback when query is temporarily unavailable. */ })
        .then(function(){ return fetch('/api/juzhu/booking/lookup', { method:'POST', headers:headers,
          body: JSON.stringify({ order_no: bNo, contact_phone: bPhone }) }); })
        .then(function(r){ return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'订单查询失败');return d;}); })
        .then(function(d){
          var o = d.order || {};
          var state=window.BZF_CASHIER.orderStatus(bookingPayment,o),paid=state==='paid',couponFunded=state==='coupon_funded';
          var closed=state==='closed'||state==='expired',refunded=state==='refunded'||state==='partially_refunded';
          var title=paid?'支付成功':couponFunded?'用券预订成功':state==='refunded'?'退款已完成':state==='partially_refunded'?'已部分退款':state==='refunding'?'退款处理中':closed?'订单已关闭':'支付结果确认中';
          document.getElementById('okTitle').textContent = title;
          var desc=paid?'资金已存管冻结，商家确认后订单生效':couponFunded?'卡券已全额抵扣，现金应付 ¥0.00；商家确认后订单生效':(refunded||state==='refunding')?'退款进度以订单页为准':closed?'该预订已结束，可在订单页查看详情':'尚未确认支付成功，请稍后刷新或返回订单页查看';
          document.getElementById('okDesc').textContent = desc;
          if (o.cancel_policy_text) {
            var escCp = String(o.cancel_policy_text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            document.getElementById('okDesc').innerHTML = desc + ' · <img class="ic-timer" src="assets/lvju/icons/booking-timer.png" alt="" width="12" height="12">' + escCp;
          }
          document.getElementById('svcName').textContent = o.project_name || '旅居预订';
          document.getElementById('svcMeta').textContent = o.checkin + ' → ' + o.checkout + ' · ' + o.nights + ' 晚';
          document.getElementById('svcSt').textContent = '订单号 ' + o.order_no + ' · ' + (paid ? '已支付 · 待商家确认' : couponFunded ? '券已抵扣 · 待商家确认' : title);
          document.getElementById('infoPanel').innerHTML =
            '<div class="kv"><span class="k">预订项目</span><span class="v">' + htmlEscape(o.project_name || ('#' + o.project_id)) + '</span></div>' +
            (Number(o.coupon_minor)>0?'<div class="kv"><span class="k">签约结算价</span><span class="v">¥'+Number(o.price_total).toFixed(2)+'</span></div><div class="kv"><span class="k">券抵</span><span class="v">−¥'+(Number(o.coupon_minor)/100).toFixed(2)+'</span></div>':'') +
            '<div class="kv"><span class="k">现金应付</span><span class="v">¥' + (o.cash_due_minor==null?Number(o.price_total):Number(o.cash_due_minor)/100).toFixed(2) + '</span></div>' +
            '<div class="kv"><span class="k">入住 / 离店</span><span class="v">' + htmlEscape(o.checkin) + ' / ' + htmlEscape(o.checkout) + '</span></div>' +
            '<div class="kv"><span class="k">后续流程</span><span class="v">商家确认后订单生效</span></div>';
          var bo = document.getElementById('btnOrder');
          bo.href = 'lvju-app-orders.html';
          bo.textContent = '查看我的预订';
          if(!paid&&!couponFunded&&!closed&&!refunded&&bookingTries++<6)bookingTimer=setTimeout(refreshBooking,1500);
        }).catch(function(error){document.getElementById('okDesc').textContent=error.message||'查询暂不可用，请从订单页重试';})
        .then(function(){bookingInFlight=false;});
      }
      refreshBooking();
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){clearTimeout(bookingTimer);bookingTries=0;refreshBooking();}});
    }
    document.getElementById('btnOrder').href = 'lvju-app-orders.html';
    return;
  }

  if (!oid || q.get('channel') !== 'jiazheng') return;
  var JZ = window.BZF_JZ;
  document.querySelector('.ttl').textContent = '支付结果';
  document.getElementById('okTitle').textContent = '正在确认支付结果';
  document.getElementById('okDesc').textContent = '请稍候，可返回订单页查看进度';
  document.getElementById('svcName').textContent = '生活服务';
  document.getElementById('svcMeta').textContent = '';
  document.getElementById('svcSt').textContent = '订单号 ' + oid;
  document.getElementById('infoPanel').textContent = '';
  document.getElementById('btnOrder').href = 'juzhu-jiazheng-order-detail.html?order_ref=' + encodeURIComponent(oid);
  function checkJzResult(){
    JZ.paymentStatus(oid).then(function(payment){
      var paid = payment.order_pay_status === 'paid', couponFunded = payment.order_pay_status === 'coupon_funded';
      document.getElementById('okTitle').textContent = paid ? '支付成功' : couponFunded ? '用券下单成功' : (payment.order_pay_status === 'refunded' ? '已退款' : payment.order_pay_status === 'closed' ? '订单已关闭' : '支付结果确认中');
      document.getElementById('okDesc').textContent = paid ? '已确认付款，服务进度以订单页为准' : couponFunded ? '卡券已全额抵扣，现金应付 ¥0.00；服务进度以订单页为准' : '尚未确认支付成功，请稍后刷新或返回订单查看';
    }).catch(function(error){ document.getElementById('okTitle').textContent = '暂未确认支付'; document.getElementById('okDesc').textContent = error.message; });
    JZ.get(oid).then(function(order){
      document.getElementById('svcName').textContent = order.product_name || order.category;
      document.getElementById('svcMeta').textContent = order.house + ' · ' + order.expectTime;
      var amount=order.amount_minor!=null?Number(order.amount_minor)/100:Number(order.fee)/(order.payment_mode==='pay_center'?100:1);
      document.getElementById('infoPanel').textContent = Number(order.coupon_minor)>0
        ? '服务结算价 ¥' + (Number(order.fee)/100).toFixed(2) + ' · 券抵 −¥' + (Number(order.coupon_minor)/100).toFixed(2) + ' · 现金应付 ¥' + amount.toFixed(2)
        : '现金应付 ¥' + amount.toFixed(2);
    }).catch(function(){});
  }
  checkJzResult();
  var checkCount=0, checkTimer=setInterval(function(){if(++checkCount>8){clearInterval(checkTimer);return;}checkJzResult();},1500);

})();
</script>
</body>
</html>
