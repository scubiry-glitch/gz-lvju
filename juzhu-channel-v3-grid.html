<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>新居住 · 沈阳 · 贝壳</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scheme-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0;font-size:10px;color:var(--muted);position:relative;z-index:5;}
  .scheme-bar a{color:var(--brand);font-weight:600;}
  .split-hd{position:relative;padding:52px 18px 20px;color:#fff;overflow:hidden;}
  .split-hd .bg{position:absolute;inset:0;background:linear-gradient(135deg,#0b5d56,#1a4038 50%,#8c6224);}
  .split-hd .bg.has-img{background-size:cover;background-position:center;}
  .split-hd .bg.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(11,93,86,.82),rgba(26,64,56,.75) 50%,rgba(140,98,36,.55));z-index:0;}
  .split-hd .bg::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(85deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px);opacity:.6;}
  .split-hd .in{position:relative;z-index:2;}
  .split-hd .ek{font-size:9px;letter-spacing:.36em;opacity:.9;}
  .split-hd h1{font-family:var(--serif);font-size:24px;margin-top:6px;line-height:1.2;}
  .split-hd .stat{display:flex;gap:18px;margin-top:12px;font-size:10px;opacity:.92;}
  .split-hd .stat b{font-family:var(--serif);font-size:16px;display:block;}
  .seg-switch{display:flex;margin-top:14px;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;backdrop-filter:blur(8px);}
  .seg-switch a{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:600;border-radius:10px;color:rgba(255,255,255,.75);}
  .seg-switch a.on{background:#fff;color:var(--brand-deep);box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .pane{display:none;}.pane.on{display:block;}

  /* === 家政 tab · Bento === */
  @keyframes jzIn{
    from{opacity:0;transform:translateY(12px) scale(.96);}
    to{opacity:1;transform:none;}
  }
  .jz-strip{
    display:flex;gap:8px;padding:10px 18px 2px;overflow-x:auto;
  }
  .jz-strip::-webkit-scrollbar{height:0;}
  .jz-strip span{
    flex:0 0 auto;font-size:10px;padding:6px 12px;border-radius:999px;
    background:#fff;border:1px solid var(--border);color:var(--muted);white-space:nowrap;
  }
  .jz-strip span b{font-family:var(--serif);color:var(--brand-deep);margin-right:3px;}
  .jz-quick{padding:10px 16px 6px;}
  .jz-cat-grid{
    display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:88px;
    grid-auto-flow:dense;gap:9px;
  }
  .jz-cat{
    position:relative;display:block;border-radius:20px;overflow:hidden;color:#fff;
    box-shadow:0 10px 28px rgba(8,18,16,.16),inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .2s cubic-bezier(.2,.8,.2,1);
    animation:jzIn .45s cubic-bezier(.2,.8,.2,1) backwards;
    isolation:isolate;
  }
  .jz-cat:active{transform:scale(.97);}
  .jz-cat .bg{position:absolute;inset:0;transform:scale(1.03);transition:transform .35s ease;}
  .jz-cat:active .bg{transform:scale(1.08);}
  .jz-cat .bg::before{
    content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(145deg,rgba(255,255,255,.16) 0%,transparent 45%,rgba(0,0,0,.06) 100%);
  }
  .jz-cat .bg::after{content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(0deg,rgba(6,12,11,.78) 0%,rgba(6,12,11,.22) 55%,rgba(6,12,11,.04) 100%);}
  .jz-cat::after{
    content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .jz-cat.hero{grid-column:span 2;grid-row:span 2;min-height:196px;}
  .jz-cat.tall{grid-row:span 2;min-height:185px;}
  .jz-cat.wide{grid-column:span 2;min-height:96px;}
  .jz-cat .in{
    position:relative;z-index:3;padding:14px;display:flex;flex-direction:column;
    justify-content:flex-end;height:100%;min-height:88px;
  }
  .jz-cat.hero .in{min-height:196px;padding:16px;}
  .jz-cat.tall .in{min-height:185px;}
  .jz-cat.wide .in{
    min-height:96px;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;
  }
  .jz-cat .no{
    position:absolute;top:8px;left:12px;z-index:3;
    font-family:var(--serif);font-size:36px;font-weight:700;line-height:1;
    color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.2);pointer-events:none;
  }
  .jz-cat.hero .no{font-size:64px;-webkit-text-stroke-width:1.5px;}
  .jz-cat .ico{font-size:28px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25));}
  .jz-cat.hero .ico{font-size:40px;}
  .jz-cat.wide .ico{font-size:32px;}
  .jz-cat h3{
    font-family:var(--serif);font-size:18px;margin-top:6px;letter-spacing:.02em;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .jz-cat.hero h3{font-size:24px;margin-top:8px;}
  .jz-cat.wide h3{margin-top:0;font-size:20px;}
  .jz-cat .sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .jz-cat.wide .sub{margin-top:0;justify-content:flex-end;}
  .jz-cat .sub span{
    font-size:9px;padding:3px 8px;border-radius:999px;
    background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);
  }
  .jz-cat .arrow{
    position:absolute;top:11px;right:11px;z-index:5;width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.18);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    border:1px solid rgba(255,255,255,.2);
  }
  .jz-cat.hero .arrow{width:34px;height:34px;font-size:15px;}
  .jz-cat.cleaning .bg{background:linear-gradient(135deg,#1aa39a,#0c4d44);}
  .jz-cat.repair  .bg{background:linear-gradient(135deg,#3a7bd5,#1a3a6b);}
  .jz-cat.moving  .bg{background:linear-gradient(135deg,#ff8a3d,#c44a14);}
  .jz-cat.nanny   .bg{background:linear-gradient(135deg,#9a6bd1,#4d2a78);}

  /* 热门子类 · 横滑卡片 */
  .jz-sub-scroll{
    display:flex;gap:10px;overflow-x:auto;padding:4px 18px 10px;
    scroll-snap-type:x mandatory;
  }
  .jz-sub-scroll::-webkit-scrollbar{height:0;}
  .jz-sub-card{
    flex:0 0 72%;scroll-snap-align:start;
    display:block;background:#fff;border:1px solid var(--border);border-radius:18px;
    padding:14px 14px 13px;box-shadow:0 8px 22px rgba(15,42,38,.07);
    animation:jzIn .45s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .jz-sub-card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .jz-sub-card .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .jz-sub-card .dot.cleaning{background:#1aa39a;}
  .jz-sub-card .dot.repair{background:#3a7bd5;}
  .jz-sub-card .dot.moving{background:#ff8a3d;}
  .jz-sub-card .dot.nanny{background:#9a6bd1;}
  .jz-sub-card b{font-size:14px;color:var(--ink);line-height:1.3;display:block;}
  .jz-sub-card .meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .jz-sub-card .foot{
    display:flex;align-items:center;justify-content:space-between;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--border);
  }
  .jz-sub-card .pr{font-family:var(--serif);font-size:17px;color:var(--gold-deep);}
  .jz-sub-card .go{
    font-size:10px;font-weight:700;color:#fff;padding:5px 11px;border-radius:999px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));
  }

  /* 营销栏 · Bento 双列 */
  .jz-promo{
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(88px,auto);
    grid-auto-flow:dense;gap:9px;padding:4px 16px 24px;
  }
  .jz-promo-card{
    display:block;border-radius:18px;overflow:hidden;color:#fff;padding:14px 14px 13px;
    position:relative;min-height:88px;
    box-shadow:0 10px 24px rgba(15,42,38,.12),inset 0 1px 0 rgba(255,255,255,.1);
    animation:jzIn .45s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .jz-promo-card.hero{grid-row:span 2;min-height:186px;padding:16px;}
  .jz-promo-card .tag{
    font-size:8px;font-weight:800;letter-spacing:.14em;padding:3px 8px;border-radius:999px;
    background:rgba(255,255,255,.18);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.15);display:inline-block;
  }
  .jz-promo-card h3{font-family:var(--serif);font-size:16px;margin-top:8px;line-height:1.2;}
  .jz-promo-card.hero h3{font-size:20px;margin-top:10px;}
  .jz-promo-card p{font-size:10px;opacity:.9;margin-top:5px;line-height:1.45;max-width:22ch;}
  .jz-promo-card .ck{
    position:absolute;right:12px;bottom:12px;font-size:10px;font-weight:700;
    padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--brand-deep);
  }
  .jz-promo-card.warm{background:linear-gradient(145deg,#ff8a3d,#c44a14);}
  .jz-promo-card.fresh{background:linear-gradient(145deg,#1aa39a,#0c4d44);}
  .jz-promo-card.deep{background:linear-gradient(145deg,#1a3a6b,#0b1d3a);}
  .collage{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 8px;}
  .ctile{position:relative;border-radius:16px;overflow:hidden;color:#fff;display:block;min-height:108px;
    box-shadow:0 8px 20px rgba(15,42,38,.12);}
  .ctile .bg{position:absolute;inset:0;background-color:#0c4d44;}
  .ctile .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(8,18,16,.72),rgba(8,18,16,.12) 55%);}
  .ctile.empty{opacity:.72;}
  .ctile .in{position:relative;z-index:2;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:108px;}
  .ctile.tall{grid-row:span 2;min-height:200px;}
  .ctile.tall .in{min-height:200px;}
  .ctile.wide{grid-column:span 2;min-height:120px;}
  .ctile .no{font-family:var(--serif);font-size:28px;font-weight:700;opacity:.35;line-height:1;}
  .ctile h3{font-family:var(--serif);font-size:17px;margin-top:4px;line-height:1.15;}
  .ctile .nums{display:flex;gap:10px;margin-top:8px;font-size:9px;opacity:.9;flex-wrap:wrap;}
  .ctile .nums b{font-family:var(--serif);font-size:13px;display:block;}
  .ctile .hot,.ctile .empty-tag{position:absolute;top:10px;right:10px;z-index:3;font-size:9px;font-weight:700;
    background:rgba(255,217,138,.25);color:#ffd98a;padding:2px 8px;border-radius:999px;}
  .ctile .empty-tag{background:rgba(255,255,255,.2);color:#fff;}
  .spread{padding:14px 18px 24px;}
  .spread-hero{display:block;border-radius:18px;overflow:hidden;margin-bottom:10px;color:#fff;box-shadow:0 12px 28px rgba(15,42,38,.14);}
  .spread-hero .img{height:180px;position:relative;background-color:#0c4d44;background-size:cover;background-position:center;}
  .spread-hero .img::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent 55%);}
  .spread-hero .cap{position:absolute;left:16px;bottom:14px;right:16px;z-index:2;}
  .spread-hero .cap .ek{font-size:9px;letter-spacing:.2em;opacity:.85;}
  .spread-hero .cap h3{font-family:var(--serif);font-size:22px;margin-top:4px;}
  .spread-hero .cap p{font-size:11px;opacity:.9;margin-top:4px;}
  .spread-hero .body{background:#fff;color:var(--ink);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
  .spread-hero .body b{font-family:var(--serif);font-size:20px;color:var(--gold-deep);}
  .spread-hero .body .bk{font-size:11px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--brand),var(--brand-2));padding:7px 14px;border-radius:999px;}
  .spread-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .mini-card{display:block;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(15,42,38,.06);}
  .mini-card .th{height:90px;background-size:cover;background-position:center;background-color:#0c4d44;}
  .mini-card .bd{padding:10px 11px 12px;}
  .mini-card .bd b{font-size:13px;color:var(--ink);display:block;line-height:1.3;}
  .mini-card .bd .pr{font-family:var(--serif);font-size:16px;color:var(--gold-deep);margin-top:6px;}
  .mini-card .bd .pr small{font-size:10px;font-family:var(--font);color:var(--muted);}
  .load-err{padding:24px 18px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar ghost" style="position:absolute;">
      <a class="bk" href="beike-app-home.html">‹</a>
      <div class="ttl">新居住<small>沈阳 · 东博专区</small></div>
      <div class="act"><a href="juzhu-channel-schemes.html">≡</a></div>
    </div>

    <div class="split-hd">
      <div class="bg"></div>
      <div class="in">
        <div class="ek">Cover Collage · Shenyang</div>
        <h1 id="heroTitle">新居住频道</h1>
        <div class="stat" id="heroStat"></div>
        <div class="seg-switch" id="tabs">
          <a class="on" data-tab="bzf">保租房</a>
          <a data-tab="trade">卖旧买新</a>
        </div>
      </div>
    </div>

    <div class="scheme-bar"><span>方案 C · 沈阳真实数据</span><a href="juzhu-channel-schemes.html">切换方案 ›</a></div>

    <div class="pane on" id="pane-bzf">
      <div class="sec-h" style="margin-top:8px;"><span class="bar"></span><h2>选区租房</h2><span class="more" id="distCount">—</span></div>
      <div class="collage" id="collage"></div>
      <div class="banner">
        <span class="bi">🏛</span>
        <div class="bt"><b>沈阳保租房 · 东博试点专区</b><p>区级浏览 → 项目门店 → 户型房源 · 点击咨询</p></div>
      </div>
    </div>

    <div class="pane" id="pane-trade">
      <div class="sec-h" style="margin-top:8px;"><span class="bar"></span><h2>置换推荐</h2><span class="more">综合排序 ›</span></div>
      <div class="spread" id="spread"></div>
    </div>

    <div class="pane" id="pane-jiazheng">
      <div class="sec-h" style="margin-top:8px;"><span class="bar"></span><h2>选择服务</h2><span class="more">4 大类目</span></div>
      <div class="jz-strip">
        <span><b>30min</b>极速上门</span>
        <span><b>4.9</b>服务评分</span>
        <span><b>金牌</b>认证服务者</span>
        <span><b>7×12</b>客服在线</span>
      </div>
      <div class="jz-quick">
        <div class="jz-cat-grid" id="jzCats"></div>
      </div>

      <div class="sec-h"><span class="bar"></span><h2>热门子类</h2><span class="more">左滑更多 ›</span></div>
      <div class="jz-sub-scroll" id="jzSubs"></div>

      <div class="sec-h"><span class="bar"></span><h2>本月精选</h2></div>
      <div class="jz-promo" id="jzPromo"></div>
    </div>
    <div class="load-err" id="err" hidden></div>
  </div>
</div>
<script src="juzhu/app.js?v=11"></script>
<script>
(function(){
  var pad = function(n){ return String(n).padStart(2,'0'); };

  function renderHero(d){
    document.getElementById('heroTitle').textContent = d.city.name + ' · 新居住';
    document.getElementById('heroStat').innerHTML =
      '<div><b>'+d.stats.project_count_bzf+'</b>保租项目</div>'+
      '<div><b>'+d.stats.project_count_trade+'</b>置换项目</div>'+
      '<div><b>'+d.stats.unit_count+'</b>房源量</div>';
    document.getElementById('distCount').textContent = d.stats.district_count + ' 区 ›';
    var bgEl = document.querySelector('.split-hd .bg');
    if (d.city.hero_bg_image) {
      bgEl.style.backgroundImage = 'url(' + d.city.hero_bg_image + ')';
      bgEl.classList.add('has-img');
    } else {
      bgEl.style.backgroundImage = '';
      bgEl.classList.remove('has-img');
    }
  }

  function collageLayout(d, list) {
    if (!d.has_projects) return { tall: false, wide: false };
    var active = list.filter(function(x) { return x.has_projects; });
    var ai = active.findIndex(function(x) { return x.id === d.id; });
    if (ai < 0) return { tall: false, wide: false };
    var phase = ai % 5;
    return { tall: phase === 3, wide: phase === 2 };
  }

  function renderCollage(list){
    document.getElementById('collage').innerHTML = list.map(function(d,i){
      var lay = collageLayout(d, list);
      var cls = 'ctile'+(lay.tall?' tall':'')+(lay.wide?' wide':'')+(d.has_projects? '':' empty');
      var href = d.has_projects
        ? 'juzhu-bzf-list.html?district='+encodeURIComponent(d.name)
        : '#';
      var bg = d.cover_image
        ? 'background-image:url('+d.cover_image+');background-size:cover;background-position:center;'
        : '';
      var tag = d.is_hot ? '<span class="hot">热门</span>' :
        (!d.has_projects ? '<span class="empty-tag">暂无项目</span>' : '');
      return '<a class="'+cls+'" href="'+href+'"'+(d.has_projects?'':' onclick="return false"')+'>'+
        '<div class="bg '+(bg?'':' '+d.bg_class)+'" style="'+bg+'"></div>'+tag+
        '<div class="in"><span class="no">'+pad(i+1)+'</span><h3>'+d.name+'</h3>'+
        '<div class="nums">'+
          '<div><b>'+JUZHU.districtManagedUnits(d)+'</b>房源量</div>'+
          '<div><b>'+d.project_count+'</b>项目</div>'+
          '<div><b>'+(d.avg_price?'¥'+d.avg_price:'—')+'</b>均价</div>'+
        '</div></div></a>';
    }).join('');
  }

  function renderTrade(list){
    if (!list.length){ document.getElementById('spread').innerHTML='<p class="load-err">暂无置换项目</p>'; return; }
    var hero = list[0];
    var duo = list.slice(1,3);
    var rest = list.slice(3);
    var hStyle = hero.cover_image ? 'background-image:url('+hero.cover_image+')' : '';
    var html = '<a class="spread-hero" href="juzhu-bzf-project.html?channel=trade&project='+encodeURIComponent(hero.slug)+'">'+
      '<div class="img" style="'+hStyle+'">'+
        '<div class="cap"><div class="ek">FEATURED</div><h3>'+hero.name+'</h3>'+
        '<p>'+(hero.address||'')+' · '+JUZHU.asTags(hero.tags).join(' · ')+'</p></div></div>'+
      '<div class="body"><div><b>'+hero.price_from+'<small style="font-size:12px;color:var(--muted)"> 万起</small></b>'+
        '<div style="font-size:10px;color:var(--muted);margin-top:2px;">'+(hero.old_house_hint||'')+'</div></div>'+
        '<span class="bk">立即咨询</span></div></a>';
    if (duo.length){
      html += '<div class="spread-duo">'+duo.map(function(x){
        var st = x.cover_image ? 'background-image:url('+x.cover_image+')' : '';
        return '<a class="mini-card" href="juzhu-bzf-project.html?channel=trade&project='+encodeURIComponent(x.slug)+'">'+
          '<div class="th" style="'+st+'"></div><div class="bd"><b>'+x.name+'</b>'+
          '<div style="font-size:10px;color:var(--muted);margin-top:2px;">'+x.unit_count+' 户型</div>'+
          '<div class="pr">'+x.price_from+'<small> 万起</small></div></div></a>';
      }).join('')+'</div>';
    }
    if (rest.length){
      html += '<div class="sec-h" style="padding-left:0;margin-top:18px;"><span class="bar"></span><h2>更多置换</h2></div>';
      html += rest.map(function(x){
        var st = x.cover_image ? 'background-image:url('+x.cover_image+')' : 'class="'+x.slug+'"';
        return '<a class="lrow" href="juzhu-bzf-project.html?channel=trade&project='+encodeURIComponent(x.slug)+'">'+
          '<div class="th" style="'+(x.cover_image?'background-image:url('+x.cover_image+');background-size:cover;background-position:center;':'')+'">'+
          '<span class="star">置换</span></div><div class="info"><div class="nm">'+x.name+'</div>'+
          '<div class="meta">'+(x.address||'')+' · '+x.unit_count+' 户型</div>'+
          '<div class="pr"><b>'+x.price_from+'<small>万起</small></b><span class="unit">'+(x.old_house_hint||'')+'</span></div></div></a>';
      }).join('');
    }
    document.getElementById('spread').innerHTML = html;
  }

  // === 家政 tab ===
  // 4 大类 + 子类（先内置，后续从后端拉取）
  var JZ_CATS = [
    { id: 'cleaning', name: '保洁', icon: '🧹', subs: ['日常保洁','深度清洁','搬家保洁','开荒保洁','擦玻璃','油烟机清洗'] },
    { id: 'repair',   name: '维修', icon: '🔧', subs: ['家电维修','管道疏通','灯具安装','门窗维修','防水补漏','空调清洗'] },
    { id: 'moving',   name: '搬家', icon: '📦', subs: ['居民搬家','长途搬家','钢琴搬运','企业搬迁','日式搬家','搬货上下楼'] },
    { id: 'nanny',    name: '保姆', icon: '👶', subs: ['住家保姆','育儿嫂','月嫂','钟点工','养老护理','医院陪护'] }
  ];

  var JZ_LAYOUT = { cleaning: 'hero', repair: 'tall', moving: 'tall', nanny: 'wide' };

  function renderJiazhengCats(){
    document.getElementById('jzCats').innerHTML = JZ_CATS.map(function(c,i){
      var lay = JZ_LAYOUT[c.id] || '';
      var subHtml = c.subs.slice(0, lay === 'wide' ? 4 : 3).map(function(s){ return '<span>'+s+'</span>'; }).join('');
      var body = lay === 'wide'
        ? '<div><div class="ico">'+c.icon+'</div><h3>'+c.name+'</h3></div><div class="sub">'+subHtml+'</div>'
        : '<div class="ico">'+c.icon+'</div><h3>'+c.name+'</h3><div class="sub">'+subHtml+'</div>';
      return '<a class="jz-cat '+c.id+(lay?' '+lay:'')+'" href="jiazheng-landing-'+c.id+'.html" style="animation-delay:'+(i*0.06)+'s">'+
        '<div class="bg"></div><span class="no">'+pad(i+1)+'</span><div class="arrow">›</div>'+
        '<div class="in">'+body+'</div></a>';
    }).join('');
  }

  function renderJiazhengSubs(){
    var rows = [
      { name: '深度清洁 · 4小时', sub: '3人团队 · 含厨卫去污', price: '¥268起', type: 'cleaning' },
      { name: '空调清洗 · 挂机', sub: '高温蒸汽 · 拆装深度', price: '¥89/台', type: 'repair' },
      { name: '居民搬家 · 同城', sub: '金杯车 · 2名师傅', price: '¥398起', type: 'moving' },
      { name: '育儿嫂 · 住家', sub: '3年以上经验 · 持证', price: '¥8,800/月', type: 'nanny' },
      { name: '管道疏通 · 当天', sub: '30分钟上门 · 不通不收费', price: '¥99起', type: 'repair' },
      { name: '钟点工 · 3小时', sub: '做饭保洁 · 灵活预约', price: '¥128/次', type: 'nanny' }
    ];
    document.getElementById('jzSubs').innerHTML = rows.map(function(r,i){
      return '<a class="jz-sub-card" href="juzhu-jiazheng-list.html?type='+r.type+'&sub='+encodeURIComponent(r.name)+'" style="animation-delay:'+(0.2+i*0.05)+'s">'+
        '<div class="top"><span class="dot '+r.type+'"></span><b>'+r.name+'</b></div>'+
        '<div class="meta">'+r.sub+'</div>'+
        '<div class="foot"><div class="pr">'+r.price+'</div><span class="go">预约</span></div></a>';
    }).join('');
  }

  function renderJiazhengPromo(){
    var cards = [
      { cls: 'warm', hero: true,  tag: 'HOT',  title: '新用户立减 50', desc: '首单保洁·维修·搬家通用', cta: '立即领取' },
      { cls: 'fresh', hero: false, tag: 'GRAD', title: '金牌服务者',   desc: '评级 · 背调 · 持证上岗', cta: '了解' },
      { cls: 'deep',  hero: false, tag: 'PRO',  title: '企业月付',     desc: '中小企业办公保洁定制',   cta: '咨询' }
    ];
    document.getElementById('jzPromo').innerHTML = cards.map(function(c,i){
      return '<a class="jz-promo-card '+c.cls+(c.hero?' hero':'')+'" href="juzhu-jiazheng-list.html?type=promo&tag='+c.cls+'" style="animation-delay:'+(0.35+i*0.06)+'s">'+
        '<span class="tag">'+c.tag+'</span>'+
        '<h3>'+c.title+'</h3>'+
        '<p>'+c.desc+'</p>'+
        '<span class="ck">'+c.cta+'</span></a>';
    }).join('');
  }

  document.getElementById('tabs').addEventListener('click',function(e){
    var t = e.target.closest('[data-tab]'); if(!t) return;
    document.querySelectorAll('.seg-switch a').forEach(function(a){ a.classList.toggle('on', a===t); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on', p.id==='pane-'+t.dataset.tab); });
  });

  JUZHU.load().then(function(d){
    var tabs = document.getElementById('tabs');
    var chs = JUZHU.enabledChannels();
    if (chs.length) {
      tabs.innerHTML = chs.map(function(c, i) {
        return '<a class="' + (i === 0 ? 'on' : '') + '" data-tab="' + c.id + '">' + c.label + '</a>';
      }).join('');
    }
    renderHero(d);
    renderCollage(JUZHU.districts());
    renderTrade(JUZHU.tradeListings());
    renderJiazhengCats();
    renderJiazhengSubs();
    renderJiazhengPromo();
  }).catch(function(err){
    document.getElementById('err').hidden = false;
    document.getElementById('err').textContent = '数据加载失败：'+err.message+'（请先运行 python3 juzhu/seed_from_folder.py）';
  });
})();
</script>
</body>
</html>
