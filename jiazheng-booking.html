<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>确认订单 · 家政服务</title>
<link rel="stylesheet" href="jiazheng-app.css?v=20261008-1" />
</head>
<body>
<div class="jz-wrap">
  <div class="jz-top">
    <a class="jz-back" id="backBtn" href="javascript:history.back()"></a>
    <span class="jz-title">确认订单</span>
    <div></div>
  </div>

  <div id="productSummary" style="background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--line);">
    <div style="text-align:center;color:var(--muted);padding:20px;">加载中…</div>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;">
    <div class="jz-form-row">
      <span class="lb">服务地址</span>
      <input type="text" id="houseInput" value="东博人才公寓 · 2栋1503" style="flex:1;border:0;outline:0;text-align:right;background:transparent;font:inherit;color:var(--fg);" />
    </div>
    <div class="jz-form-row">
      <span class="lb">服务时间</span>
      <span class="vl" id="timeVal">今天 18:00</span>
    </div>
    <div id="timeMode" style="display:none;font-size:11px;line-height:1.5;padding:6px 0 0;"></div>
    <div class="jz-form-row">
      <span class="lb">联系电话</span>
      <input type="tel" id="phoneInput" value="13800138000" style="flex:1;border:0;outline:0;text-align:right;background:transparent;font:inherit;color:var(--fg);" />
    </div>
    <div class="jz-form-row" style="display:block;">
      <span class="lb" style="display:block;margin-bottom:6px;">备注（可选）</span>
      <textarea id="descInput" placeholder="补充房型面积、故障现象或照护需求" style="width:100%;border:0;outline:0;resize:none;font:inherit;min-height:72px;"></textarea>
    </div>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;" id="timeAdjust">
    <div style="font-size:14px;font-weight:500;padding:14px 0 8px;">调整上门时间</div>
    <div id="timeSlots" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:14px;"></div>
  </div>

  <div class="jz-price" id="priceBox"></div>

  <div style="padding:14px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="agree" checked />
    <label for="agree">我已阅读并同意 <a href="javascript:;" style="color:var(--brand);">《服务协议》</a></label>
  </div>

  <div class="jz-cta-bar">
    <a class="sec" href="javascript:history.back()">返回</a>
    <a class="pri" href="javascript:;" id="submitBtn">确认下单</a>
  </div>
</div>

<script src="screens/_console-login.js"></script>
<script src="screens/_region.js"></script>
<script src="screens/_jzapi.js?v=12"></script>
<script src="jiazheng-data.js?v=2"></script>
<script src="jz-datepick.js?v=2"></script>
<script src="jsbridgesdk.js?v=1"></script>
<script src="screens/_beike-login.js?v=18"></script>
<script src="screens/_cashier.js?v=1"></script>
<script src="screens/_jiazheng-booking.js?v=20261008-1"></script>
</body>
</html>
