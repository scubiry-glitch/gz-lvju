<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>下单 · 家政服务</title>
<link rel="stylesheet" href="jiazheng-app.css?v=2" />
</head>
<body>
<div class="jz-wrap">
  <div class="jz-top">
    <a class="jz-back" href="javascript:history.back()"></a>
    <span class="jz-title">确认订单</span>
    <div></div>
  </div>

  <div id="productSummary" style="background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--line);">
    <div style="text-align:center;color:var(--muted);padding:20px;">加载中…</div>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;">
    <div class="jz-form-row" id="addrRow">
      <span class="lb">服务地址</span>
      <span class="vl">保利香槟国际 · 3栋1单元1801</span>
    </div>
    <div class="jz-form-row" id="timeRow">
      <span class="lb">服务时间</span>
      <span class="vl" id="timeVal">今天 18:00</span>
    </div>
    <div class="jz-form-row">
      <span class="lb">联系电话</span>
      <input type="tel" value="138 0013 8000" />
    </div>
    <div class="jz-form-row" style="display:block;">
      <span class="lb" style="display:block;margin-bottom:6px;">备注（可选）</span>
      <textarea placeholder="对服务者有什么要求？例如：'家里有宠物，请勿带陌生人'" style="width:100%;border:0;outline:0;resize:none;font:inherit;"></textarea>
    </div>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;">
    <div style="font-size:14px;font-weight:500;padding:14px 0 8px;">选择服务时间</div>
    <div id="timeSlots" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:14px;"></div>
  </div>

  <div class="jz-price" id="priceBox"></div>

  <div style="padding:14px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="agree" checked />
    <label for="agree">我已阅读并同意 <a href="javascript:;" style="color:var(--brand);">《服务协议》</a></label>
  </div>

  <div class="jz-cta-bar">
    <a class="sec" href="javascript:history.back()">返回</a>
    <a class="pri" href="javascript:;" id="submitBtn">确认下单</a>
  </div>
</div>

<script src="jiazheng-data.js?v=6"></script>
<script>
var qs = new URLSearchParams(location.search);
var type = qs.get('type') || 'cleaning';
var vendorId = parseInt(qs.get('vendor') || '0', 10);
var productId = parseInt(qs.get('product') || '0', 10);
var v, p;

function pnorm(raw){
  return {
    id: raw.id,
    title: raw.title,
    subtitle: raw.subtitle || raw.sub || '',
    price: Number(raw.price) || 0,
    original_price: raw.original_price != null ? raw.original_price : (raw.original != null ? raw.original : raw.price),
    discount_label: raw.discount_label || raw.discount || '优惠'
  };
}

JZ_DATA.getVendor(type, vendorId).then(function(vendor){
  v = vendor;
  var raw = (vendor.products || []).find(function(x){ return x.id == productId; });
  p = raw ? pnorm(raw) : null;
  if (!v || !p) {
    document.querySelector('.jz-wrap').innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;">订单信息缺失</div>';
    return;
  }

  document.getElementById('productSummary').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;">'+
      '<div>'+
        '<div style="font-size:15px;font-weight:600;">'+p.title+'</div>'+
        '<div style="font-size:12px;color:var(--muted);margin-top:2px;">'+v.name+' · '+p.subtitle+'</div>'+
      '</div>'+
      '<div style="color:var(--brand);font-size:18px;font-weight:700;">¥'+p.price+'</div>'+
    '</div>';

  // 时间选择
  var slots = [
    {h:'今天 18:00', v:'今天 18:00'},
    {h:'今天 19:00', v:'今天 19:00'},
    {h:'今天 20:00', v:'今天 20:00'},
    {h:'明天 09:00', v:'明天 09:00'},
    {h:'明天 10:00', v:'明天 10:00'},
    {h:'明天 14:00', v:'明天 14:00'},
    {h:'明天 16:00', v:'明天 16:00'},
    {h:'明天 19:00', v:'明天 19:00'}
  ];
  document.getElementById('timeSlots').innerHTML = slots.map(function(s,i){
    var active = i === 0;
    return '<a href="javascript:;" data-v="'+s.v+'" style="padding:8px;text-align:center;font-size:12px;border:1px solid '+(active?'var(--brand)':'var(--line)')+';border-radius:8px;background:'+(active?'var(--brand-soft)':'var(--surface)')+';color:'+(active?'var(--brand)':'var(--fg)')+';">'+s.h+'</a>';
  }).join('');
  document.getElementById('timeSlots').addEventListener('click', function(e){
    e.preventDefault();
    var t = e.target.closest('[data-v]');
    if (!t) return;
    document.querySelectorAll('#timeSlots a').forEach(function(a){
      a.style.borderColor = 'var(--line)';
      a.style.background = 'var(--surface)';
      a.style.color = 'var(--fg)';
    });
    t.style.borderColor = 'var(--brand)';
    t.style.background = 'var(--brand-soft)';
    t.style.color = 'var(--brand)';
    document.getElementById('timeVal').textContent = t.dataset.v;
  });

  // 价格预览
  document.getElementById('priceBox').innerHTML =
    '<div class="row"><span>基础服务费</span><b>¥'+p.price.toFixed(1)+'</b></div>'+
    '<div class="row disc"><span>立减优惠（'+p.discount_label+'）</span><b>-¥'+Math.max(0, p.original_price - p.price).toFixed(1)+'</b></div>'+
    '<div class="row"><span>已选优惠券</span><b>神券立减 ¥10.0</b></div>'+
    '<div class="row total"><span>实付</span><b>¥'+(p.price - 10).toFixed(1)+'</b></div>';

  // 提交
  document.getElementById('submitBtn').addEventListener('click', function(){
    if (!document.getElementById('agree').checked) {
      alert('请先同意服务协议');
      return;
    }
    var btn = this;
    btn.textContent = '提交中…';
    btn.style.opacity = 0.7;
    JZ_DATA.createOrder({
      type: type,
      vendor_id: v.id,
      product_id: p.id,
      address: '保利香槟国际 · 3栋1单元1801',
      phone: '13800138000',
      scheduled_at: document.getElementById('timeVal').textContent,
      fee: p.price - 10,
    }).then(function(r){
      if (r.order && r.order.id) {
        location.href = 'jiazheng-payment.html?oid=' + r.order.id;
      } else {
        btn.textContent = '确认下单';
        btn.style.opacity = 1;
        alert('下单失败：' + (r.error || '未知错误'));
      }
    }).catch(function(e){
      btn.textContent = '确认下单';
      btn.style.opacity = 1;
      alert('下单失败：' + e.message);
    });
  });
});
</script>
</body>
</html>
