<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新居住 · 内容编辑后台</title>
<style>
  :root{
    --bg:#f0f4f3; --surface:#fff; --fg:#10171c; --muted:#6b7785; --border:#e0e8e5;
    --brand:#0f766e; --brand2:#14b8a6; --danger:#dc2626; --gold:#b48a3f;
    --font:system-ui,-apple-system,'PingFang SC',sans-serif;
    --serif:'Noto Serif SC',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;}
  a{color:var(--brand);text-decoration:none;}
  .top{display:flex;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(90deg,#0b5d56,#0f766e);color:#fff;}
  .top h1{font-family:var(--serif);font-size:18px;margin:0;flex:1;}
  .top .sub{font-size:11px;opacity:.85;font-weight:400;}
  .top .acts{display:flex;gap:8px;}
  .top .acts a,.top .acts button{font-size:12px;padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-family:inherit;}
  .top .acts a:hover,.top .acts button:hover{background:rgba(255,255,255,.22);}
  .layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 52px);}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;}
  .side label{font-size:11px;color:var(--muted);font-weight:600;}
  .side select,.side input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  .plist{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:4px;}
  .plist button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--border);
    background:#fff;cursor:pointer;font-family:inherit;}
  .plist button:hover{background:#f5faf9;}
  .plist button.on{background:color-mix(in oklab,var(--brand) 10%,#fff);border-left:3px solid var(--brand);}
  .plist .nm{font-size:13px;font-weight:600;color:var(--fg);}
  .plist .meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .main{padding:20px 24px 40px;overflow-y:auto;}
  .empty{color:var(--muted);padding:40px;text-align:center;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;
    box-shadow:0 4px 14px rgba(15,42,38,.04);}
  .card h2{font-family:var(--serif);font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:10px;}
  .card h2 .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--brand);color:#fff;font-family:var(--font);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .grid.full{grid-template-columns:1fr;}
  .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .fld input,.fld textarea,.fld select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
  .fld textarea{min-height:56px;resize:vertical;}
  .cover-preview{width:120px;height:80px;border-radius:8px;background:#e8eeec center/cover no-repeat;border:1px solid var(--border);margin-top:6px;}
  .bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{padding:8px 16px;border-radius:8px;border:0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--fg);}
  .btn.danger{background:#fff;border:1px solid #fecaca;color:var(--danger);}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
  .tbl th{font-size:10px;color:var(--muted);font-weight:600;background:#fafcfb;}
  .tbl input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
  .tbl .thumb{width:48px;height:36px;border-radius:6px;background:#e8eeec center/cover no-repeat;}
  .tbl .acts{white-space:nowrap;}
  .tbl .acts button{padding:4px 8px;font-size:11px;margin-left:4px;}
  .toast{position:fixed;bottom:20px;right:20px;background:#0f766e;color:#fff;padding:10px 16px;border-radius:10px;
    font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;transition:.25s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;}
  .warn{background:#fff8eb;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px;}
  .side .side-actions{display:flex;gap:6px;}
  .side .side-actions .btn{flex:1;padding:8px;font-size:12px;}
  .rating-status{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;}
  .rating-status.draft{background:#f1f5f9;color:#64748b;}
  .rating-status.pending{background:#fef3c7;color:#92400e;}
  .rating-status.passed{background:#dcfce7;color:#166534;}
  .rating-status.rejected{background:#fee2e2;color:#991b1b;}
  .dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .dim-grid label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;}
  .rating-preview{margin-top:12px;padding:10px 12px;background:#f5faf9;border-radius:10px;font-size:12px;}
  .rating-preview b{font-family:var(--serif);color:var(--gold);font-size:18px;}
  .unit-photos-row td{background:#f8fbfa;padding:0!important;border-bottom:1px solid var(--border);}
  .unit-detail-row td{background:#f5faf9;padding:0!important;border-bottom:1px solid var(--border);}
  .unit-detail-panel{padding:12px 14px 16px;font-size:12px;}
  .unit-detail-panel .sec{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .unit-detail-panel .sec:first-child{margin-top:0;padding-top:0;border-top:0;}
  .unit-detail-panel .sec-h{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--fg);}
  .amenity-chks{display:flex;flex-wrap:wrap;gap:6px;}
  .amenity-chks label{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px;cursor:pointer;}
  .amenity-chks label.on{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 8%,#fff);}
  .amenity-chks input{margin:0;}
  .fee-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center;}
  .fee-row input{padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:11px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;}
  .detail-grid .full{grid-column:1/-1;}
  .detail-grid label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600;}
  .detail-grid input,.detail-grid textarea{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;}
  .detail-grid textarea{min-height:48px;resize:vertical;}
  .keeper-preview{width:40px;height:40px;border-radius:50%;background:#e8eeec center/cover no-repeat;border:1px solid var(--border);}
  .photo-panel{padding:12px 14px 14px;}
  .photo-panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .photo-panel-hd b{font-size:13px;}
  .photo-panel-hd span{font-size:11px;color:var(--muted);}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .photo-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;}
  .photo-card.cover{border-color:var(--brand);box-shadow:0 0 0 1px color-mix(in oklab,var(--brand) 35%,#fff);}
  .photo-card .pv{height:88px;border-radius:8px;background:#e8eeec center/cover no-repeat;margin-bottom:8px;}
  .photo-card label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;}
  .photo-card input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:11px;margin-bottom:6px;}
  .photo-card .prow{display:flex;gap:4px;flex-wrap:wrap;}
  .photo-card .prow .btn{padding:4px 8px;font-size:10px;}
  .photo-add{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .photo-add input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;}
  .btn.link{background:none;border:0;color:var(--brand);padding:0;font-size:11px;font-weight:600;cursor:pointer;}
  .img-field-row{display:flex;gap:8px;align-items:center;}
  .img-field-row input{flex:1;}
  .upload-btn{position:relative;overflow:hidden;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;}
  .upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .subnav{display:flex;gap:6px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border);}
  .subnav button{padding:8px 18px;border-radius:999px;border:1px solid var(--border);background:#fff;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .subnav button.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;}
  .pane-main{min-height:calc(100vh - 96px);}
  .pane-phone{padding:24px;}
  .pane-phone .card{max-width:560px;margin:0 auto;}
  .pane-dict .main{max-width:1100px;margin:0 auto;}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0;}
  body.api-off .subnav button:not(.on){opacity:.45;pointer-events:none;}
</style>
</head>
<body>
<header class="top">
  <h1>新居住 · 内容编辑后台 <span class="sub">SQLite · 保存后自动同步 data.json</span></h1>
  <div class="acts">
    <select id="citySwitch" title="切换编辑城市" style="height:32px;border:1px solid var(--border,#dde);border-radius:8px;padding:0 8px;font-size:13px;background:#fff;"></select>
    <a href="screens/p-rating-review.html" target="_blank">评级复核队列</a>
    <a href="juzhu-channel-v3-grid.html" target="_blank" id="previewLink">预览前台</a>
    <button type="button" id="btnExport">导出 JSON</button>
  </div>
</header>

<div class="warn" id="apiWarn" hidden>请使用 <code>python3 juzhu/server.py</code> 启动服务后再编辑（纯静态 http.server 不支持保存）。</div>

<nav class="subnav" id="subnav">
  <button type="button" data-tab="phone">预约电话</button>
  <button type="button" data-tab="dict">字典</button>
  <button type="button" class="on" data-tab="content">内容</button>
</nav>

<div id="panePhone" class="pane-main pane-phone" hidden>
  <div class="card">
    <h2>预约看房电话</h2>
    <p class="hint">用于户型详情页底部「预约看房 / 咨询置换」按钮，保存后自动同步至 data.json。</p>
    <div class="fld" style="margin-top:14px;">
      <label>咨询电话</label>
      <input type="tel" id="bookingPhone" placeholder="如 400-888-8888 或 024-12345678" />
    </div>
    <div class="bar">
      <button type="button" class="btn primary" id="btnSaveSettings">保存设置</button>
    </div>
    <h2 style="margin-top:24px;">前端开关</h2>
    <p class="hint">控制首页各模块显隐，保存后立即生效。</p>
    <div class="fld" style="margin-top:14px;">
      <label style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="toggleCitySwitcher" />
        <span>显示城市切换器（左上角）</span>
      </label>
    </div>
    <div class="fld" style="margin-top:8px;">
      <label style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="toggleLifeService" />
        <span>显示生活服务专区</span>
      </label>
    </div>
    <div class="bar">
      <button type="button" class="btn primary" id="btnSaveToggles">保存开关</button>
    </div>
  </div>
</div>

<div id="paneDict" class="pane-main pane-dict" hidden>
  <div class="main" id="dictRoot"></div>
</div>

<div id="paneContent" class="pane-main">
<div class="layout">
  <aside class="side">
    <div>
      <label>频道</label>
      <select id="fChannel"><option value="">全部</option></select>
    </div>
    <div>
      <label>行政区</label>
      <select id="fDistrict"><option value="">全部</option></select>
    </div>
    <div>
      <label>搜索项目</label>
      <input id="fSearch" placeholder="项目名…" />
    </div>
    <div class="side-actions">
      <button type="button" class="btn primary" id="btnNewProject">+ 新建项目</button>
    </div>
    <div class="plist" id="plist"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty">← 从左侧选择项目，编辑信息与房源</div>
  </main>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = '/api/juzhu/admin';
var state = { projects: [], districts: [], channels: [], cities: [], city: null, current: null, units: [], photos: [], expandedUnit: null, expandedDetail: null, tab: 'content', apiOk: false };

// 当前编辑城市：URL ?city=（slug 或名称）优先，缺省为 cities[0]
function adminCityParam() {
  try { return new URLSearchParams(location.search).get('city') || ''; } catch (e) { return ''; }
}

function loadCities() {
  return fetch('/api/juzhu/cities').then(function(r) { return r.json(); }).then(function(list) {
    state.cities = list || [];
    var sel = document.getElementById('citySwitch');
    var cur = adminCityParam();
    sel.innerHTML = (list || []).map(function(c) {
      var selected = (!cur && c === list[0]) || c.slug === cur || c.name === cur ? ' selected' : '';
      return '<option value="'+c.slug+'"'+selected+'>'+esc(c.name)+'</option>';
    }).join('');
    sel.onchange = function() {
      location.href = 'juzhu-admin.html?city=' + encodeURIComponent(sel.value);
    };
    var preview = document.getElementById('previewLink');
    if (preview) preview.href = 'juzhu-channel-v3-grid.html' + (cur ? '?city=' + encodeURIComponent(cur) : '');
    return list;
  }).catch(function() { state.cities = []; return []; });
}

var AMENITY_CATALOG = [
  { id: 'ac', label: '空调' }, { id: 'washer', label: '洗衣机' }, { id: 'fridge', label: '冰箱' },
  { id: 'heater', label: '热水器' }, { id: 'lock', label: '智能锁' }, { id: 'wifi', label: '宽带' },
  { id: 'tv', label: '电视' }, { id: 'hood', label: '油烟机' }, { id: 'microwave', label: '微波炉' },
  { id: 'induction', label: '电磁炉' }
];

function defaultRentDetail(u) {
  return {
    room_label: (u && u.name ? u.name + ' ' : '') + (u && u.area_sqm ? u.area_sqm + '㎡' : ''),
    long_term: { range: '可租4个月-1年', plan: { pay: '季付', rent: u && u.rent_monthly, service_fee: null, service_note: '一次收取', deposit: u && u.rent_monthly } },
    short_term: { range: '可租1个月-3个月', plan: { pay: '月付', rent: u && u.rent_monthly, service_fee: null, service_note: '一次收取', deposit: u && u.rent_monthly } },
    other_fees: [
      { name: '水费', value: '—元/吨' }, { name: '电费', value: '—元/度' }, { name: '宽带费', value: '—元/月' },
      { name: '物业费', value: '—元/月' }, { name: '供暖费', value: '—元/方' }
    ]
  };
}

function parseRentDetail(u) {
  var rd = u.rent_detail;
  if (!rd) return defaultRentDetail(u);
  if (typeof rd === 'string') { try { rd = JSON.parse(rd); } catch (e) { rd = null; } }
  if (!rd || typeof rd !== 'object') return defaultRentDetail(u);
  var base = defaultRentDetail(u);
  if (rd.room_label) base.room_label = rd.room_label;
  if (rd.long_term) base.long_term = Object.assign({}, base.long_term, rd.long_term);
  if (rd.short_term) base.short_term = Object.assign({}, base.short_term, rd.short_term);
  if (Array.isArray(rd.other_fees)) base.other_fees = rd.other_fees;
  return base;
}

function parseKeeper(u) {
  var k = u.keeper;
  if (!k) return { name: '', avatar: '', phone: '' };
  if (typeof k === 'string') { try { k = JSON.parse(k); } catch (e) { k = {}; } }
  return { name: k.name || '', avatar: k.avatar || '', phone: k.phone || '' };
}

function channelLabel(id) {
  var c = (state.channels || []).find(function(x){ return x.id === id; });
  if (c) return c.label;
  return id === 'trade' ? '卖旧买新' : '保租房';
}

function channelOptions(selected, includeAll) {
  var html = includeAll ? '<option value="">全部</option>' : '';
  (state.channels || []).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); }).forEach(function(c) {
    if (c.enabled === 0 && selected !== c.id) return;
    html += '<option value="'+c.id+'"'+(selected===c.id?' selected':'')+'>'+esc(c.label)+'</option>';
  });
  if (!state.channels || !state.channels.length) {
    html += '<option value="bzf"'+(selected==='bzf'?' selected':'')+'>保租房</option>';
    html += '<option value="trade"'+(selected==='trade'?' selected':'')+'>卖旧买新</option>';
  }
  return html;
}

function refreshChannelSelects() {
  var ch = document.getElementById('fChannel');
  if (ch) {
    var cur = ch.value;
    ch.innerHTML = channelOptions(cur, true);
  }
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.subnav button').forEach(function(b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  document.getElementById('panePhone').hidden = tab !== 'phone';
  document.getElementById('paneDict').hidden = tab !== 'dict';
  document.getElementById('paneContent').hidden = tab !== 'content';
  if (tab === 'dict') renderDictionary();
}

document.getElementById('subnav').onclick = function(e) {
  var btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  if (!state.apiOk) { toast('请先启动 python3 juzhu/server.py'); return; }
  switchTab(btn.dataset.tab);
};

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

function getApiKey() {
  try { return localStorage.getItem('JUZHU_API_KEY') || 'dev-juzhu-key'; } catch(e) { return 'dev-juzhu-key'; }
}

function api(path, opts) {
  opts = opts || {};
  var headers = opts.body ? {'Content-Type':'application/json'} : {};
  var key = getApiKey();
  if (key) headers['X-API-Key'] = key;
  return fetch(API + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r) {
    if (r.status === 401) {
      // API key 失效，提示输入新 key
      var newKey = prompt('API Key 无效，请输入新的 Key（留空用默认值）：');
      if (newKey !== null) {
        try { localStorage.setItem('JUZHU_API_KEY', newKey || 'dev-juzhu-key'); } catch(e) {}
      }
      throw new Error('认证失败，已更新 Key，请重试');
    }
    if (!r.ok) return r.json().then(function(e){ throw new Error(e.error || r.statusText); });
    return r.json();
  });
}

function uploadForm(path, formData) {
  var headers = {};
  var key = getApiKey();
  if (key) headers['X-API-Key'] = key;
  return fetch(API + path, { method: 'POST', headers: headers, body: formData }).then(function(r) {
    if (!r.ok) return r.json().then(function(e){ throw new Error(e.error || r.statusText); });
    return r.json();
  });
}

function uploadImage(file, fields) {
  var fd = new FormData();
  fd.append('file', file);
  Object.keys(fields).forEach(function(k){ fd.append(k, fields[k]); });
  return uploadForm('/upload', fd);
}

function uploadUnitPhotos(unitId, files) {
  var chain = Promise.resolve();
  files.forEach(function(file) {
    chain = chain.then(function() {
      var fd = new FormData();
      fd.append('file', file);
      return uploadForm('/units/'+unitId+'/photos', fd);
    });
  });
  return chain;
}

function bindCoverUpload(inputId, previewId, getMeta) {
  var input = document.getElementById(inputId);
  if (!input) return;
  var wrap = input.closest('.img-field');
  if (!wrap) return;
  var fileInput = wrap.querySelector('.upload-input');
  if (!fileInput) return;
  fileInput.onchange = function() {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    toast('上传中…');
    uploadImage(file, getMeta()).then(function(res) {
      input.value = res.file_path;
      if (previewId) {
        document.getElementById(previewId).style.backgroundImage =
          "url('/"+res.file_path.replace(/^\//,'')+"')";
      }
      toast('上传成功');
      fileInput.value = '';
    }).catch(function(e) {
      toast('上传失败：'+e.message);
      fileInput.value = '';
    });
  };
}

function tagsStr(tags) {
  if (!tags) return '';
  if (Array.isArray(tags)) return tags.join(', ');
  return String(tags);
}

function loadDistricts() {

function sortDistrictsList(list) {
  return (list || []).slice().sort(function(a, b) {
    var ah = a.has_projects ? 1 : 0;
    var bh = b.has_projects ? 1 : 0;
    if (ah !== bh) return bh - ah;
    return (a.sort_order || 0) - (b.sort_order || 0) || (a.id || 0) - (b.id || 0);
  });
}

function numValFrom(id) {

function ratingCode(id) {
  return 'SY-BZF-' + String(id).padStart(5, '0');
}

var RATING_STATUS = { draft:'草稿', pending:'待复核', passed:'已通过', rejected:'已驳回' };
var RATING_DIMS = [
  { key:'comfort', label:'舒适' },
  { key:'green', label:'绿色' },
  { key:'tech', label:'科技' },
  { key:'safety', label:'安全' }
];

function parseRating(p) {
  var r = p.rating;
  if (!r) return { dims:{ comfort:4, green:4, tech:4, safety:4 }, checked:47, total:55 };
  if (typeof r === 'string') { try { r = JSON.parse(r); } catch(e) { r = {}; } }
  r.dims = r.dims || { comfort:4, green:4, tech:4, safety:4 };
  r.checked = r.checked != null ? r.checked : 47;
  r.total = r.total != null ? r.total : 55;
  return r;
}

function summarizeDims(dims) {
  var vals = RATING_DIMS.map(function(d){ return +dims[d.key]; }).filter(function(v){ return !isNaN(v); });
  var avg = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 3;
  var stars = Math.min(5, Math.max(1, Math.round(avg)));
  return { stars: stars, score: Math.round(avg/5*100) };
}

function collectRatingFromForm() {
  var dims = {};
  RATING_DIMS.forEach(function(d){
    dims[d.key] = parseFloat(document.getElementById('r_'+d.key).value) || 0;
  });
  var sum = summarizeDims(dims);
  return {
    dims: dims,
    stars: sum.stars,
    score: sum.score,
    checked: +document.getElementById('r_checked').value || 47,
    total: +document.getElementById('r_total').value || 55,
    code: ratingCode(state.current.id)
  };
}

    state.current = res.project;
    return res;

function bindUnitDetailPanel(unitId) {
  var panel = document.querySelector('[data-unit-detail="'+unitId+'"]');
  if (!panel) return;
  panel.querySelectorAll('.amenity-chks label').forEach(function(lbl) {
    lbl.querySelector('input').onchange = function() { lbl.classList.toggle('on', this.checked); };
  });
  var avIn = panel.querySelector('.ud_k_avatar');
  var avPrev = panel.querySelector('.ud_k_prev');
  avIn.oninput = function() {
    avPrev.style.backgroundImage = this.value ? "url('/"+this.value.replace(/^\//,'')+"')" : 'none';
  };
  var up = panel.querySelector('.ud_k_upload');
  if (up) {
    up.onchange = function() {
      var f = up.files && up.files[0];
      if (!f) return;
      var fd = new FormData();
      fd.append('file', f);
      fd.append('scope', 'unit_keeper');
      fd.append('unit_id', unitId);
      uploadForm('/upload', fd).then(function(res) {
        avIn.value = res.file_path;
        avPrev.style.backgroundImage = "url('/"+res.file_path.replace(/^\//,'')+"')";
        toast('头像已上传');
      }).catch(function(e){ toast('上传失败：'+e.message); });
      up.value = '';
    };
  }
  panel.querySelector('.ud_fee_add').onclick = function() {
    var box = panel.querySelector('.ud_fees');
    var i = box.querySelectorAll('.fee-row').length;
    var div = document.createElement('div');
    div.className = 'fee-row';
    div.dataset.i = i;
    div.innerHTML = '<input class="fee_name" placeholder="费用名"/><input class="fee_val" placeholder="金额/单位"/><button type="button" class="btn danger fee_del">删</button>';
    box.appendChild(div);
    div.querySelector('.fee_del').onclick = function(){ div.remove(); };
  };
  panel.querySelectorAll('.fee_del').forEach(function(btn) {
    btn.onclick = function(){ btn.closest('.fee-row').remove(); };
  });
  panel.querySelector('.ud_save').onclick = function() {
    var tr = document.querySelector('tr.unit-main[data-id="'+unitId+'"]');
    if (!tr) return;
    saveUnit(tr, unitId, state.current.channel === 'trade', true);
  };
}

function collectUnitDetail(panel) {
  var amenities = [];
  panel.querySelectorAll('.ud_am:checked').forEach(function(cb){ amenities.push(cb.value); });
  var fees = [];
  panel.querySelectorAll('.fee-row').forEach(function(row) {
    var n = row.querySelector('.fee_name').value.trim();
    var v = row.querySelector('.fee_val').value.trim();
    if (n) fees.push({ name: n, value: v || '—' });
  });
  var rd = {
    room_label: panel.querySelector('.ud_rd_label').value.trim(),
    long_term: {
      range: '可租4个月-1年',
      plan: {
        pay: '季付',
        rent: numOrNull(panel.querySelector('.ud_lt_rent').value),
        service_fee: numOrNull(panel.querySelector('.ud_lt_svc').value),
        service_note: '一次收取',
        deposit: numOrNull(panel.querySelector('.ud_lt_dep').value)
      }
    },
    short_term: {
      range: '可租1个月-3个月',
      plan: {
        pay: '月付',
        rent: numOrNull(panel.querySelector('.ud_st_rent').value),
        service_fee: numOrNull(panel.querySelector('.ud_st_svc').value),
        service_note: '一次收取',
        deposit: numOrNull(panel.querySelector('.ud_st_dep').value)
      }
    },
    other_fees: fees
  };
  return {
    tags: panel.querySelector('.ud_tags').value,
    unit_spec: panel.querySelector('.ud_spec').value.trim() || null,
    promo_price: numOrNull(panel.querySelector('.ud_promo').value),
    amenities: amenities,
    keeper: {
      name: panel.querySelector('.ud_k_name').value.trim(),
      avatar: panel.querySelector('.ud_k_avatar').value.trim(),
      phone: panel.querySelector('.ud_k_phone').value.trim()
    },
    rent_detail: rd
  };
}

function numOrNull(v) {
  if (v === '' || v == null) return null;
  var n = +v;
  return isNaN(n) ? null : n;
}

function bindPhotoPanel(unitId) {
  var panel = document.querySelector('[data-unit-panel="'+unitId+'"]');
  if (!panel) return;
  panel.querySelectorAll('.photo-card').forEach(function(card){
    var pid = +card.dataset.photo;
    card.querySelector('.ph_path').oninput = function(){
      card.querySelector('.pv').style.backgroundImage = this.value ? "url('/"+this.value.replace(/^\//,'')+"')" : 'none';
    };
    card.querySelector('.ph_save').onclick = function(){
      api('/photos/'+pid, { method:'PUT', body: {
        file_path: card.querySelector('.ph_path').value.trim(),
        sort_order: +card.querySelector('.ph_sort').value
      }}).then(function(){ toast('图片已保存'); openProject(state.current.id, unitId); })
        .catch(function(e){ toast('保存失败：'+e.message); });
    };
    card.querySelector('.ph_cover').onclick = function(){
      api('/photos/'+pid, { method:'PUT', body: { is_cover: true } }).then(function(){
        toast('已设为封面'); openProject(state.current.id, unitId);
      }).catch(function(e){ toast('操作失败：'+e.message); });
    };
    card.querySelector('.ph_del').onclick = function(){
      if (!confirm('删除该图片？')) return;
      api('/photos/'+pid, { method:'DELETE' }).then(function(){
        toast('图片已删除'); openProject(state.current.id, unitId);
      }).catch(function(e){ toast('删除失败：'+e.message); });
    };
    var replaceInput = card.querySelector('.ph_replace .upload-input');
    if (replaceInput) {
      replaceInput.onchange = function() {
        var file = replaceInput.files && replaceInput.files[0];
        if (!file) return;
        var fd = new FormData();
        fd.append('file', file);
        fd.append('scope', 'unit_photo');
        fd.append('photo_id', pid);
        toast('上传中…');
        uploadForm('/upload', fd).then(function() {
          toast('图片已更换');
          openProject(state.current.id, unitId);
        }).catch(function(e){ toast('更换失败：'+e.message); });
        replaceInput.value = '';
      };
    }
  });
  var bulkInput = panel.querySelector('.ph_upload_input');
  if (bulkInput) {
    bulkInput.onchange = function() {
      var files = Array.prototype.slice.call(bulkInput.files || []);
      if (!files.length) return;
      toast('上传 '+files.length+' 张…');

      toast('图片已添加'); openProject(state.current.id, unitId);
    }).catch(function(e){ toast('添加失败：'+e.message); });
  };

function renderUnits(isTrade) {
  var tbody = document.getElementById('unitRows');
  var html = '';
  state.units.forEach(function(u) {
    var th = u.cover_image ? "background-image:url('/"+u.cover_image.replace(/^\//,'')+"')" : '';
    var priceVal = isTrade ? (u.price_total||'') : (u.rent_monthly||'');
    var pc = photosOf(u.id).length;
    html += '<tr class="unit-main" data-id="'+u.id+'">'+
      '<td><div class="thumb" style="'+th+'"></div></td>'+
      '<td><input class="u_name" value="'+esc(u.name)+'"/></td>'+
      '<td><input class="u_area" type="number" step="0.1" value="'+(u.area_sqm||'')+'"/></td>'+
      '<td><input class="u_layout" value="'+esc(u.layout_label||'')+'"/></td>'+
      '<td><input class="u_price" type="number" value="'+priceVal+'"/></td>'+
      '<td><input class="u_sort" type="number" value="'+(u.sort_order||0)+'"/></td>'+
      '<td><button type="button" class="btn link u_photos">'+pc+' 张 ›</button></td>'+
      '<td><a class="btn link u_detail" href="juzhu-admin-unit.html?unit_id='+u.id+'" target="_blank">编辑 ›</a></td>'+
      '<td class="acts"><button class="btn primary u_save">保存</button><button class="btn danger u_del">删</button></td>'+
    '</tr>';
    if (state.expandedUnit === u.id) {
      html += '<tr class="unit-photos-row"><td colspan="9">'+renderPhotoPanel(u.id)+'</td></tr>';
    }
  });
  tbody.innerHTML = html;

  tbody.querySelectorAll('tr.unit-main').forEach(function(tr) {
    var id = +tr.dataset.id;
    tr.querySelector('.u_save').onclick = function(){ saveUnit(tr, id, isTrade); };
    tr.querySelector('.u_del').onclick = function(){ deleteUnit(id); };
    tr.querySelector('.u_photos').onclick = function(){
      state.expandedUnit = state.expandedUnit === id ? null : id;
      renderUnits(isTrade);
      if (state.expandedUnit === id) bindPhotoPanel(id);
    };
  });
  if (state.expandedUnit) bindPhotoPanel(state.expandedUnit);
}

  if (state.apiOk) {

      document.getElementById('toggleCitySwitcher').checked = s.show_city_switcher !== false;
      document.getElementById('toggleLifeService').checked = s.show_life_service !== false;

    document.getElementById('toggleCitySwitcher').checked = true;

  api('/export', { method:'POST' }).then(function(r) {
    toast('已导出 JSON · 房源量 '+r.stats.unit_count);
  }).catch(function(e){ toast('导出失败：'+e.message); });
};

function debounce(fn, ms) {
  var t;
  return function() { clearTimeout(t); t = setTimeout(fn, ms); };
}

loadCities().then(function() {
  return loadDictionary();
}).then(function() {
  return Promise.all([loadProjects(), loadSettings()]);
}).catch(function() {
  document.body.classList.add('api-off');
  document.getElementById('apiWarn').hidden = false;
  switchTab('phone');
});
</script>
