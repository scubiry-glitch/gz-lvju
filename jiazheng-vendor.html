<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>商家详情 · 家政服务</title>
<link rel="stylesheet" href="jiazheng-app.css?v=2" />
</head>
<body>
<div class="jz-wrap">
  <div class="jz-top">
    <a class="jz-back" href="javascript:history.back()">‹</a>
    <span class="jz-title" id="pageTitle">商家详情</span>
    <div class="jz-actions">
      <a href="javascript:;">⋯</a>
      <a href="javascript:;">☆</a>
    </div>
  </div>

  <div id="vendorHead" style="padding:20px 16px;background:var(--surface);border-bottom:1px solid var(--line);">
    <div style="text-align:center;color:var(--muted);padding:20px;">加载中…</div>
  </div>

  <div class="jz-tabs">
    <a class="on" href="javascript:;" data-tab="sku">服务列表</a>
    <a href="javascript:;" data-tab="worker">服务者</a>
    <a href="javascript:;" data-tab="rating">评价</a>
    <a href="javascript:;" data-tab="intro">商家介绍</a>
  </div>

  <div id="tab-sku" class="tab-pane" style="padding:12px 0;"></div>
  <div id="tab-worker" class="tab-pane" style="display:none;padding:12px 16px;"></div>
  <div id="tab-rating" class="tab-pane" style="display:none;"></div>
  <div id="tab-intro" class="tab-pane" style="display:none;padding:16px;"></div>

  <div class="jz-cta-bar">
    <a class="sec" href="javascript:;">联系客服</a>
    <a class="pri" href="javascript:;" id="bookBtn">立即预订</a>
  </div>
</div>

<script src="jiazheng-data.js?v=2"></script>
<script>
var qs = new URLSearchParams(location.search);
var type = qs.get('type') || 'cleaning';
var vendorId = parseInt(qs.get('vendor') || '0', 10);
var cat = JZ_DATA.getCat(type);

JZ_DATA.getVendor(type, vendorId).then(function(v){
  if (!v) {
    document.querySelector('.jz-wrap').innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">商家不存在</div>';
    return;
  }
  document.getElementById('pageTitle').textContent = v.name;

  var liveTag = v.live ? '<span class="live">直播中</span>' : '';
  var rankTag = v.rank ? '<span class="bd bd-p">'+v.rank.label+'</span>' : '';
  var badgeHtml = (v.badges||[]).map(function(b){
    var m = {whitelist:'bd-g', backcheck:'bd-b', insurance:'bd-b', top10:'bd-p', commitment:'bd-r'};
    var t = {whitelist:'白名单', backcheck:'背调', insurance:'百万保障', top10:'销量榜', commitment:'不满意重做'};
    return '<span class="bd '+(m[b]||'bd-t')+'">'+(t[b]||b)+'</span>';
  }).join('');
  document.getElementById('vendorHead').innerHTML =
    '<div style="display:flex;gap:14px;">'+
      '<div style="width:72px;height:72px;border-radius:16px;background:var(--brand-soft);display:grid;place-items:center;font-size:36px;flex-shrink:0;">'+v.logo+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;">'+v.name+' '+liveTag+'</div>'+
        '<div style="font-size:13px;color:#ea580c;margin-top:2px;">★ '+v.rating+' · '+v.review_count+'条评论</div>'+
        '<div style="font-size:12px;color:#64748b;margin-top:4px;">'+(v.dist||'')+' · '+v.hours+'</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'+rankTag+badgeHtml+'</div>'+
      '</div>'+
    '</div>';

  // SKU
  document.getElementById('tab-sku').innerHTML = (v.products||[]).map(function(p){
    return '<div style="background:var(--surface);border-radius:12px;padding:14px 16px;margin:8px 12px;border:1px solid var(--line);">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
        '<div style="flex:1;min-width:0;">'+
          '<div style="font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;">'+
            '<span class="bd bd-r">'+p.discount_label+'</span>'+p.title+
          '</div>'+
          '<div style="font-size:12px;color:#64748b;margin-top:4px;">'+p.subtitle+'</div>'+
          '<div style="font-size:11px;color:#64748b;margin-top:2px;">'+(p.area_range||'')+(p.area_range?' · ':'')+p.earliest_time+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0;margin-left:12px;">'+
          '<div style="color:var(--brand);font-size:18px;font-weight:700;">¥<b>'+p.price+'</b></div>'+
          '<div style="color:#94a3b8;font-size:11px;text-decoration:line-through;">¥'+p.original_price+'</div>'+
        '</div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">'+
        (p.service_tags||[]).map(function(t){return '<span class="bd bd-t">'+t+'</span>'}).join('')+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);">'+
        '<div style="font-size:11px;color:#64748b;">已订 '+(p.sales_count>=10000?(p.sales_count/10000).toFixed(1)+'万':p.sales_count)+' · ★'+p.rating+'</div>'+
        '<a class="bk" style="padding:6px 16px;background:var(--brand);color:#fff;font-size:13px;border-radius:8px;font-weight:600;" href="jiazheng-booking.html?type='+type+'&vendor='+v.id+'&product='+p.id+'">立即预订</a>'+
      '</div>'+
    '</div>';
  }).join('');

  // 服务者
  var workers = v.workers || [];
  if (!workers.length) {
    document.getElementById('tab-worker').innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">暂无服务者信息</div>';
  } else {
    document.getElementById('tab-worker').innerHTML = workers.map(function(w){
      var certHtml = [
        w.certs && w.certs.indexOf('id_card')>-1?'<span class="bd bd-g">身份证</span>':'',
        w.certs && w.certs.indexOf('health')>-1?'<span class="bd bd-g">健康证</span>':'',
        w.certs && w.certs.indexOf('skill')>-1?'<span class="bd bd-g">技能证</span>':'',
        w.certs && w.certs.indexOf('insurance')>-1?'<span class="bd bd-b">保险</span>':''
      ].join('');
      return '<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;">'+
        '<div style="display:flex;gap:12px;">'+
          '<div style="width:54px;height:54px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:24px;flex-shrink:0;">'+w.avatar+'</div>'+
          '<div style="flex:1;min-width:0;">'+
            '<div style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;">'+
              w.name+'<span class="bd bd-b">'+w.level+'</span>'+
              (w.online?'<span class="bd bd-g" style="font-size:9px;">在线</span>':'')+
            '</div>'+
            '<div style="font-size:12px;color:#ea580c;margin-top:2px;">★ '+w.rating+' · '+w.completed_orders+'单 · '+w.years_experience+'年经验</div>'+
            '<div style="font-size:11px;color:#64748b;margin-top:2px;">距您 '+(w.distance_km||'--')+'km · 信用分 '+w.credit_score+'</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'+
              (w.tags||[]).map(function(t){return '<span class="bd bd-t">'+t+'</span>'}).join('')+
            '</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'+certHtml+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  // 评价
  var reviews = [
    { name:'张*华', star:5, text:'阿姨很专业，卫生间死角都清理了，下次还会预约。', tags:['准时','干净','细致'], when:'1个月前', reply:'感谢您的支持～' },
    { name:'李*', star:5, text:'整体很满意，厨房油污也擦得干干净净。', tags:['专业','细致'], when:'2个月前' },
    { name:'王*', star:4, text:'师傅人很好，但迟到了一点，可以接受。', tags:['态度好'], when:'2个月前' },
    { name:'陈*', star:5, text:'从下单到上门只用 1 小时，效率高！', tags:['准时','高效'], when:'3个月前', reply:'感谢好评，期待下次为您服务' }
  ];
  var tagStats = {'准时':17,'干净':23,'细致':18,'主动':12,'专业':15,'周到':8,'热情':7};
  var totalReviews = v.review_count;
  document.getElementById('tab-rating').innerHTML =
    '<div class="jz-rating">'+
      '<div class="overall"><b>'+v.rating+'</b><small>基于 '+totalReviews.toLocaleString()+' 条评价</small></div>'+
      '<div class="tags">'+Object.keys(tagStats).map(function(k){return '<span class="tg">'+k+' '+tagStats[k]+'%</span>'}).join('')+'</div>'+
      reviews.map(function(r){
        return '<div class="item">'+
          '<div style="display:flex;justify-content:space-between;">'+
            '<span class="nm">'+r.name+'</span>'+
            '<span style="font-size:11px;color:var(--muted);">'+r.when+'</span>'+
          '</div>'+
          '<div class="meta"><span class="star">'+'★'.repeat(r.star)+'</span> <span style="color:var(--muted);">'+r.star+'.0</span></div>'+
          '<div class="text">'+r.text+'</div>'+
          '<div style="display:flex;gap:4px;">'+(r.tags||[]).map(function(t){return '<span class="bd bd-t">'+t+'</span>'}).join('')+'</div>'+
          (r.reply?'<div class="reply"><b>商家回复：</b>'+r.reply+'</div>':'')+
        '</div>';
      }).join('')+
    '</div>';

  // 介绍
  document.getElementById('tab-intro').innerHTML =
    '<div style="background:var(--surface);border-radius:12px;padding:16px;">'+
      '<h3 style="font-size:14px;margin:0 0 8px;">商家介绍</h3>'+
      '<p style="font-size:13px;color:var(--muted);line-height:1.6;">'+
        v.name+' 是一家专业的家政服务公司，成立于2018年，团队规模200+人，全部经过平台背调、身份认证、健康证、技能证四证齐全。'+
        '专注 '+cat.name+' 服务，覆盖杭州主城区 5km 内 30 分钟响应。'+
      '</p>'+
      '<h3 style="font-size:14px;margin:14px 0 8px;">服务流程</h3>'+
      '<ol style="font-size:13px;color:var(--muted);line-height:1.8;padding-left:18px;">'+
        '<li>线上预约 + 选定时间</li>'+
        '<li>平台派单 + 服务者确认</li>'+
        '<li>30分钟极速上门</li>'+
        '<li>服务完成 + 上传照片</li>'+
        '<li>客户评价 + 信用分回流</li>'+
      '</ol>'+
      '<h3 style="font-size:14px;margin:14px 0 8px;">退订政策</h3>'+
      '<p style="font-size:12px;color:var(--muted);line-height:1.6;">'+
        '· 服务前 2 小时可免费取消<br>'+
        '· 服务前 2 小时内取消扣 30%<br>'+
        '· 服务开始后不可取消<br>'+
        '· 不满意 100% 重做'+
      '</p>'+
    '</div>';

  // Tab 切换
  document.querySelector('.jz-tabs').addEventListener('click', function(e){
    var t = e.target.closest('[data-tab]');
    if (!t) return;
    document.querySelectorAll('.jz-tabs a').forEach(function(a){ a.classList.toggle('on', a===t); });
    document.querySelectorAll('.tab-pane').forEach(function(p){ p.style.display = p.id === 'tab-'+t.dataset.tab ? 'block' : 'none'; });
  });
});
</script>
</body>
</html>
