<!doctype html>
<html lang="zh-CN" data-console-login="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我的订单 · 生活服务</title>
<link rel="stylesheet" href="lvju-app.css?v=7">
<style>
  .scr{padding-bottom:24px;}
  .appbar{position:sticky;}
  .stt.paid{color:var(--gold-deep);}
  .stt.assigned{color:var(--brand);}
  .stt.serving{color:#ea580c;}
  .stt.cancelled{color:#94a3b8;}
  .empty{padding:56px 24px;text-align:center;color:var(--muted);font-size:13px;}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;}
  .order-more{text-align:center;padding:12px 20px 24px}.order-more button{border:1px solid var(--brand);border-radius:8px;background:#fff;color:var(--brand);padding:10px 24px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar">
      <a class="bk" href="index.html?tab=jiazheng">‹</a>
      <div class="ttl">我的订单</div>
      <div class="act"><span style="visibility:hidden">⚙</span></div>
    </div>

    <div class="otabs" id="tabs">
      <a class="on" data-s="">全部</a>
      <a data-s="pending">待付款</a>
      <a data-s="paid">已支付</a>
      <a data-s="assigned">已派单</a>
      <a data-s="serving">服务中</a>
      <a data-s="completed">已完成</a>
    </div>

    <div class="wrap" id="list" style="padding-top:14px;"></div>
    <div class="order-more" id="order-more" role="status"></div>
  </div>
</div>
<script src="screens/_console-login.js"></script>
<script src="jsbridgesdk.js?v=1"></script>
<script src="screens/_beike-login.js?v=18"></script>
<script src="screens/_jzapi.js?v=11"></script>
<script>
(function(){
  var JZ = window.BZF_JZ;
  var q = new URLSearchParams(location.search);
  var curStatus = q.get('status') || '';
  var CAT_ICON = { cleaning: '🧹', repair: '🔧', moving: '📦', nanny: '👶' };
  var STATUS_UI = {
    pending:   { label: '待付款', cls: 'paid' },
    paid:      { label: '已支付', cls: 'paid' },
    assigned:  { label: '已派单', cls: 'assigned' },
    serving:   { label: '服务中', cls: 'serving' },
    completed: { label: '已完成', cls: 'done' },
    cancelled: { label: '已取消', cls: 'cancelled' }
  };

  function fmtYuan(fee){
    if (fee == null) return '—';
    return '¥' + Number(fee / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function render(list,append){
    if (!list || !list.length) {
      if(!append)document.getElementById('list').innerHTML = '<div class="empty"><span class="ic">🧾</span>暂无订单</div>';
      return;
    }
    var cards = list.map(function(o){
      var st = STATUS_UI[o.status] || { label: o.status, cls: 'done' };
      if (o.refund_status) st = { label: o.refund_status === 'refunded' ? '已退款' : '退款处理中', cls: 'cancelled' };
      if (o.pay_status === 'closing') st = { label: '取消处理中', cls: 'cancelled' };
      if (o.is_commerce && o.pay_status === 'paid' && o.fulfillment_status !== 'fulfilled') st = { label: '已付款 · 权益发放中', cls: 'paid' };
      if (o.is_commerce && o.pay_status === 'partially_refunded') st = { label: '部分退款', cls: 'done' };
      var payable = o.status === 'pending' && !['paid','closing','closed','refunded','refund_pending','partially_refunded'].includes(o.pay_status);
      var payHref = o.is_internal_service ? 'lvju-app-pay.html?channel=jiazheng&order=' + encodeURIComponent(o.order_ref) : o.cashier_href;
      var name = o.product_name || '服务（已下架）';
      var icon = CAT_ICON[o.category_id] || '🧰';
      return '<div class="ordcard">' +
        '<div class="oh"><span class="shop">🐚 ' + esc((JZ.channelShort && JZ.channelShort()) || '新居住') + ' · 生活服务</span>' +
        '<span class="stt ' + st.cls + '">' + (o.is_demo?'演示 · 已发放':st.label) + '</span></div>' +
        '<div class="ob">' +
          '<div class="th" style="display:grid;place-items:center;font-size:30px;' +
            'background:linear-gradient(135deg,#0f766e,#14b8a6);">' + icon + '</div>' +
          '<div class="oi">' +
            '<div class="nm">' + esc(name) + '</div>' +
            '<div class="meta">' + esc(o.city || '') + ' · 下单 ' + esc((o.created_at || '').slice(0, 16)) + '</div>' +
            '<div class="amt">订单金额 <b>' + fmtYuan(o.fee) + '</b> · 订单号 ' + esc((o.order_ref || '').slice(-6)) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="of">' + (payable && payHref ? '<a class="primary" href="' + esc(payHref) + '">去付款</a>' : '') + '<a class="primary" href="juzhu-jiazheng-order-detail.html?order_ref=' +
          encodeURIComponent(o.order_ref) + '">查看详情</a></div>' +
      '</div>';
    }).join('');
    if(append)document.getElementById('list').insertAdjacentHTML('beforeend',cards);
    else document.getElementById('list').innerHTML=cards;
  }

  var currentPage=1,requestSeq=0;
  async function load(page,append){
    page=page||1;append=!!append;var seq=++requestSeq,more=document.getElementById('order-more');
    more.textContent='正在加载订单…';
    var params=new URLSearchParams({limit:'30',page:String(page)});if(curStatus)params.set('status',curStatus);
    try{
      var response=await fetch('/api/juzhu/gr/orders?source=account&'+params,{headers:JZ.authHeaders()});
      var result;
      if(response.status===401){
        var uid=await JZ.ensureUserId();
        if(!uid){if(seq===requestSeq){document.getElementById('list').innerHTML='<div class="empty"><span class="ic">🔒</span>登录后查看订单<br><button id="main-order-login" style="margin-top:16px;padding:10px 20px;border:0;border-radius:10px;background:#0f766e;color:#fff">账号登录</button></div>';more.textContent='';}return;}
        response=await fetch('/api/juzhu/gr/orders?user_id='+encodeURIComponent(uid)+'&'+params);
      }
      result=await response.json();if(seq!==requestSeq)return;
      if(!response.ok||!result.ok)throw Error(result.error||'加载失败');
      render(result.list||[],append);currentPage=page;
      more.innerHTML=result.has_more?'<button type="button" id="load-more-orders">加载更多订单</button>':'';
    }catch(error){if(seq===requestSeq){if(!append)document.getElementById('list').textContent=error.message;more.innerHTML=append?'<button type="button" id="load-more-orders">加载失败，点击重试</button>':'';}}
  }

  document.getElementById('list').addEventListener('click',e=>{if(e.target.id==='main-order-login')BZF_CONSOLE.requireLogin({hint:'查看我的生活服务订单'}).then(()=>load()).catch(()=>{});});
  document.getElementById('order-more').addEventListener('click',e=>{if(e.target.id==='load-more-orders')load(currentPage+1,true);});
  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('a'); if (!t) return;
    curStatus = t.getAttribute('data-s');
    document.querySelectorAll('#tabs a').forEach(function(a){ a.classList.toggle('on', a === t); });
    load();
  });

  // 初始 tab 高亮：URL status 参数对齐
  if (curStatus) {
    document.querySelectorAll('#tabs a').forEach(function(a){
      a.classList.toggle('on', a.getAttribute('data-s') === curStatus);
    });
  }
  (JZ.loadChannelBrand ? JZ.loadChannelBrand() : Promise.resolve()).then(()=>load());
})();
</script>
</body>
</html>
