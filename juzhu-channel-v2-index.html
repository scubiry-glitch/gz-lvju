<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>新居住 · 方案B 编辑部索引 · 贝壳</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scheme-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0;font-size:10px;color:var(--muted);}
  .scheme-bar a{color:var(--brand);font-weight:600;}
  .masthead{padding:14px 18px 10px;border-bottom:1px solid var(--border);background:#fff;margin-top:-4px;}
  .masthead .row{display:flex;align-items:baseline;justify-content:space-between;}
  .masthead .ek{font-size:9px;letter-spacing:.38em;color:var(--gold-deep);}
  .masthead h2{font-family:var(--serif);font-size:22px;color:var(--ink);margin-top:4px;}
  .masthead .vol{font-size:10px;color:var(--muted);}
  .masthead .sum{display:flex;gap:20px;margin-top:12px;font-size:10px;color:var(--muted);}
  .masthead .sum b{font-family:var(--serif);font-size:16px;color:var(--brand-deep);display:block;}
  /* pill tabs */
  .pill-tabs{display:flex;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .pill-tabs a{flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:999px;
    color:var(--muted);background:#f1f4f3;border:1px solid transparent;}
  .pill-tabs a.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.2);}
  .pane{display:none;}
  .pane.on{display:block;}
  /* index rows */
  .index{padding:6px 18px 20px;}
  .ihead{display:grid;grid-template-columns:36px 1fr 52px 52px 52px;gap:6px;padding:8px 0 6px;
    font-size:9px;color:var(--muted);letter-spacing:.04em;border-bottom:2px solid var(--ink);}
  .ihead span:last-child{text-align:right;}
  .irow{display:grid;grid-template-columns:36px 1fr 52px 52px 52px;gap:6px;align-items:center;
    padding:14px 0;border-bottom:1px solid var(--border);color:var(--ink);}
  .irow .no{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--brand-deep);}
  .irow .nm{font-family:var(--serif);font-size:15px;font-weight:700;}
  .irow .nm small{display:block;font-family:var(--font);font-size:10px;font-weight:400;color:var(--muted);margin-top:2px;}
  .irow .n{text-align:center;font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);}
  .irow .n.gold{color:var(--gold-deep);}
  .irow .n small{display:block;font-family:var(--font);font-size:8px;font-weight:400;color:var(--muted);}
  .irow:active{background:var(--brand-soft);margin:0 -18px;padding-left:18px;padding-right:18px;}
  /* trade compact */
  .trade-wrap{padding:12px 18px 24px;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar">
      <a class="bk" href="beike-app-home.html">‹</a>
      <div class="ttl">新居住<small>方案 B · 编辑部索引</small></div>
      <div class="act"><a href="juzhu-channel-schemes.html">≡</a></div>
    </div>

    <div class="masthead">
      <div class="row">
        <div>
          <div class="ek" id="mastEk">SHENYANG · NEW LIVING</div>
          <h2>保租房区划目录</h2>
        </div>
        <div class="vol">Vol. 2026<br>试点期</div>
      </div>
      <div class="sum" id="mastSum">
        <div><b>—</b>行政区</div>
        <div><b>—</b>在营项目</div>
        <div><b>—</b>在租房型</div>
        <div><b>—</b>全市均价</div>
      </div>
    </div>

    <div class="scheme-bar"><span>方案 B · 编辑部索引</span><a href="juzhu-channel-schemes.html">切换方案 ›</a></div>

    <div class="pill-tabs" id="tabs">
      <a class="on" data-tab="bzf">保租房</a>
      <a data-tab="trade">卖旧买新</a>
    </div>

    <div class="pane on" id="pane-bzf">
      <div class="index">
        <div class="ihead">
          <span>NO.</span><span>行政区</span><span style="text-align:center">项目</span>
          <span style="text-align:center">可租</span><span style="text-align:center">均价</span>
        </div>
        <div id="index-list"></div>
      </div>
      <div class="banner gold" style="margin-top:0;">
        <span class="bi">📋</span>
        <div class="bt"><b>目录说明</b><p>数字为试点在营数据 · 点击行进入区级房源列表</p></div>
      </div>
    </div>

    <div class="pane" id="pane-trade">
      <div class="sec-h" style="margin-top:14px;"><span class="bar"></span><h2>置换房源</h2><span class="more">筛选 ›</span></div>
      <div class="trade-wrap" id="trade-list"></div>
    </div>
    <div class="load-err" id="err" hidden style="padding:20px;text-align:center;color:var(--muted);font-size:12px;"></div>
  </div>
</div>
<script src="juzhu/app.js?v=2"></script>
<script>
(function(){
  var pad = function(n){ return String(n).padStart(2,'0'); };

  function renderMasthead(d, dists){
    document.getElementById('mastEk').textContent = d.city.name.toUpperCase() + ' · NEW LIVING';
    var avgList = dists.filter(function(x){ return x.avg_price; }).map(function(x){ return x.avg_price; });
    var cityAvg = avgList.length ? Math.round(avgList.reduce(function(a,b){return a+b;},0)/avgList.length) : '—';
    document.getElementById('mastSum').innerHTML =
      '<div><b>'+d.stats.district_count+'</b>行政区</div>'+
      '<div><b>'+d.stats.project_count_bzf+'</b>在营项目</div>'+
      '<div><b>'+d.stats.unit_count+'</b>在租房型</div>'+
      '<div><b>'+(cityAvg==='—'?'—':'¥'+cityAvg)+'</b>全市均价</div>';
  }

  function renderIndex(list){
    document.getElementById('index-list').innerHTML = list.map(function(d){
      var sub = d.note || (d.project_count+' 项目 · '+d.unit_count+' 户型');
      var href = d.has_projects ? 'juzhu-bzf-list.html?district='+encodeURIComponent(d.name) : '#';
      return '<a class="irow" href="'+href+'"'+(d.has_projects?'':' onclick="return false" style="opacity:.7;text-decoration:none"')+'>'+
        '<span class="no">'+pad(d.sort_order)+'</span>'+
        '<span class="nm">'+d.name+'<small>'+sub+'</small></span>'+
        '<span class="n">'+d.project_count+'<small>项</small></span>'+
        '<span class="n">'+(d.vacant_count||0)+'<small>套</small></span>'+
        '<span class="n gold">'+(d.avg_price||'—')+'<small>元/月</small></span></a>';
    }).join('');
  }

  function renderTrade(list){
    document.getElementById('trade-list').innerHTML = list.map(function(p){
      var style = p.cover_image ? 'background-image:url('+p.cover_image+');background-size:cover;background-position:center;' : '';
      var tags = JUZHU.asTags(p.tags);
      return '<a class="lrow" href="juzhu-bzf-project.html?channel=trade&project='+encodeURIComponent(p.slug)+'">'+
        '<div class="th" style="'+style+'"><span class="star">置换</span></div>'+
        '<div class="info"><div class="nm">'+p.name+'</div>'+
        '<div class="meta">'+(p.address||'')+' · '+p.unit_count+' 户型</div>'+
        '<div class="tags">'+tags.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>'+
        '<div class="pr"><b>'+(p.price_from||'—')+'<small>万起</small></b>'+
        '<span class="unit">'+(p.old_house_hint||'')+'</span></div></div></a>';
    }).join('');
  }

  document.getElementById('tabs').addEventListener('click',function(e){
    var t=e.target.closest('[data-tab]');if(!t)return;
    document.querySelectorAll('.pill-tabs a').forEach(function(a){ a.classList.toggle('on',a===t); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on',p.id==='pane-'+t.dataset.tab); });
  });

  JUZHU.load().then(function(d){
    var dists = JUZHU.districts();
    renderMasthead(d, dists);
    renderIndex(dists);
    renderTrade(JUZHU.tradeListings());
  }).catch(function(err){
    document.getElementById('err').hidden = false;
    document.getElementById('err').textContent = '数据加载失败：'+err.message;
  });
})();
</script>
</body>
</html>
