<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>家政详情</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scr{padding-bottom:110px;}
  .hero{position:relative;padding:74px 16px 18px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#0b5d56,#11453f 48%,#c58d36);}
  .hero.repair{background:linear-gradient(135deg,#1d4ed8,#16356a 48%,#8bb8ff);}
  .hero.moving{background:linear-gradient(135deg,#f97316,#bf4b13 48%,#f7b267);}
  .hero.nanny{background:linear-gradient(135deg,#7c3aed,#4d2579 48%,#d6bcfa);}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(255,255,255,.18),transparent 18%),
    repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px);}
  .hero .in{position:relative;z-index:2;}
  .eyebrow{font-size:10px;letter-spacing:.22em;opacity:.88;}
  .hero h1{font-family:var(--serif);font-size:29px;line-height:1.18;margin-top:8px;}
  .hero p{font-size:12px;opacity:.94;margin-top:8px;max-width:29ch;line-height:1.55;}
  .metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .metrics span{font-size:10px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);}
  .price-card{background:#fff;margin:-18px 12px 0;padding:16px;border-radius:18px;position:relative;z-index:5;
    box-shadow:0 12px 30px rgba(15,42,38,.08);}
  .price-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .price-row .left b{font-family:var(--serif);font-size:34px;color:#ef5a2a;line-height:1;}
  .price-row .left small{font-size:12px;color:var(--muted);}
  .price-row .right{font-size:11px;color:var(--muted);text-align:right;}
  .coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;
    background:linear-gradient(90deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;}
  .coupon b{color:#ea580c;font-size:14px;}
  .coupon span{font-size:11px;color:#9a3412;}
  .block{background:#fff;margin:10px 12px 0;padding:16px;border-radius:16px;box-shadow:0 6px 18px rgba(15,42,38,.05);}
  .block h3{font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:8px;}
  .block h3::before{content:"";width:3px;height:16px;border-radius:3px;background:linear-gradient(var(--brand),var(--gold));}
  .spec{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.7;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip-row span{font-size:11px;padding:5px 10px;border-radius:999px;background:#eef6f4;color:var(--brand-deep);}
  .list{display:grid;gap:10px;margin-top:12px;}
  .item{display:flex;gap:10px;align-items:flex-start;}
  .item .dot{width:22px;height:22px;border-radius:50%;background:#eef6f4;color:var(--brand);display:grid;place-items:center;font-size:12px;flex-shrink:0;}
  .item b{display:block;font-size:13px;color:var(--ink);}
  .item p{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.55;}
  .time-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .time-slots a{display:block;text-align:center;padding:10px 6px;font-size:12px;border:1px solid var(--border);border-radius:12px;background:#f8fbfa;color:var(--ink);}
  .time-slots a.on{border-color:var(--brand);background:#eef6f4;color:var(--brand-deep);font-weight:700;}
  .related{display:grid;gap:10px;margin-top:12px;}
  .r-card{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:#f8fbfa;border:1px solid var(--border);}
  .r-card b{font-size:14px;color:var(--ink);}
  .r-card p{margin:3px 0 0;font-size:11px;color:var(--muted);}
  .r-card span{font-family:var(--serif);font-size:20px;color:var(--gold-deep);white-space:nowrap;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(16,23,28,.92);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;z-index:80;display:none;}
  .toast.on{display:block;}
  .slot-date{font-size:12px;font-weight:700;color:var(--ink);margin:14px 0 8px;}
  .slot-date:first-child{margin-top:4px;}
  /* 真实档期的「日期空间」日期条（与意向选择器视觉一致）*/
  .rs-dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .rs-dates::-webkit-scrollbar{display:none;}
  .rs-date{flex:0 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:#f8fbfa;color:var(--ink);cursor:pointer;font:inherit;}
  .rs-date .dl{font-size:12px;font-weight:700;line-height:1.2;}
  .rs-date .dm{font-size:10px;color:var(--muted);}
  .rs-date.on{border-color:var(--brand);background:#eef6f4;color:var(--brand-deep);}
  .rs-date.on .dm{color:var(--brand-deep);}
  .slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .slot{border:1px solid var(--border);border-radius:12px;padding:9px 11px;background:#f8fbfa;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .slot.on{border-color:var(--brand);background:#eef6f4;box-shadow:0 0 0 2px rgba(15,118,110,.16);}
  .slot .st{font-size:13px;font-weight:700;color:var(--ink);}
  .slot .sw{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .slot .rm{font-size:10px;color:var(--brand);font-weight:600;}
  .slot-empty{font-size:12px;color:var(--muted);padding:8px 0;}
  .block h3 .count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;font-family:var(--font);}
  /* 商家介绍 */
  .merchant{display:flex;gap:12px;align-items:flex-start;margin-top:12px;}
  .merchant .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#eef6f4,#dfeeea);display:grid;place-items:center;font-size:28px;flex-shrink:0;}
  .merchant .mi{flex:1;min-width:0;}
  .merchant .nm{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .merchant .rk{font-size:10px;color:var(--gold-deep);background:#fff7ed;border:1px solid #fed7aa;padding:2px 8px;border-radius:999px;font-weight:600;}
  .merchant .rt{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .merchant .rt b{color:#ef5a2a;font-family:var(--serif);font-size:14px;}
  .cert-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .cert{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 10px;border-radius:999px;background:#eafaf3;color:#0f766e;border:1px solid #b9e7d7;font-weight:600;}
  .cert::before{content:"✓";font-size:10px;}
  .cert.gov{background:#eef2ff;color:#1e40af;border-color:#c7d2fe;}
  .merchant-summary{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px;}
  /* 多商家同款列表 */
  .vrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:#fff;margin-top:10px;text-decoration:none;color:inherit;}
  .vrow:first-of-type{margin-top:12px;}
  .vrow.cur{border-color:var(--brand);background:#eef6f4;}
  .vrow .vlogo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#eef6f4,#dfeeea);display:grid;place-items:center;font-size:22px;flex-shrink:0;}
  .vrow .vmi{flex:1;min-width:0;}
  .vrow .vmi b{font-size:14px;color:var(--ink);}
  .vrow .vmi b em{font-style:normal;font-size:10px;color:var(--brand);font-weight:700;margin-left:4px;}
  .vrow .vsub{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .vrow .vbs{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
  .vrow .vb{font-size:9px;color:var(--brand-deep);background:#eef6f4;border:1px solid var(--border);border-radius:999px;padding:1px 7px;}
  .vrow .vprice{font-family:var(--serif);font-size:17px;color:#ef5a2a;flex-shrink:0;}
  .stat-grid{display:flex;gap:8px;margin-top:12px;}
  .stat-grid .s{flex:1;text-align:center;background:#f8fbfa;border:1px solid var(--border);border-radius:12px;padding:10px 4px;}
  .stat-grid .s b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink);}
  .stat-grid .s span{font-size:10px;color:var(--muted);}
  /* 认证服务者 */
  .workers{display:grid;gap:10px;margin-top:12px;}
  .wk{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:15px;background:linear-gradient(135deg,#f9fcfb,#eef6f4);border:1px solid #e5efeb;}
  .wk .avatar{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:24px;flex-shrink:0;position:relative;}
  .wk .lvl{position:absolute;bottom:-5px;right:-5px;font-size:9px;font-weight:800;background:var(--gold-deep);color:#fff;border:2px solid #fff;border-radius:999px;padding:0 5px;line-height:15px;}
  .wk .wb{flex:1;min-width:0;}
  .wk .wn{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .wk .wl{font-size:9px;font-weight:700;color:#0f766e;background:#eafaf3;border:1px solid #b9e7d7;border-radius:999px;padding:1px 6px;}
  .wk .wmeta{font-size:11px;color:var(--muted);margin-top:4px;}
  .wk .wmeta b{color:#ef5a2a;}
  .wk .wcerts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .wk .wcerts span{font-size:10px;padding:2px 7px;border-radius:999px;background:#eafaf3;color:#0f766e;border:1px solid #d6efe5;}
  .wk .wcerts span::before{content:"✓ ";}
  .wk{cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .wk .pick{margin-left:auto;align-self:center;flex-shrink:0;font-size:11px;font-weight:700;color:var(--brand);border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;}
  .wk.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(15,118,110,.18);}
  .wk.sel .pick{background:var(--brand);color:#fff;border-color:var(--brand);}
  /* 真实评价 */
  .reviews{display:grid;gap:12px;margin-top:12px;}
  .rv{border-bottom:1px solid var(--border);padding-bottom:12px;}
  .reviews .rv:last-child{border-bottom:none;padding-bottom:0;}
  .rv .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rv .ru{font-size:13px;font-weight:600;color:var(--ink);}
  .rv .rs{font-size:12px;color:#f59e0b;letter-spacing:1px;white-space:nowrap;}
  .rv .rtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .rv .rtags span{font-size:10px;padding:2px 8px;border-radius:999px;background:#f1f5f4;color:var(--muted);}
  .rv .rtext{font-size:12px;color:var(--ink);line-height:1.65;margin-top:8px;}
  .rv .rreply{font-size:11px;color:var(--muted);background:#f8fbfa;border-left:2px solid var(--brand);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:9px;line-height:1.6;}
  /* 底部双按钮：lvju-app.css 的 .cta 为「单按钮」设计（padding 13×30 + margin-left:auto），
     这里放了两个按钮会挤到换行。改为紧凑 + nowrap，主按钮渐变、次按钮描边。 */
  .cta{gap:8px;padding-left:14px;padding-right:14px;}
  .cta .p{flex:0 1 auto;min-width:0;}
  .cta .p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cta .heart{flex:0 0 auto;}
  .cta .btn{white-space:nowrap;flex:0 0 auto;}
  .cta .btn-call{margin-left:auto;padding:11px 14px;font-size:12px;background:#fff;
    color:var(--brand);border:1px solid var(--border);font-weight:600;}
  .cta #submitBtn{margin-left:0;padding:12px 22px;font-size:14px;}
  /* loading 遮罩 */
  .loading-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .loading-overlay.on{display:flex;}
  .loading-overlay .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay .text{color:#fff;font-size:14px;font-weight:600;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar ghost" style="position:absolute;z-index:20;">
      <a class="bk" href="javascript:history.back()">‹</a>
      <div class="ttl" id="ttl">家政详情<small>服务介绍 · 选择时间</small></div>
      <!-- 收藏/分享暂隐藏 <div class="act"><span>♡</span><span>⤴</span></div> -->
    </div>

    <div class="hero" id="hero"></div>

    <div class="price-card">
      <div class="price-row">
        <div class="left"><b id="price">¥0</b> <small id="priceUnit">起</small></div>
        <div class="right" id="sales">最近好评 1000+</div>
      </div>
      <div class="coupon"><b>神券已减 10</b><span>支付成功后进入工单池，待派单状态统一进入家政订单 API</span></div>
    </div>

    <div class="block" id="productBlock" hidden>
      <h3>服务规格<span class="count">同商家多款 · 点击切换</span></h3>
      <div id="productList"></div>
    </div>

    <div class="block">
      <h3>服务说明</h3>
      <div class="spec" id="spec"></div>
      <div class="chip-row" id="tags"></div>
      <div class="list" id="includes"></div>
    </div>

    <div class="block" id="merchantBlock" hidden>
      <h3>商家介绍<span class="count" id="mRank"></span></h3>
      <div class="merchant">
        <div class="logo" id="mLogo">🏠</div>
        <div class="mi">
          <div class="nm" id="mName">认证商家</div>
          <div class="rt" id="mRating"></div>
          <div class="cert-row" id="mCerts"></div>
        </div>
      </div>
      <div class="merchant-summary" id="mSummary"></div>
      <div class="stat-grid" id="mStats"></div>
    </div>

    <div class="block" id="vendorsBlock" hidden>
      <h3>其他商家同款<small style="font-weight:400;font-size:11px;color:var(--muted);margin-left:6px;">同款不同价 · 点击切换下单</small></h3>
      <div id="vendorList"></div>
    </div>

    <div class="block">
      <h3>认证服务者<span class="count" id="wCount"></span></h3>
      <p class="spec" style="margin-top:8px;font-size:11px;color:var(--muted);">行业认证 · 实名+持证+背调+投保，认证状态实时回流</p>
      <div class="workers" id="workers"></div>
      <a class="cta" href="screens/s-cert.html" style="display:inline-block;margin-top:12px;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:12px;color:var(--brand);font-weight:700;text-decoration:none;">查看认证与证书 ›</a>
    </div>

    <div class="block">
      <h3>服务流程</h3>
      <div class="list" id="flow"></div>
    </div>

    <div class="block" id="reviewBlock" hidden>
      <h3>真实评价<span class="count" id="rCount"></span></h3>
      <div class="reviews" id="reviews"></div>
    </div>

    <!-- 选择上门时间 暂时隐藏
    <div class="block">
      <h3 id="timeTitle">选择上门时间</h3>
      <p class="spec" id="timeHint" style="margin-top:8px;font-size:12px;color:var(--muted);">选定时间后进入确认页填写地址与联系方式</p>
      <div class="time-slots" id="timeSlots"></div>
    </div>
    -->

    <!-- 更多推荐 暂时隐藏
    <div class="block">
      <h3>更多推荐</h3>
      <div class="related" id="related"></div>
    </div>
    -->
  </div>

  <div class="cta">
    <div class="p"><b id="ctaPrice">¥0</b><span>下一步填写预约信息</span></div>
    <!-- 收藏图标暂隐藏 <div class="heart">⚑</div> -->
    <a class="btn btn-call demo-only" href="screens/p-service-demand.html">看中台工单池</a>
    <a class="btn" href="#" id="submitBtn">下一步</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="text">正在生成预约链接…</div>
</div>

<script src="jz-datepick.js?v=2"></script>
<script>
(function(){
  var JZ = window.BZF_JZ;
  var q = new URLSearchParams(location.search);
  var TYPE_SKU = { cleaning: 'deep-clean-4h', repair: 'pipe-unclog-fast', moving: 'moving-city-standard', nanny: 'nanny-hourly-3h' };
  var slug = q.get('sku') || TYPE_SKU[q.get('type')] || 'deep-clean-4h';
  var curVendor = q.get('vendor') || null;   // 多商家同款：锁定某商家
  var item = null;
  var product = null;
  var products = [];
  var related = [];
  var vendor = null;
  var vendors = [];
  var merchantIntro = null;
  var workers = [];
  var reviews = [];
  var selectedTime = '';
  var selectedWorker = '';
  var timeMode = '';   // '' | 'intent' | 'real'

  var BADGE_LABELS = { whitelist: '行业认证', backcheck: '背景核查', top10: '口碑 Top10', insurance: '已投保', commitment: '服务承诺' };
  var CERT_LABELS = { id_card: '实名认证', health: '健康证', skill: '技能证书', insurance: '已投保', backcheck: '背景核查' };
  var esc = (window.BZF_JZ && BZF_JZ.esc) ? BZF_JZ.esc : function(s){ return String(s == null ? '' : s); };
  var stars = function(n){ n = Math.max(0, Math.min(5, Math.round(n || 0))); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); };
  var num = function(n){ return Number(n || 0).toLocaleString(); };

  var TIME_SLOTS = [
    '今天 18:00', '今天 19:00', '今天 20:00', '明天 09:00',
    '明天 10:00', '明天 14:00', '明天 16:00', '明天 19:00'
  ];

  var slots = [];
  var selectedSlot = null;

  // 意向时段的时间预设按类目差异化（保姆/搬家场景不同）
  function catTimes(){
    var c = item && item.category_id;
    if (c === 'nanny') return ['09:00', '10:00', '14:00', '15:00'];       // 上户/面试时段
    if (c === 'moving') return ['08:00', '09:00', '13:00', '14:00', '18:00']; // 半天场
    return null; // 保洁/维修用组件默认（08–20）
  }
  // 意向时段 = 万能日期+时间选择器（以「今天」为起点，可选任意日期，永不过期）
  function renderTimeSlots(){
    var box = document.getElementById('timeSlots');
    if (window.JZ_DATEPICK){
      box.className = '';  // 交给 .jz-datepick 自己的布局
      JZ_DATEPICK.mount(box, { value: selectedTime, times: catTimes(), onChange: function(v){ selectedTime = v; } });
      return;
    }
    // 兜底：组件未加载时退回静态时段
    selectedTime = TIME_SLOTS[0];
    box.innerHTML = TIME_SLOTS.map(function(t, i){
      return '<a href="#" class="'+(i===0?'on':'')+'" data-time="'+t+'">'+t+'</a>';
    }).join('');
    box.addEventListener('click', function(e){
      var a = e.target.closest('[data-time]');
      if (!a) return;
      e.preventDefault();
      selectedTime = a.getAttribute('data-time');
      document.querySelectorAll('#timeSlots a').forEach(function(x){ x.classList.toggle('on', x === a); });
    });
  }

  // 时段模式提示：real=真实档期 / intent=意向时段（拿不到排期表时降级）
  function markMode(mode){
    timeMode = mode;
    var title = document.getElementById('timeTitle');
    var hint = document.getElementById('timeHint');
    if (!title || !hint) return;
    if (mode === 'real'){
      title.textContent = '选择上门档期';
      hint.innerHTML = '按服务者真实可约档期选择，选定即锁定名额';
    } else {
      title.textContent = '选择意向时段';
      hint.innerHTML = '⚠️ 该服务暂未开放精确档期，以下为<b>意向时段</b>；实际上门时间由平台派单后与您电话确认。';
    }
  }

  // 真实排班档位（有则按档下单占容量；无则降级为意向时段）
  function loadSlots(){
    var qs2 = new URLSearchParams();
    if (curVendor) qs2.set('vendor', curVendor);
    if (product && product.id) qs2.set('product', product.id);
    var u = '/api/juzhu/jiazheng/skus/' + encodeURIComponent(slug) + '/slots' + (qs2.toString() ? '?' + qs2.toString() : '');
    fetch(u)
      .then(function(r){ return r.json(); })
      .then(function(d){
        slots = (d && d.slots) || [];
        if (slots.length) { renderRealSlots(); markMode('real'); }
        else markMode('intent');
      }).catch(function(){ markMode('intent'); });
  }

  // 真实档期：也走「日期空间」——先选日期，再出该日的可约时段（与意向模式一致的交互）
  function renderRealSlots(){
    var box = document.getElementById('timeSlots');
    box.className = '';  // 去掉 .time-slots 网格样式
    var groups = {};
    slots.forEach(function(s){ (groups[s.slot_date] = groups[s.slot_date] || []).push(s); });
    var dates = Object.keys(groups).sort();
    var activeDate = (selectedSlot && groups[selectedSlot.slot_date]) ? selectedSlot.slot_date : dates[0];

    function wkLabel(ds){
      var d = new Date(ds + 'T00:00:00'), t0 = new Date(); t0.setHours(0,0,0,0);
      var idx = Math.round((d - t0) / 86400000), wk = ['周日','周一','周二','周三','周四','周五','周六'];
      return idx === 0 ? '今天' : idx === 1 ? '明天' : idx === 2 ? '后天' : wk[d.getDay()];
    }
    function md(ds){ var p = ds.split('-'); return (+p[1]) + '/' + (+p[2]); }

    function paint(){
      // 默认选中当前日期首个档位，保证不点也带真实档期下单
      if (!selectedSlot && groups[activeDate] && groups[activeDate].length){
        var f = groups[activeDate][0];
        selectedSlot = f;
        selectedTime = f.slot_date + ' ' + f.start_time;
        selectedWorker = f.worker_id ? String(f.worker_id) : selectedWorker;
      }
      var dr = dates.map(function(dt){
        return '<button type="button" class="rs-date' + (dt === activeDate ? ' on' : '') + '" data-date="' + dt + '">' +
          '<span class="dl">' + wkLabel(dt) + '</span><span class="dm">' + md(dt) + '</span></button>';
      }).join('');
      var sl = (groups[activeDate] || []).map(function(s){
        var t = s.start_time + (s.end_time ? '–' + s.end_time : '');
        var on = selectedSlot && String(selectedSlot.id) === String(s.id);
        return '<div class="slot' + (on ? ' on' : '') + '" data-slot="' + s.id + '">' +
          '<div class="st">' + t + '</div>' +
          '<div class="sw"><span>' + esc(s.worker_name || '待指派') + (s.worker_level ? ' · ' + s.worker_level : '') + '</span>' +
          '<span class="rm">剩 ' + s.remaining + '</span></div>' +
        '</div>';
      }).join('');
      box.innerHTML = '<div class="rs-dates">' + dr + '</div>' +
        '<div class="slot-grid" style="margin-top:12px;">' + sl + '</div>';
    }

    box.addEventListener('click', function(e){
      var db = e.target.closest('[data-date]');
      if (db){ activeDate = db.getAttribute('data-date'); paint(); return; }
      var el = e.target.closest('[data-slot]');
      if (!el) return;
      selectedSlot = slots.filter(function(s){ return String(s.id) === el.dataset.slot; })[0] || null;
      selectedTime = selectedSlot ? (selectedSlot.slot_date + ' ' + selectedSlot.start_time) : '';
      selectedWorker = selectedSlot && selectedSlot.worker_id ? String(selectedSlot.worker_id) : selectedWorker;
      paint();
      // 同步高亮对应服务者卡
      if (selectedSlot && selectedSlot.worker_id){
        document.querySelectorAll('#workers .wk').forEach(function(x){
          var on = x.dataset.wid === String(selectedSlot.worker_id);
          x.classList.toggle('sel', on);
          var pk = x.querySelector('.pick'); if (pk) pk.textContent = on ? '✓ 已指定' : '指定 TA';
        });
      }
    });

    paint();
  }

  // 同商家多规格：同一商家在同一 SPU 下的多个商品（套餐/服务者/价格不同），点击切换下单商品
  function renderProducts(){
    var blk = document.getElementById('productBlock');
    if (!blk) return;
    var curVendorId = String((vendor && vendor.id) || '');
    var list = (products || []).filter(function(p){ return String(p.vendor_id) === curVendorId; });
    if (list.length < 2){ blk.hidden = true; return; }
    blk.hidden = false;
    var curId = String((product && product.id) || '');
    document.getElementById('productList').innerHTML = list.map(function(p){
      var cur = String(p.id) === curId;
      var tags = (p.service_tags || []).slice(0,3).map(function(t){ return '<span class="vb">'+esc(t)+'</span>'; }).join('');
      return '<a class="vrow'+(cur ? ' cur' : '')+'" href="javascript:;" data-pid="'+p.id+'">'+
        '<span class="vmi"><b>'+esc(p.title)+'</b>'+
          '<span class="vsub">'+(p.subtitle ? esc(p.subtitle)+' · ' : '')+esc(p.unit||'次')+(p.duration_hours ? ' · '+p.duration_hours+'小时' : '')+(p.original_price ? ' · 原价'+fmtPrice(p.original_price) : '')+'</span>'+
          (tags ? '<span class="vbs">'+tags+'</span>' : '')+
        '</span>'+
        '<span class="vprice">'+fmtPrice(p.price)+'</span>'+
      '</a>';
    }).join('');
    document.getElementById('productList').querySelectorAll('[data-pid]').forEach(function(a){
      a.addEventListener('click', function(){ selectProduct(a.dataset.pid); });
    });
  }

  // 切换选中的商品：价格区联动 + 下单 product_id 联动（档期功能启用时同时重载档期）
  function selectProduct(pid){
    var p = (products || []).filter(function(x){ return String(x.id) === String(pid); })[0];
    if (!p) return;
    product = p;
    document.getElementById('price').textContent = fmtPrice(p.price);
    document.getElementById('ctaPrice').textContent = fmtPrice(p.price);
    document.getElementById('productList').querySelectorAll('.vrow').forEach(function(x){
      x.classList.toggle('cur', x.dataset.pid === String(p.id));
    });
    if (timeMode === 'real') loadSlots();
  }

  function fmtPrice(n){ return '¥' + Number(n || 0).toLocaleString(); }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._timer);
    el._timer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }

  function heroClass(cat){
    return cat === 'repair' ? 'repair' : cat === 'moving' ? 'moving' : cat === 'nanny' ? 'nanny' : 'cleaning';
  }

  function render(){
    document.getElementById('ttl').firstChild.textContent = item.name;
    var hero = document.getElementById('hero');
    hero.className = 'hero ' + heroClass(item.category_id);
    hero.innerHTML = '<div class="in">'+
      '<div class="eyebrow">'+(item.category_name || '家政服务').toUpperCase()+'</div>'+
      '<h1>'+item.name+'</h1>'+
      '<p>'+(item.spec || '')+'。行业认证持证服务者上门，支付后进入中台工单池统一派单。</p>'+
      '<div class="metrics"><span>'+(item.worker_min_level || 'L2')+'+ 持证服务者</span><span>'+(item.duration_min || 0)+' 分钟</span><span>'+(item.rating_score ? ('★ ' + Number(item.rating_score).toFixed(1)) : '高评分')+'</span></div>'+
    '</div>';
    var displayPrice = (product && product.price != null) ? product.price : item.price_from;
    document.getElementById('price').textContent = fmtPrice(displayPrice);
    document.getElementById('ctaPrice').textContent = fmtPrice(displayPrice);
    document.getElementById('priceUnit').textContent = item.price_unit || '起';
    document.getElementById('sales').textContent = item.sales_text || '最近好评稳定';
    document.getElementById('spec').textContent = item.spec || '';
    document.getElementById('tags').innerHTML = (item.tags || []).concat(item.badges || []).map(function(x){
      return '<span>' + x + '</span>';
    }).join('');
    document.getElementById('includes').innerHTML = (item.includes || []).map(function(x, i){
      return '<div class="item"><span class="dot">'+(i+1)+'</span><div><b>'+x+'</b><p>按标准工序执行，完工可回传记录。</p></div></div>';
    }).join('');
    document.getElementById('flow').innerHTML = (item.service_flow || []).map(function(x, i){
      return '<div class="item"><span class="dot">'+(i+1)+'</span><div><b>'+x+'</b><p>'+(item.service_notice && item.service_notice[i] ? item.service_notice[i] : '符合中台认证与工单流转要求')+'</p></div></div>';
    }).join('');
    // 更多推荐暂时隐藏
    // document.getElementById('related').innerHTML = related.map(function(x){
    //   return '<a class="r-card" href="?sku='+encodeURIComponent(x.slug)+'"><div><b>'+x.name+'</b><p>'+(x.spec||'')+'</p></div><span>'+fmtPrice(x.price_from)+'</span></a>';
    // }).join('');
    renderMerchant();
    renderWorkers();
    renderReviews();
  }

  // 多商家同款：同款不同价，点击切换商家（?vendor= 重载详情+档期）
  function renderVendors(){
    var blk = document.getElementById('vendorsBlock');
    if (!blk) return;
    var list = vendors || [];
    if (list.length < 2){ blk.hidden = true; return; }
    blk.hidden = false;
    var curId = String(curVendor || (vendor && vendor.id) || '');
    document.getElementById('vendorList').innerHTML = list.map(function(v){
      var cur = String(v.vendor_id) === curId;
      var badges = (v.auth_badges || []).slice(0,2).map(function(b){
        return '<span class="vb">'+esc(b.label || b)+'</span>';
      }).join('');
      return '<a class="vrow'+(cur ? ' cur' : '')+'" href="' + JZ.chainCity('?sku='+encodeURIComponent(slug)+'&vendor='+v.vendor_id) + '">'+
        '<span class="vlogo">'+esc(v.vendor_logo || '🏠')+'</span>'+
        '<span class="vmi"><b>'+esc(v.vendor_name)+(cur ? ' <em>当前</em>' : '')+'</b>'+
          '<span class="vsub">★'+Number(v.vendor_rating||0).toFixed(1)+' · '+num(v.review_count)+'评价'+(v.rank_label ? ' · '+esc(v.rank_label) : '')+'</span>'+
          (badges ? '<span class="vbs">'+badges+'</span>' : '')+
        '</span>'+
        '<span class="vprice">'+fmtPrice(v.price)+'</span>'+
      '</a>';
    }).join('');
  }

  // 商家介绍 + 认证徽章
  function renderMerchant(){
    var blk = document.getElementById('merchantBlock');
    if (!vendor){ blk.hidden = true; return; }
    blk.hidden = false;
    document.getElementById('mLogo').textContent = vendor.logo || '🏠';
    document.getElementById('mName').textContent = vendor.name || '认证商家';
    document.getElementById('mRank').textContent = vendor.rank_label || '';
    document.getElementById('mRating').innerHTML =
      '<b>★ '+Number(vendor.rating||0).toFixed(1)+'</b> · '+num(vendor.review_count)+' 条评价' +
      (vendor.address ? ' · '+esc(vendor.address) : '') + (vendor.hours ? ' · '+esc(vendor.hours) : '');
    document.getElementById('mCerts').innerHTML = (vendor.badges || []).map(function(b){
      return '<span class="cert'+(b === 'whitelist' ? ' gov' : '')+'">'+(BADGE_LABELS[b] || b)+'</span>';
    }).join('');
    document.getElementById('mSummary').textContent = (merchantIntro && merchantIntro.summary) || '';
    document.getElementById('mStats').innerHTML = ((merchantIntro && merchantIntro.stats) || []).map(function(s){
      return '<div class="s"><b>'+esc(s.value)+'</b><span>'+esc(s.label)+'</span></div>';
    }).join('');
  }

  // 认证服务者（等级 + 白名单 + 持证状态）
  function renderWorkers(){
    var wrap = document.getElementById('workers');
    document.getElementById('wCount').textContent = workers.length ? workers.length + ' 位在岗' : '';
    if (!workers.length){
      wrap.innerHTML = '<div class="wk"><div class="avatar">✓</div><div class="wb">'+
        '<div class="wn">行业认证服务者</div>'+
        '<div class="wmeta">实名认证 · 持证上岗 · 已投保 · 可追溯</div></div></div>';
      return;
    }
    wrap.innerHTML = workers.map(function(w){
      var certs = (w.certs || []).map(function(c){ return '<span>'+(CERT_LABELS[c] || c)+'</span>'; }).join('');
      return '<div class="wk" data-wid="'+w.id+'">'+
        '<div class="avatar">'+(w.avatar || '👤')+'<span class="lvl">'+esc(w.level || 'L3')+'</span></div>'+
        '<div class="wb">'+
          '<div class="wn">'+esc(w.name)+(w.is_whitelisted ? '<span class="wl">行业认证</span>' : '')+'</div>'+
          '<div class="wmeta">★ '+Number(w.rating||0).toFixed(1)+' · 信用 <b>'+(w.credit_score||0)+'</b> · '+
            (w.years_experience||0)+'年 · 完成 '+num(w.completed_orders)+' 单</div>'+
          '<div class="wcerts">'+certs+'</div>'+
        '</div>'+
        '<span class="pick">指定 TA</span></div>';
    }).join('');
    wrap.querySelectorAll('.wk[data-wid]').forEach(function(el){
      el.addEventListener('click', function(){
        selectedWorker = (selectedWorker === el.dataset.wid) ? '' : el.dataset.wid;
        wrap.querySelectorAll('.wk').forEach(function(x){
          var on = x.dataset.wid === selectedWorker;
          x.classList.toggle('sel', on);
          var pk = x.querySelector('.pick'); if (pk) pk.textContent = on ? '✓ 已指定' : '指定 TA';
        });
      });
    });
  }

  // 真实评价（含商家回复）
  function renderReviews(){
    var blk = document.getElementById('reviewBlock');
    if (!reviews.length){ blk.hidden = true; return; }
    blk.hidden = false;
    document.getElementById('rCount').textContent = (vendor && vendor.review_count) ? num(vendor.review_count) + ' 条' : reviews.length + ' 条';
    document.getElementById('reviews').innerHTML = reviews.map(function(r){
      var tags = (r.tags || []).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
      return '<div class="rv">'+
        '<div class="rh"><span class="ru">'+esc(r.name || '匿名用户')+'</span><span class="rs">'+stars(r.score)+'</span></div>'+
        (tags ? '<div class="rtags">'+tags+'</div>' : '')+
        '<div class="rtext">'+esc(r.text)+'</div>'+
        (r.reply ? '<div class="rreply">'+esc(r.reply)+'</div>' : '')+
      '</div>';
    }).join('');
  }

  document.title = '家政详情 · ' + JZ.regionCity();
  // 选择上门时间暂时隐藏
  // renderTimeSlots();
  // loadSlots();

  document.getElementById('submitBtn').addEventListener('click', function(e){
    e.preventDefault();
    if (!item) return;
    // 显示 loading
    var overlay = document.getElementById('loadingOverlay');
    overlay.classList.add('on');

    // 调用后端生成微信小程序 URL Link
    // C 端预约：wechat-link 匿名可调，勿依赖 localStorage API Key
    fetch('/api/juzhu/jiazheng/wechat-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_id: product.id, user_id: JZ.userId() })
    }).then(function(r){ return r.json(); })
      .then(function(res){
        overlay.classList.remove('on');
        if (!res.ok) return toast(res.error || '生成预约链接失败');
        // 跳转第三方小程序
        window.location.href = res.url_link;
      }).catch(function(err){
        overlay.classList.remove('on');
        toast('网络异常：' + (err.message || '请稍后重试'));
      });
  });

  JZ.sku(slug, curVendor).then(function(res){
    item = res.item;
    related = res.related || [];
    product = res.product || null;
    products = res.products || [];
    vendor = res.vendor || null;
    vendors = res.vendors || [];
    merchantIntro = res.merchant_intro || null;
    workers = res.workers || [];
    reviews = res.reviews || [];
    // 该城市无上架商品（双维度过滤后 product 为空）：整页空态，不渲染 SKU 静态信息
    if (!product) {
      document.querySelector('.scr').innerHTML = '<div class="empty" style="padding:72px 24px;text-align:center;color:var(--muted);">当前城市暂无该服务，请切换城市或稍后再来</div>';
      return;
    }
    render();
    renderVendors();
    renderProducts();
    // 选择上门时间暂时隐藏
    // if (timeMode !== 'real') renderTimeSlots();
  }).catch(function(err){
    document.querySelector('.scr').innerHTML = '<div class="empty" style="padding:72px 24px;text-align:center;color:var(--muted);">家政详情加载失败：' + JZ.esc(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
