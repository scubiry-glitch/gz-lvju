<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>家政详情</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scr{padding-bottom:110px;}
  .hero{position:relative;padding:74px 16px 18px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#0b5d56,#11453f 48%,#c58d36);}
  .hero.repair{background:linear-gradient(135deg,#1d4ed8,#16356a 48%,#8bb8ff);}
  .hero.moving{background:linear-gradient(135deg,#f97316,#bf4b13 48%,#f7b267);}
  .hero.nanny{background:linear-gradient(135deg,#7c3aed,#4d2579 48%,#d6bcfa);}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(255,255,255,.18),transparent 18%),
    repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px);}
  .hero .in{position:relative;z-index:2;}
  .eyebrow{font-size:10px;letter-spacing:.22em;opacity:.88;}
  .hero h1{font-family:var(--serif);font-size:29px;line-height:1.18;margin-top:8px;}
  .hero p{font-size:12px;opacity:.94;margin-top:8px;max-width:29ch;line-height:1.55;}
  .metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .metrics span{font-size:10px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);}
  .price-card{background:#fff;margin:-18px 12px 0;padding:16px;border-radius:18px;position:relative;z-index:5;
    box-shadow:0 12px 30px rgba(15,42,38,.08);}
  .price-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .price-row .left b{font-family:var(--serif);font-size:34px;color:#ef5a2a;line-height:1;}
  .price-row .left small{font-size:12px;color:var(--muted);}
  .price-row .right{font-size:11px;color:var(--muted);text-align:right;}
  .coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;
    background:linear-gradient(90deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;}
  .coupon b{color:#ea580c;font-size:14px;}
  .coupon span{font-size:11px;color:#9a3412;}
  .block{background:#fff;margin:10px 12px 0;padding:16px;border-radius:16px;box-shadow:0 6px 18px rgba(15,42,38,.05);}
  .block h3{font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:8px;}
  .block h3::before{content:"";width:3px;height:16px;border-radius:3px;background:linear-gradient(var(--brand),var(--gold));}
  .spec{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.7;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip-row span{font-size:11px;padding:5px 10px;border-radius:999px;background:#eef6f4;color:var(--brand-deep);}
  .list{display:grid;gap:10px;margin-top:12px;}
  .item{display:flex;gap:10px;align-items:flex-start;}
  .item .dot{width:22px;height:22px;border-radius:50%;background:#eef6f4;color:var(--brand);display:grid;place-items:center;font-size:12px;flex-shrink:0;}
  .item b{display:block;font-size:13px;color:var(--ink);}
  .item p{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.55;}
  .worker-card{display:flex;gap:12px;align-items:center;margin-top:12px;padding:14px;border-radius:16px;
    background:linear-gradient(135deg,#f9fcfb,#eef6f4);border:1px solid #e5efeb;}
  .worker-card .avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;}
  .worker-card .nm{font-size:15px;font-weight:700;color:var(--ink);}
  .worker-card .meta{font-size:11px;color:var(--muted);margin-top:4px;}
  .worker-card .cta{margin-left:auto;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:12px;color:var(--brand);font-weight:700;}
  .form{display:grid;gap:10px;margin-top:12px;}
  .field{display:block;padding:0;border:0;background:transparent;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px 14px;background:#f8fbfa;font:inherit;color:var(--ink);}
  .field textarea{min-height:92px;resize:vertical;}
  .dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .related{display:grid;gap:10px;margin-top:12px;}
  .r-card{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:#f8fbfa;border:1px solid var(--border);}
  .r-card b{font-size:14px;color:var(--ink);}
  .r-card p{margin:3px 0 0;font-size:11px;color:var(--muted);}
  .r-card span{font-family:var(--serif);font-size:20px;color:var(--gold-deep);white-space:nowrap;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(16,23,28,.92);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;z-index:80;display:none;}
  .toast.on{display:block;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar ghost" style="position:absolute;z-index:20;">
      <a class="bk" href="javascript:history.back()">‹</a>
      <div class="ttl" id="ttl">家政详情<small>服务介绍与预约</small></div>
      <div class="act"><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="price-card">
      <div class="price-row">
        <div class="left"><b id="price">¥0</b> <small id="priceUnit">起</small></div>
        <div class="right" id="sales">最近好评 1000+</div>
      </div>
      <div class="coupon"><b>神券已减 10</b><span>支付成功后进入工单池，待派单状态统一进入家政订单 API</span></div>
    </div>

    <div class="block">
      <h3>服务说明</h3>
      <div class="spec" id="spec"></div>
      <div class="chip-row" id="tags"></div>
      <div class="list" id="includes"></div>
    </div>

    <div class="block">
      <h3>服务者标准</h3>
      <div class="worker-card">
        <div class="avatar" id="workerAvatar">L3</div>
        <div>
          <div class="nm" id="workerName">住建白名单服务者</div>
          <div class="meta" id="workerMeta">实名认证 · 持证上岗 · 已投保 · 可追溯</div>
        </div>
        <a class="cta" href="screens/s-cert.html">查看证书</a>
      </div>
      <div class="list" id="flow"></div>
    </div>

    <div class="block">
      <h3>预约信息</h3>
      <div class="form">
        <div class="field">
          <label>服务地址</label>
          <input id="house" placeholder="例：东博人才公寓 2-1503" />
        </div>
        <div class="dual">
          <div class="field">
            <label>联系电话</label>
            <input id="phone" placeholder="13800138000" />
          </div>
          <div class="field">
            <label>上门时间</label>
            <input id="expectTime" placeholder="2026-07-10 14:00" />
          </div>
        </div>
        <div class="field">
          <label>备注</label>
          <textarea id="desc" placeholder="补充房型面积、故障现象或照护需求"></textarea>
        </div>
      </div>
    </div>

    <div class="block">
      <h3>更多推荐</h3>
      <div class="related" id="related"></div>
    </div>
  </div>

  <div class="cta">
    <div class="p"><b id="ctaPrice">¥0</b><span>提交后跳转收银台完成支付</span></div>
    <div class="heart">⚑</div>
    <a class="btn btn-call" href="screens/p-service-demand.html">看中台工单池</a>
    <a class="btn" href="#" id="submitBtn">立即预约</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="screens/_region.js"></script>
<script src="screens/_jzapi.js"></script>
<script>
(function(){
  var JZ = window.BZF_JZ;
  var q = new URLSearchParams(location.search);
  var slug = q.get('sku') || 'deep-clean-4h';
  var item = null;
  var related = [];

  function fmtPrice(n){ return '¥' + Number(n || 0).toLocaleString(); }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._timer);
    el._timer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }

  function heroClass(cat){
    return cat === 'repair' ? 'repair' : cat === 'moving' ? 'moving' : cat === 'nanny' ? 'nanny' : 'cleaning';
  }

  function render(){
    document.getElementById('ttl').firstChild.textContent = item.name;
    var hero = document.getElementById('hero');
    hero.className = 'hero ' + heroClass(item.category_id);
    hero.innerHTML = '<div class="in">'+
      '<div class="eyebrow">'+(item.category_name || '家政服务').toUpperCase()+'</div>'+
      '<h1>'+item.name+'</h1>'+
      '<p>'+(item.spec || '')+'。住建白名单持证服务者上门，支付后进入中台工单池统一派单。</p>'+
      '<div class="metrics"><span>'+(item.worker_min_level || 'L2')+'+ 持证服务者</span><span>'+(item.duration_min || 0)+' 分钟</span><span>'+(item.rating_score ? ('★ ' + Number(item.rating_score).toFixed(1)) : '高评分')+'</span></div>'+
    '</div>';
    document.getElementById('price').textContent = fmtPrice(item.price_from);
    document.getElementById('ctaPrice').textContent = fmtPrice(item.price_from);
    document.getElementById('priceUnit').textContent = item.price_unit || '起';
    document.getElementById('sales').textContent = item.sales_text || '最近好评稳定';
    document.getElementById('spec').textContent = item.spec || '';
    document.getElementById('tags').innerHTML = (item.tags || []).concat(item.badges || []).map(function(x){
      return '<span>' + x + '</span>';
    }).join('');
    document.getElementById('includes').innerHTML = (item.includes || []).map(function(x, i){
      return '<div class="item"><span class="dot">'+(i+1)+'</span><div><b>'+x+'</b><p>按标准工序执行，完工可回传记录。</p></div></div>';
    }).join('');
    document.getElementById('workerAvatar').textContent = item.worker_min_level || 'L2';
    document.getElementById('flow').innerHTML = (item.service_flow || []).map(function(x, i){
      return '<div class="item"><span class="dot">'+(i+1)+'</span><div><b>'+x+'</b><p>'+(item.service_notice && item.service_notice[i] ? item.service_notice[i] : '符合中台认证与工单流转要求')+'</p></div></div>';
    }).join('');
    document.getElementById('related').innerHTML = related.map(function(x){
      return '<a class="r-card" href="?sku='+encodeURIComponent(x.slug)+'"><div><b>'+x.name+'</b><p>'+(x.spec||'')+'</p></div><span>'+fmtPrice(x.price_from)+'</span></a>';
    }).join('');
  }

  function ensureKey(){
    if (!JZ.apiKey()) JZ.setApiKey('dev-juzhu-key');
    return JZ.apiKey();
  }

  document.title = '家政详情 · ' + JZ.regionCity();

  document.getElementById('submitBtn').addEventListener('click', function(e){
    e.preventDefault();
    if (!item) return;
    if (!ensureKey()) return toast('未提供 API Key');
    var house = document.getElementById('house').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var expectTime = document.getElementById('expectTime').value.trim();
    if (!house || !phone || !expectTime) return toast('请先填写地址、电话和时间');

    JZ.create({
      sku_id: item.id,
      category: item.category_id,
      house: house,
      phone: phone,
      expectTime: expectTime,
      desc: document.getElementById('desc').value.trim(),
      source: '新居住频道'
    }).then(function(o){
      toast('订单已创建');
      setTimeout(function(){
        location.href = 'lvju-app-pay.html?order=' + encodeURIComponent(o.id) + '&channel=jiazheng';
      }, 500);
    }).catch(function(err){
      toast('提交失败：' + err.message);
    });
  });

  JZ.sku(slug).then(function(res){
    item = res.item;
    related = res.related || [];
    render();
  }).catch(function(err){
    document.querySelector('.scr').innerHTML = '<div class="empty" style="padding:72px 24px;text-align:center;color:var(--muted);">家政详情加载失败：' + JZ.esc(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
