<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>户型详情</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scr{padding-bottom:88px;}
  .appbar.abs{position:absolute;top:0;left:0;right:0;z-index:20;background:transparent;border:0;}
  .appbar.abs .ttl,.appbar.abs .bk,.appbar.abs .act span{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .gal-hero{position:relative;background:#0c4d44;color:#fff;}
  .gal-hero .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(56vh,420px);}
  .gal-hero .track::-webkit-scrollbar{display:none;}
  .gal-hero .slide{flex:0 0 100%;scroll-snap-align:start;background-size:cover;background-position:center;height:min(56vh,420px);position:relative;}
  .gal-hero .slide::after{content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(8,18,16,.72) 0%,rgba(8,18,16,.08) 45%,rgba(8,18,16,.18) 100%);}
  .gal-overlay{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 16px 14px;pointer-events:none;}
  .gal-badge .chip{display:inline-block;font-size:10px;font-weight:700;color:#ffd98a;
    background:rgba(255,217,138,.18);border:1px solid rgba(255,217,138,.35);padding:3px 10px;border-radius:999px;}
  .gal-badge h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:8px 0 0;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.35);}
  .gal-badge .sub{font-size:12px;opacity:.92;margin-top:4px;}
  .gal-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .gal-ctrl .dots{display:flex;gap:5px;}
  .gal-ctrl .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);}
  .gal-ctrl .dots i.on{background:#fff;width:16px;border-radius:3px;}
  .gal-ctrl .cnt{font-size:11px;background:rgba(8,18,16,.45);padding:3px 10px;border-radius:999px;}
  .gal-thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;}
  .gal-thumbs::-webkit-scrollbar{display:none;}
  .gal-thumbs button{flex:0 0 auto;width:56px;height:56px;border-radius:10px;border:2px solid transparent;
    padding:0;overflow:hidden;background:#e8ece9;cursor:pointer;}
  .gal-thumbs button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
  .gal-thumbs button img{width:100%;height:100%;object-fit:cover;display:block;}
  .gal-sheet{padding:14px 16px 8px;}
  .gal-sheet .sheet-h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px;}
  .gal-sheet .sheet-h span{font-family:var(--font);font-size:11px;font-weight:500;color:var(--muted);margin-left:6px;}
  .gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .gal-grid .cell{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#0c4d44;
    border:0;padding:0;cursor:pointer;display:block;width:100%;}
  .gal-grid .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .gal-grid .cell.on{outline:2px solid var(--brand);outline-offset:2px;}
  .gal-grid .cell.wide{grid-column:span 2;aspect-ratio:16/9;}
  /* 好房子评级 */
  .rating-wrap{padding:0 0 8px;}
  .block{background:#fff;margin:8px 0 0;padding:15px 18px;}
  .block .bt{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);}
  .block .bs{font-size:11px;color:var(--muted);margin-top:2px;}
  .rating-sum{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
    padding:14px;margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:12px;}
  .stars-side{text-align:center;min-width:88px;}
  .stars-side .ek{font-size:10px;color:var(--muted);letter-spacing:.08em;}
  .stars-side .stars{font-size:18px;color:#eab308;letter-spacing:1px;line-height:1.2;margin:4px 0;}
  .stars-side .stars .dim{color:var(--border);}
  .stars-side .lbl{font-size:11px;color:var(--muted);}
  .stars-side .sc{font-size:11px;color:var(--muted);margin-top:4px;}
  .stars-side .sc b{font-size:14px;color:var(--ink);}
  .hdim{display:grid;grid-template-columns:52px 1fr 32px;gap:6px;align-items:center;font-size:11px;margin-bottom:5px;}
  .hdim:last-child{margin-bottom:0;}
  .hdim .k{color:var(--muted);white-space:nowrap;}
  .hdim .bar{height:6px;background:#eef2f1;border-radius:3px;overflow:hidden;}
  .hdim .bar i{display:block;height:100%;border-radius:3px;}
  .hdim .v{font-weight:700;text-align:right;}
  .verify{margin-top:12px;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:12px;
    padding:11px 13px;display:flex;align-items:center;gap:11px;}
  .verify .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--gold-deep);}
  .verify .vb{font-size:10.5px;color:var(--ink);margin-top:3px;}
  .verify .vb b{color:var(--brand);}
  .verify .vb a{color:var(--brand);}
  .verify a.qrlink{flex-shrink:0;line-height:0;}
  .verify .qrimg{width:48px;height:48px;border-radius:8px;border:3px solid #fff;outline:1px solid var(--border);display:block;background:#fff;}
</style>
</head>
<body>
<div class="app">
  <div class="scr" id="scr">
    <div class="appbar abs">
      <a class="bk" href="javascript:history.back()">‹</a>
      <div class="ttl" id="ttl">户型详情</div>
      <div class="act"><span>♡</span><span>⤴</span></div>
    </div>

    <div class="gal-hero">
      <div class="track" id="track"></div>
      <div class="gal-overlay">
        <div class="gal-badge">
          <span class="chip" id="typeChip">—</span>
          <h1 id="heroTitle">—</h1>
          <div class="sub" id="heroSub"></div>
        </div>
        <div class="gal-ctrl">
          <div class="dots" id="dots"></div>
          <div class="cnt" id="cnt">1/1</div>
        </div>
      </div>
    </div>

    <div class="gal-thumbs" id="thumbs" hidden></div>

    <div class="gal-sheet" id="galSheet" hidden>
      <div class="sheet-h">全部图片<span id="photoN"></span></div>
      <div class="gal-grid" id="grid"></div>
    </div>

    <div class="rating-wrap" id="ratingBlock" hidden></div>
  </div>

  <div class="cta">
    <div class="p"><b id="price">—</b><span id="plab">参考价格</span></div>
    <div class="heart">♡</div>
    <a class="btn" href="#" id="ctaBtn">预约看房</a>
  </div>
</div>
<script src="juzhu/app.js?v=5"></script>
<script src="screens/_qr.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var pslug = q.get('project');
  var uslug = q.get('unit');
  var channel = q.get('channel') || 'bzf';
  var isTrade = channel === 'trade';
  var cur = 0;
  var photos = [];

  function setIndex(idx) {
    cur = idx;
    var track = document.getElementById('track');
    track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
    document.getElementById('cnt').textContent = (idx + 1) + '/' + photos.length;
    document.querySelectorAll('#dots i').forEach(function(d, i){ d.classList.toggle('on', i === idx); });
    document.querySelectorAll('#thumbs button').forEach(function(b, i){ b.classList.toggle('on', i === idx); });
    document.querySelectorAll('#grid .cell').forEach(function(c, i){ c.classList.toggle('on', i === idx); });
  }

  function mountGallery() {
    document.getElementById('track').innerHTML = photos.map(function(src){
      return '<div class="slide" style="background-image:url(' + src + ')"></div>';
    }).join('') || '<div class="slide g3"></div>';

    document.getElementById('dots').innerHTML = photos.map(function(_, i){
      return '<i class="' + (i === 0 ? 'on' : '') + '"></i>';
    }).join('');
    document.getElementById('cnt').textContent = '1/' + Math.max(photos.length, 1);

    if (photos.length <= 1) return;

    document.getElementById('thumbs').hidden = false;
    document.getElementById('thumbs').innerHTML = photos.map(function(src, i){
      return '<button type="button" class="' + (i === 0 ? 'on' : '') + '" data-i="' + i + '">' +
        '<img src="' + src + '" alt=""/>' +
      '</button>';
    }).join('');
    document.getElementById('thumbs').onclick = function(e){
      var btn = e.target.closest('button[data-i]');
      if (!btn) return;
      setIndex(parseInt(btn.dataset.i, 10));
    };

    document.getElementById('galSheet').hidden = false;
    document.getElementById('photoN').textContent = photos.length + ' 张';
    document.getElementById('grid').innerHTML = photos.map(function(src, i){
      var wide = i === 0 && photos.length >= 3 ? ' wide' : '';
      return '<button type="button" class="cell' + wide + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' +
        '<img src="' + src + '" alt=""/>' +
      '</button>';
    }).join('');
    document.getElementById('grid').onclick = function(e){
      var cell = e.target.closest('.cell[data-i]');
      if (!cell) return;
      setIndex(parseInt(cell.dataset.i, 10));
    };
  }

  function mountRating(p) {
    var hr = JUZHU.houseRating(p);
    document.getElementById('typeChip').textContent = '★ ' + hr.stars + '星 · 好房子';
    document.getElementById('ratingBlock').hidden = false;
    document.getElementById('ratingBlock').innerHTML = JUZHU.houseRatingHtml(p);
    document.querySelectorAll('#ratingBlock a.qrlink').forEach(function(a) {
      var img = a.querySelector('img.qrimg');
      if (!img) return;
      var target;
      try { target = new URL(a.getAttribute('href'), location.href).href; } catch (e) { return; }
      try {
        var qr = qrcode(0, 'M');
        qr.addData(target);
        qr.make();
        img.src = qr.createDataURL(3, 0);
      } catch (e) {
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=' + encodeURIComponent(target);
      }
    });
  }

  JUZHU.load().then(function(){
    var p = JUZHU.projectBySlug(pslug);
    if (!p) return;
    var u = JUZHU.unitBySlug(p.id, uslug);
    if (!u) return;

    var title = JUZHU.unitTitle(u);
    document.title = title + ' · ' + p.name;
    document.getElementById('heroTitle').textContent = title;
    document.getElementById('heroSub').textContent = p.name + (p.address ? ' · ' + p.address : '');
    document.getElementById('typeChip').textContent = isTrade ? '卖旧买新' : '保租房';
    document.getElementById('ttl').innerHTML = title + '<small>' + p.name + '</small>';

    if (isTrade) {
      document.getElementById('price').innerHTML = u.price_total + '<small> 万起</small>';
      document.getElementById('plab').textContent = '参考总价 · ' + (p.old_house_hint || '以旧换新');
      document.getElementById('ctaBtn').textContent = '咨询置换';
    } else {
      document.getElementById('price').innerHTML = JUZHU.fmtRent(u.rent_monthly) + '<small>/月</small>';
      document.getElementById('plab').textContent = '租金受控 · 试点房源';
      document.getElementById('ctaBtn').textContent = '预约看房';
      mountRating(p);
    }

    photos = JUZHU.photos('unit', u.id).map(function(ph){ return ph.file_path; });
    if (!photos.length && u.cover_image) photos = [u.cover_image];
    mountGallery();

    var track = document.getElementById('track');
    track.addEventListener('scroll', function(){
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      if (idx !== cur) {
        cur = idx;
        document.getElementById('cnt').textContent = (idx + 1) + '/' + photos.length;
        document.querySelectorAll('#dots i').forEach(function(d, i){ d.classList.toggle('on', i === idx); });
        document.querySelectorAll('#thumbs button').forEach(function(b, i){ b.classList.toggle('on', i === idx); });
        document.querySelectorAll('#grid .cell').forEach(function(c, i){ c.classList.toggle('on', i === idx); });
      }
    });
  });
})();
</script>
</body>
</html>
