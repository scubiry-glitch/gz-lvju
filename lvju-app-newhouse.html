<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar ghost">
      <a class="bk" href="lvju-app-home-demo.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">新房<small>楼盘 · 特价房</small></div>
      <div class="act"><a href="lvju-app-map.html">🗺</a><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg s-city"></div>
      <div class="in">
        <div class="ek">New Homes</div>
        <h1>在贵州<br>安一个家</h1>
        <p>在售楼盘、特价房专区，看房团 + 贷款测算一站搞定</p>
        <div class="stat">
          <div><b>320</b><span>在售楼盘</span></div>
          <div><b>9</b><span>市州覆盖</span></div>
          <div><b>特价</b><span>专区直降</span></div>
        </div>
      </div>
    </div>

    <div class="filt">
      <a class="on">全部</a><a>特价房</a><a>学区</a><a>地铁盘</a><a>旅居康养</a><a>江景山景</a>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>在售楼盘</h2><span class="more" id="sortNote">智能排序</span></div>
    <div class="wrap" id="listingWrap">
      <div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <div class="banner gold">
      <span class="bi">🧮</span>
      <div class="bt"><b>贷款月供怎么算？</b><p>置业导购 · 贷款测算 / 税费计算 / 政策解读</p></div>
      <a class="go" href="lvju-app-guide.html">去测算 ›</a>
    </div>

  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a class="on"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 新房频道（channel=newhouse）数据统一读新居住数据库 catalog，不再硬编码。 */
(function(){
  // 城市提示：URL ?city= > localStorage bzf_jz_city（首页切换器写入）> 默认贵阳
  var CITY = new URLSearchParams(location.search).get('city') || (function(){ try { return localStorage.getItem('bzf_jz_city') || ''; } catch(e){ return ''; } })() || 'guiyang';
  var API = '/api/juzhu/catalog?city=' + encodeURIComponent(CITY) + '&channel=newhouse';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }

  fetch(API).then(function(r){ return r.json(); }).then(function(cat){
    var wrap = document.getElementById('listingWrap');
    var dmap = {}; (cat.districts || []).forEach(function(d){ dmap[d.id] = d; });
    var projects = (cat.projects || []).filter(function(p){ return p.channel === 'newhouse'; });

    if (!projects.length) {
      wrap.innerHTML = '<div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">该频道暂无在售楼盘 · 开发商/运营商录入并通过审核后自动上架</div>';
      document.getElementById('sortNote').textContent = '0 个在售';
      return;
    }
    document.getElementById('sortNote').textContent = '共 ' + projects.length + ' 个在售';
    wrap.innerHTML = projects.map(function(p){
      var d = dmap[p.district_id];
      var meta = ['贵阳', d ? d.name : '', p.address || ''].filter(Boolean).join(' · ');
      var tags = (p.tags || []).slice(0, 3);
      var th = p.cover_image
        ? '<div class="th" style="background:url(' + esc(p.cover_image) + ') center/cover,#0c4d44;">'
        : '<div class="th s-city">';
      var price = p.price_total != null ? '¥' + fmt(p.price_total) + '<small> 万起</small>'
        : (p.price_from != null ? '¥' + fmt(p.price_from) + '<small> /㎡起</small>' : '价格面议');
      return '<a class="lrow" href="lvju-app-newhouse-detail.html?id=' + p.id + '">' + th +
        '<span class="star">在售</span></div>' +
        '<div class="info"><div class="nm">' + esc(p.name) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div>' +
        '<div class="tags">' + (tags.length ? tags.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') : '<span>在售</span>') + '</div>' +
        '<div class="pr"><b>' + price + '</b>' +
        (p.managed_unit_count != null ? '<span class="unit">房源 ' + fmt(p.managed_unit_count) + '</span>' : '') + '</div></div></a>';
    }).join('');
  }).catch(function(){
    document.getElementById('listingWrap').innerHTML =
      '<div style="text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接新居住数据库 · 请稍后再试</div>';
  });
})();
</script>
</body>
</html>
