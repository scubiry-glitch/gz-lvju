<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>家政订单 · 服务进度</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  .scr{padding-bottom:100px;}
  .hero{margin:0 12px;padding:18px 16px;border-radius:18px;color:#fff;
    background:linear-gradient(135deg,#0b5d56,#11453f 48%,#c58d36);box-shadow:0 12px 28px rgba(15,42,38,.12);}
  .hero h1{font-family:var(--serif);font-size:22px;line-height:1.3;margin:8px 0 0;}
  .hero p{font-size:12px;opacity:.92;margin-top:8px;line-height:1.55;}
  .steps-wrap{margin:14px 12px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(15,42,38,.06);}
  .steps-wrap h3{font-family:var(--serif);font-size:15px;margin:0 0 12px;}
  .track{display:grid;gap:0;}
  .track .row{display:flex;gap:12px;position:relative;padding-bottom:16px;}
  .track .row:last-child{padding-bottom:0;}
  .track .row::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e8eeec;}
  .track .row:last-child::before{display:none;}
  .dot{width:24px;height:24px;border-radius:50%;background:#eef6f4;color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0;z-index:1;}
  .row.on .dot{background:linear-gradient(var(--brand),var(--brand-2));color:#fff;}
  .row.done .dot{background:var(--brand);color:#fff;}
  .row .txt b{display:block;font-size:13px;color:var(--ink);}
  .row .txt span{font-size:11px;color:var(--muted);}
  .block{background:#fff;margin:10px 12px 0;padding:16px;border-radius:16px;box-shadow:0 6px 18px rgba(15,42,38,.05);}
  .block h3{font-family:var(--serif);font-size:15px;margin:0 0 10px;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f0f3f1;font-size:13px;}
  .kv:last-child{border-bottom:0;}
  .kv .k{color:var(--muted);}
  .worker{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#f8fbfa;border:1px solid var(--border);margin-top:8px;}
  .worker .av{width:48px;height:48px;border-radius:14px;background:linear-gradient(var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:700;}
  .rate-box{display:grid;gap:10px;margin-top:10px;}
  .stars{font-size:28px;color:#ddd;letter-spacing:4px;cursor:pointer;}
  .stars span.on{color:var(--gold);}
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tags span{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--muted);}
  .tags span.on{background:var(--brand-soft);color:var(--brand-deep);border-color:transparent;font-weight:600;}
  .empty{padding:72px 24px;text-align:center;color:var(--muted);}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .links a{display:block;padding:10px 12px;border-radius:12px;background:#f8fbfa;border:1px solid var(--border);font-size:12px;color:var(--brand);font-weight:600;text-align:center;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(16,23,28,.92);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;z-index:80;display:none;}
  .toast.on{display:block;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">
    <div class="appbar">
      <a class="bk" href="juzhu-channel-v3-grid.html">‹</a>
      <div class="ttl">服务进度<small id="subTtl">家政订单</small></div>
    </div>
    <div id="main"><div class="empty">加载中…</div></div>
  </div>
  <div class="cta" id="ctaBar" style="display:none;">
    <div class="p"><b id="ctaFee">¥0</b><span id="ctaHint">支付后进入工单池</span></div>
    <a class="btn" href="#" id="ctaBtn">去支付</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="screens/_region.js"></script>
<script src="screens/_jzapi.js"></script>
<script>
(function(){
  var JZ = window.BZF_JZ;
  var q = new URLSearchParams(location.search);
  var oid = q.get('order');
  var order = null;
  var rateScore = 5;

  document.title = '家政进度 · ' + JZ.regionCity();

  var STEPS = [
    { k: 'pending', label: '待派单', sub: '支付成功后进入中台工单池' },
    { k: 'dispatched', label: '已派单', sub: '平台已分配持证服务者' },
    { k: 'accepted', label: '已接单', sub: '服务者确认接单' },
    { k: 'serving', label: '服务中', sub: '服务者上门作业' },
    { k: 'done', label: '待评价', sub: '服务完成，等待您的评价' },
    { k: 'rated', label: '已评价', sub: '评价已回流信用引擎' }
  ];

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }

  function fmtPrice(n){ return '¥' + Number(n||0).toLocaleString(); }

  function stepRows(status){
    var idx = STEPS.findIndex(function(s){ return s.k === status; });
    if (status === 'rated') idx = STEPS.length - 1;
    return STEPS.map(function(s, i){
      var cls = 'row';
      if (i < idx) cls += ' done';
      else if (i === idx) cls += ' on';
      return '<div class="'+cls+'"><div class="dot">'+(i<idx?'✓':(i+1))+'</div><div class="txt"><b>'+s.label+'</b><span>'+s.sub+'</span></div></div>';
    }).join('');
  }

  function renderRate(){
    return '<div class="block"><h3>服务评价</h3><div class="rate-box">'+
      '<div class="stars" id="stars">'+[1,2,3,4,5].map(function(n){
        return '<span data-v="'+n+'" class="'+(n<=rateScore?'on':'')+'">★</span>';
      }).join('')+'</div>'+
      '<div class="tags" id="rateTags">'+
        ['准时','专业','细致','态度好','干净整洁'].map(function(t){
          return '<span data-t="'+t+'">'+t+'</span>';
        }).join('')+
      '</div>'+
      '<textarea id="rateText" rows="3" placeholder="说说服务体验（选填）" style="width:100%;border:1px solid var(--border);border-radius:14px;padding:12px;font:inherit;"></textarea>'+
      '<a class="btn" href="#" id="submitRate" style="display:block;text-align:center;padding:14px;border-radius:14px;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;">提交评价</a>'+
    '</div></div>';
  }

  function render(){
    if (!order) return;
    var st = JZ.STATUS[order.status] || JZ.STATUS.pending;
    document.getElementById('subTtl').textContent = order.id;
    var worker = order.worker;
    var html = '<div class="hero"><div class="eyebrow" style="font-size:10px;letter-spacing:.2em;opacity:.88;">'+JZ.esc(order.type)+' · '+st.c+'</div>'+
      '<h1>'+JZ.esc(order.category)+'</h1>'+
      '<p>'+JZ.esc(order.house)+' · '+JZ.esc(order.expectTime)+'</p></div>'+
      '<div class="steps-wrap"><h3>进度跟踪</h3><div class="track">'+stepRows(order.status)+'</div></div>'+
      '<div class="block"><h3>订单信息</h3>'+
        '<div class="kv"><span class="k">工单号</span><span>'+JZ.esc(order.id)+'</span></div>'+
        '<div class="kv"><span class="k">费用</span><span>'+fmtPrice(order.fee)+'</span></div>'+
        '<div class="kv"><span class="k">支付</span><span>'+(order.pay_status==='paid'?'已支付 · '+JZ.esc(order.pay_method||'贝壳支付'):'待支付')+'</span></div>'+
        '<div class="kv"><span class="k">来源</span><span>'+JZ.esc(order.source)+'</span></div>'+
      '</div>';
    if (worker) {
      html += '<div class="block"><h3>服务者</h3><div class="worker"><div class="av">'+JZ.esc((worker.name||'师').slice(0,1))+'</div><div><b>'+JZ.esc(worker.name)+'</b><div style="font-size:11px;color:var(--muted);">'+JZ.esc(worker.level)+' · '+JZ.regionDeptStem()+'白名单 · <a href="screens/s-cert.html" style="color:var(--brand);">查看证书</a></div></div></div></div>';
    }
    if (order.status === 'done') html += renderRate();
    if (order.status === 'rated' && order.rating) {
      html += '<div class="block"><h3>您的评价</h3><div style="font-size:14px;color:var(--gold);">★ '+order.rating.score+'</div><p style="font-size:12px;color:var(--muted);margin-top:6px;">'+(order.rating.tags||[]).join(' · ')+'</p></div>';
    }
    html += '<div class="block"><h3>中台联动</h3><p style="font-size:11px;color:var(--muted);margin:0 0 8px;">支付后可在 P/B/S 端继续推进本工单</p><div class="links">'+
      '<a href="screens/p-service-demand.html">P · 工单池派单</a>'+
      '<a href="screens/b-dispatch-board.html">B · 派单看板</a>'+
      '<a href="screens/s-orders.html">S · 服务者接单</a>'+
      '<a href="screens/p-service-review.html">P · 评价回流</a></div></div>';
    document.getElementById('main').innerHTML = html;

    var cta = document.getElementById('ctaBar');
    if (order.pay_status !== 'paid') {
      cta.style.display = 'flex';
      document.getElementById('ctaFee').textContent = fmtPrice(order.fee);
      document.getElementById('ctaHint').textContent = '完成支付后进入工单池';
      document.getElementById('ctaBtn').textContent = '去支付';
      document.getElementById('ctaBtn').href = 'lvju-app-pay.html?order='+encodeURIComponent(order.id)+'&channel=jiazheng';
    } else if (order.status === 'done') {
      cta.style.display = 'none';
      bindRate();
    } else {
      cta.style.display = 'none';
    }
  }

  function bindRate(){
    document.querySelectorAll('#stars span').forEach(function(s){
      s.addEventListener('click', function(){
        rateScore = Number(s.dataset.v);
        document.querySelectorAll('#stars span').forEach(function(x){
          x.classList.toggle('on', Number(x.dataset.v) <= rateScore);
        });
      });
    });
    document.querySelectorAll('#rateTags span').forEach(function(t){
      t.addEventListener('click', function(){ t.classList.toggle('on'); });
    });
    document.getElementById('submitRate').addEventListener('click', function(e){
      e.preventDefault();
      var tags = Array.from(document.querySelectorAll('#rateTags span.on')).map(function(x){ return x.dataset.t; });
      JZ.rate(order.id, { score: rateScore, tags: tags, text: document.getElementById('rateText').value.trim() })
        .then(function(o){ order = o; toast('评价已提交'); render(); })
        .catch(function(err){ toast(err.message); });
    });
  }

  if (!oid) {
    document.getElementById('main').innerHTML = '<div class="empty">缺少订单号</div>';
    return;
  }

  function load(){
    JZ.get(oid).then(function(o){ order = o; render(); })
      .catch(function(err){
        document.getElementById('main').innerHTML = '<div class="empty">加载失败：'+JZ.esc(err.message)+'</div>';
      });
  }
  JZ.onChange(load);
  load();
})();
</script>
</body>
</html>
