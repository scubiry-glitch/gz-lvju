<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:,">
<title>长租 · 整租·合租·月付 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar ghost">
      <a class="bk" href="lvju-app-home-demo.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl">长租<small>整租 · 合租 · 月付</small></div>
      <div class="act"><a href="lvju-app-map.html">🗺</a><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg s-city"></div>
      <div class="in">
        <div class="ek">Long-term</div>
        <h1>长住贵州<br>慢享山居</h1>
        <p>整租、合租、月付，线上签约 + 资金存管，省心长住</p>
        <div class="stat">
          <div><b>6,200+</b><span>长租房源</span></div>
          <div><b>月付起</b><span>灵活租期</span></div>
          <div><b>存管</b><span>签约保障</span></div>
        </div>
      </div>
    </div>

    <div class="filt">
      <a class="on">全部</a><a>整租</a><a>合租</a><a>月付</a><a>拎包入住</a><a>近地铁</a>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>在租房源</h2><span class="more" id="sortNote">租金排序</span></div>
    <div class="wrap" id="listingWrap">
      <div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <div class="banner gold">
      <span class="bi">🧭</span>
      <div class="bt"><b>想长住，也想置业？</b><p>置业导购：看房团 · 贷款测算 · 1对1顾问</p></div>
      <a class="go" href="lvju-app-guide.html">去导购 ›</a>
    </div>

  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a class="on"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 长租与旅居同为 rental 频道（监管口径一致），本页为户型级月租视图。数据统一读 catalog。 */
(function(){
  // 城市提示：URL ?city= > localStorage bzf_jz_city（首页切换器写入）> 默认贵阳
  var CITY = new URLSearchParams(location.search).get('city') || (function(){ try { return localStorage.getItem('bzf_jz_city') || ''; } catch(e){ return ''; } })() || 'guiyang';
  var API = '/api/juzhu/catalog?city=' + encodeURIComponent(CITY) + '&channel=rental';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }

  fetch(API).then(function(r){ return r.json(); }).then(function(cat){
    var wrap = document.getElementById('listingWrap');
    var dmap = {}; (cat.districts || []).forEach(function(d){ dmap[d.id] = d; });
    var pmap = {}; (cat.projects || []).forEach(function(p){ pmap[p.id] = p; });
    var rows = (cat.units || []).filter(function(u){
      var p = pmap[u.project_id];
      return p && p.channel === 'rental' && (p.tags || []).indexOf('旅居') < 0;   // 长租视图：排除旅居 tag
    });

    if (!rows.length) {
      wrap.innerHTML = '<div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">该频道暂无在租户型 · 运营商在后台录入后自动上架</div>';
      document.getElementById('sortNote').textContent = '0 套在租';
      return;
    }
    document.getElementById('sortNote').textContent = '共 ' + rows.length + ' 套在租';
    // 标题党式命名：区县 · 亮点tag + 居室（原始户型名如“30 平”不直接当标题）
    var CN = { '1':'一','2':'二','3':'三','4':'四','5':'五' };
    function cnRoom(lb){
      var m = String(lb || '').match(/^(\d)\s*居/);
      return m ? CN[m[1]] + '居' : (lb || '');
    }
    function pickHighlight(tags){
      var words = ['精装','拎包','近地铁','南北通透','家电','电梯','独卫','阳台','新装','温馨'];
      for (var i = 0; i < tags.length; i++) {
        for (var j = 0; j < words.length; j++) {
          if (String(tags[i]).indexOf(words[j]) >= 0) return tags[i];
        }
      }
      return tags[0] || '';
    }
    wrap.innerHTML = rows.map(function(u){
      var p = pmap[u.project_id] || {};
      var d = dmap[p.district_id];
      var meta = ['贵阳', d ? d.name : '', u.area_sqm ? fmt(u.area_sqm) + '㎡' : '', u.layout_label || ''].filter(Boolean).join(' · ');
      var tags = (u.tags || []).slice(0, 3);
      var th = u.cover_image
        ? '<div class="th" style="background:url(' + esc(u.cover_image) + ') center/cover,#0c4d44;">'
        : '<div class="th s-city">';
      // 标题：项目名 · 亮点 + 居室（如 “甲秀楼店 · 精装三居”），原始户型名放 meta
      var hi = pickHighlight(tags), room = cnRoom(u.layout_label);
      var title = p.name + (hi ? ' · ' + hi : '') + (room ? room : '');
      return '<a class="lrow" href="lvju-app-detail.html?id=' + p.id + '">' + th +
        '<span class="star">' + esc(u.layout_label || '在租') + '</span></div>' +
        '<div class="info"><div class="nm">' + esc(title) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div>' +
        '<div class="tags">' + (tags.length ? tags.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') : '<span>在租</span>') + '</div>' +
        '<div class="pr"><b>' + (u.rent_monthly ? '¥' + fmt(u.rent_monthly) + '<small> /月</small>' : '价格面议') + '</b>' +
        (p.bookable ? '<span class="bk">预订</span>' : '<span class="bk tel">📞 咨询</span>') +
        '<span class="unit">门店 · ' + esc(p.name) + '</span></div></div></a>';
    }).join('');
  }).catch(function(){
    document.getElementById('listingWrap').innerHTML =
      '<div style="text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接新居住数据库 · 请稍后再试</div>';
  });
})();
</script>
</body>
</html>
