<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>新居住 · 沈阳 · 贝壳</title>
<link rel="stylesheet" href="lvju-app.css?v=6">
<style>
  #navCitySub.city-tap{cursor:pointer;}
  #navCitySub.city-tap::after{content:" ▾";opacity:.85;font-size:.85em;}
  .city-sheet{position:fixed;inset:0;z-index:80;display:none;}
  .city-sheet.on{display:block;}
  .city-sheet .backdrop{position:absolute;inset:0;background:rgba(15,23,42,.45);}
  .city-sheet .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;
    box-shadow:0 -12px 32px rgba(15,42,38,.18);}
  .city-sheet .ph{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .city-sheet .ph .x{font-size:22px;color:var(--muted);line-height:1;cursor:pointer;}
  .city-sheet .cascade{display:grid;grid-template-columns:88px 1fr;gap:12px;}
  .city-sheet .provs{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto;}
  .city-sheet .provs a{padding:11px 6px;border-radius:10px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;}
  .city-sheet .provs a.on{background:#eef4f2;color:var(--ink);font-weight:700;}
  .city-sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;max-height:46vh;overflow:auto;}
  .city-sheet .grid a{padding:11px 6px;border-radius:12px;background:#f5f7f6;border:1px solid transparent;text-align:center;font-size:13px;color:var(--ink);cursor:pointer;}
  .city-sheet .grid a.allp{grid-column:1 / -1;background:#fff;border:1px dashed #cbd5cf;color:var(--brand);font-weight:600;}
  .city-sheet .grid a.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;border-color:transparent;}
  .scheme-bar{display:none !important;}
  .scheme-bar a{color:var(--brand);font-weight:600;}
  .split-hd{position:relative;padding:52px 18px 20px;color:#fff;overflow:hidden;}
  .split-hd .bg{position:absolute;inset:0;background:linear-gradient(135deg,#0b5d56,#1a4038 50%,#8c6224);}
  .split-hd .bg.has-img{background-size:cover;background-position:center;}
  .split-hd .bg.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(11,93,86,.82),rgba(26,64,56,.75) 50%,rgba(140,98,36,.55));z-index:0;}
  .split-hd .bg::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(85deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px);opacity:.6;}
  .split-hd .in{position:relative;z-index:2;}
  .split-hd .ek{font-size:9px;letter-spacing:.36em;opacity:.9;}
  .split-hd h1{font-family:var(--serif);font-size:24px;margin-top:6px;line-height:1.2;}
  .split-hd .stat{display:flex;gap:18px;margin-top:12px;font-size:10px;opacity:.92;min-height:32px;}
  .split-hd .stat b{font-family:var(--serif);font-size:16px;display:block;}
  .seg-switch{display:flex;margin-top:14px;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;backdrop-filter:blur(8px);}
  .seg-switch a{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:600;border-radius:10px;color:rgba(255,255,255,.75);}
  .seg-switch a.on{background:#fff;color:var(--brand-deep);box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .pane{display:none;}.pane.on{display:block;}
  /* 首屏：catalog 未回前只露头图底，避免 3 个占位 tab + 空选区租房再整页重绘抖动 */
  .app.is-booting .split-hd .in{visibility:hidden;}
  .app.is-booting .pane,
  .app.is-booting .scheme-bar{display:none !important;}
  .app.is-ready .split-hd .in{visibility:visible;}

  /* === 本地服务专区 tab === */
  #pane-jiazheng{padding-bottom:8px;}
  #pane-jiazheng > .sec-h{margin-top:18px;}
  .jz-quick{padding:8px 18px 2px;}
  .jz-cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .jz-cat{position:relative;display:block;border-radius:20px;overflow:hidden;color:#f8f7f4;min-height:96px;
    box-shadow:0 10px 22px rgba(15,42,38,.10);transition:transform .18s ease,box-shadow .18s ease;isolation:isolate;border:1px solid rgba(255,255,255,.06);}
  .jz-cat:active{transform:scale(.988) translateY(1px);}
  .jz-cat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 34%);pointer-events:none;z-index:1;}
  .jz-cat::after{content:"";position:absolute;inset:10px;border-radius:14px;border:1px solid rgba(255,255,255,.08);opacity:.85;pointer-events:none;z-index:1;}
  .jz-cat .bg{position:absolute;inset:0;}
  .jz-cat .bg::before{content:"";position:absolute;right:-10%;top:-14%;width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);opacity:.75;}
  .jz-cat .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.18) 52%,rgba(0,0,0,.26));}
  .jz-cat .in{position:relative;z-index:2;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;}
  .jz-cat .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .jz-cat .pill{display:inline-flex;align-items:center;max-width:72%;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.10);font-size:9px;letter-spacing:.04em;color:rgba(255,255,255,.84);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.08);}
  .jz-cat .arrow{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.9);}
  .jz-cat .hero{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .jz-cat .orb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28),rgba(255,255,255,.06) 58%,rgba(255,255,255,0) 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 4px 8px rgba(0,0,0,.14);flex:0 0 auto;border:1px solid rgba(255,255,255,.06);}
  .jz-cat .title-wrap{min-width:0;}
  .jz-cat h3{font-family:var(--serif);font-size:16px;line-height:1.15;letter-spacing:.2px;color:#fffdf9;}
  .jz-cat .desc,.jz-cat .sub,.jz-cat .stats{display:none;}
  .jz-cat.cleaning .bg{background:linear-gradient(145deg,#214842,#15352f 58%,#0d221f);}
  .jz-cat.repair  .bg{background:linear-gradient(145deg,#2a4260,#1b2f48 58%,#101d31);}
  .jz-cat.moving  .bg{background:linear-gradient(145deg,#6d5544,#4d372a 58%,#2a1d15);}
  .jz-cat.nanny   .bg{background:linear-gradient(145deg,#5e5566,#453c4d 58%,#2a222f);}
  .jz-cat.telecom .bg{background:linear-gradient(145deg,#1d4e89,#123a66 58%,#0b2444);}
  .jz-cat.insurance .bg{background:linear-gradient(145deg,#8c6224,#6b4a1a 58%,#3d2a0e);}
  .jz-cat.consumer_finance .bg{background:linear-gradient(145deg,#0f1a4d,#1a2a6b 58%,#0a1028);}
  .jz-cat.health_care .bg{background:linear-gradient(145deg,#0e7490,#0a5568 58%,#063844);}
  .jz-cat.home_maintain .bg{background:linear-gradient(145deg,#3f6212,#2d4a0c 58%,#1a2c07);}
  .jz-cat.asset .bg{background:linear-gradient(145deg,#1e3a5f,#152a45 58%,#0c1828);}
  .jz-cat.recycle .bg{background:linear-gradient(145deg,#166534,#0f4a26 58%,#0a2e18);}
  .jz-cat.community .bg{background:linear-gradient(145deg,#6d28d9,#4c1d95 58%,#2e1065);}

  /* --- lifeLayout=v1 四列宫格 --- */
  .life-v1 .jz-cat-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .life-v1 .jz-cat{min-height:0;border-radius:14px;box-shadow:0 4px 12px rgba(15,42,38,.06);}
  .life-v1 .jz-cat::after{inset:6px;border-radius:10px;}
  .life-v1 .jz-cat .in{padding:10px 6px;min-height:78px;align-items:center;text-align:center;}
  .life-v1 .jz-cat .top{justify-content:center;}
  .life-v1 .jz-cat .pill{max-width:100%;font-size:8px;padding:2px 6px;}
  .life-v1 .jz-cat .arrow{display:none;}
  .life-v1 .jz-cat .hero{flex-direction:column;margin-top:6px;gap:4px;}
  .life-v1 .jz-cat .orb{width:28px;height:28px;font-size:14px;}
  .life-v1 .jz-cat h3{font-size:11px;}

  /* --- lifeLayout=v2 图文列表 --- */
  .life-v2 .jz-cat-grid{grid-template-columns:1fr;gap:8px;}
  .life-v2 .jz-cat{min-height:0;border-radius:16px;}
  .life-v2 .jz-cat::after{display:none;}
  .life-v2 .jz-cat .in{padding:12px 14px;min-height:0;flex-direction:row;align-items:center;gap:12px;}
  .life-v2 .jz-cat .top{order:2;margin-left:auto;}
  .life-v2 .jz-cat .pill{display:none;}
  .life-v2 .jz-cat .hero{margin-top:0;flex:1;}
  .life-v2 .jz-cat .orb{width:40px;height:40px;font-size:20px;}
  .life-v2 .jz-cat h3{font-size:15px;}
  .life-v2 .jz-cat .desc{display:block !important;font-size:11px;margin-top:2px;-webkit-line-clamp:1;}

  /* --- lifeLayout=v3 等大三列 --- */
  .life-v3 .jz-cat-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:8px;}
  .life-v3 .jz-cat{min-height:0;border-radius:14px;grid-column:auto;}
  .life-v3 .jz-cat::after{inset:6px;border-radius:10px;}
  .life-v3 .jz-cat .in{padding:10px 8px;min-height:76px;justify-content:flex-end;}
  .life-v3 .jz-cat .top{margin-bottom:auto;}
  .life-v3 .jz-cat .pill{font-size:8px;padding:2px 6px;max-width:100%;}
  .life-v3 .jz-cat .arrow{display:none;}
  .life-v3 .jz-cat .hero{margin-top:6px;gap:6px;}
  .life-v3 .jz-cat .orb{width:22px;height:22px;font-size:12px;}
  .life-v3 .jz-cat h3{font-size:13px;}

  /* --- lifeLayout=v4 Bento 拼贴 --- */
  .life-v4 .jz-cat-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:78px;gap:8px;}
  .life-v4 .jz-cat{min-height:0;border-radius:18px;}
  .life-v4 .jz-cat:nth-child(1){grid-column:span 4;grid-row:span 2;}
  .life-v4 .jz-cat:nth-child(2){grid-column:span 2;grid-row:span 2;}
  .life-v4 .jz-cat:nth-child(3),
  .life-v4 .jz-cat:nth-child(4){grid-column:span 2;}
  .life-v4 .jz-cat:nth-child(9){grid-column:span 2;}
  .life-v4 .jz-cat:nth-child(1) .in,
  .life-v4 .jz-cat:nth-child(2) .in{padding:14px;min-height:100%;}
  .life-v4 .jz-cat:nth-child(1) .desc,
  .life-v4 .jz-cat:nth-child(2) .desc{display:block !important;font-size:11px;margin-top:4px;}
  .life-v4 .jz-cat:nth-child(1) h3{font-size:24px;}
  .life-v4 .jz-cat:nth-child(1) .orb{width:44px;height:44px;font-size:22px;}
  .life-v4 .jz-cat:nth-child(2) h3{font-size:18px;}
  .life-v4 .jz-cat:nth-child(n+3) .arrow{display:none;}
  .life-v4 .jz-cat:nth-child(n+3) .in{padding:10px 12px;min-height:0;}
  .life-v4 .jz-cat:nth-child(n+3) .orb{width:26px;height:26px;font-size:13px;}
  .life-v4 .jz-cat:nth-child(n+3) h3{font-size:13px;}
  .life-v4 .jz-cat:nth-child(n+3) .hero{margin-top:4px;}

  /* --- lifeLayout=v5 分组货架（自定义结构） --- */
  .life-v5 .jz-cat-grid{display:block;padding:0;}
  .life-v5 .jz-shelf{margin-bottom:14px;}
  .life-v5 .jz-shelf .lab{padding:0 2px 8px;font-size:10px;letter-spacing:.14em;color:#6b7c76;font-weight:700;}
  .life-v5 .jz-rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .life-v5 .jz-rail::-webkit-scrollbar{height:0;}
  .life-v5 .jz-rail .jz-cat{flex:0 0 132px;scroll-snap-align:start;min-height:148px;border-radius:18px;}
  .life-v5 .jz-rail .jz-cat .in{padding:12px;min-height:148px;justify-content:flex-end;}
  .life-v5 .jz-rail .jz-cat .top{margin-bottom:auto;}
  .life-v5 .jz-rail .jz-cat .arrow{display:none;}
  .life-v5 .jz-rail .jz-cat .pill{font-size:8px;}
  .life-v5 .jz-rail .jz-cat .hero{margin-top:0;flex-direction:column;align-items:flex-start;gap:6px;}
  .life-v5 .jz-rail .jz-cat .orb{width:28px;height:28px;font-size:16px;}
  .life-v5 .jz-rail .jz-cat h3{font-size:15px;}
  .life-v5 .jz-rail .jz-cat .desc{display:block !important;font-size:10px;margin-top:2px;-webkit-line-clamp:2;}

  /* --- lifeLayout=v6 浅色编辑部 --- */
  .life-v6 .jz-cat-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .life-v6 .jz-cat{min-height:0;border-radius:18px;color:var(--ink);box-shadow:0 8px 20px rgba(15,42,38,.05);
    border:1px solid #e5ebe8;background:#fff;}
  .life-v6 .jz-cat::before,.life-v6 .jz-cat::after{display:none;}
  .life-v6 .jz-cat .bg{display:none;}
  .life-v6 .jz-cat .in{padding:14px;min-height:0;flex-direction:row;align-items:center;gap:12px;position:relative;}
  .life-v6 .jz-cat .in::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:18px 0 0 18px;background:var(--brand);}
  .life-v6 .jz-cat.repair .in::before{background:#1d4e89;}
  .life-v6 .jz-cat.moving .in::before{background:#6d5544;}
  .life-v6 .jz-cat.nanny .in::before{background:#5e5566;}
  .life-v6 .jz-cat.telecom .in::before{background:#2563eb;}
  .life-v6 .jz-cat.insurance .in::before{background:#8c6224;}
  .life-v6 .jz-cat.consumer_finance .in::before{background:#0f1a4d;}
  .life-v6 .jz-cat.health_care .in::before{background:#0e7490;}
  .life-v6 .jz-cat.home_maintain .in::before{background:#3f6212;}
  .life-v6 .jz-cat.asset .in::before{background:#1e3a5f;}
  .life-v6 .jz-cat.recycle .in::before{background:#166534;}
  .life-v6 .jz-cat.community .in::before{background:#6d28d9;}
  .life-v6 .jz-cat .top{order:3;margin-left:auto;}
  .life-v6 .jz-cat .pill{display:none;}
  .life-v6 .jz-cat .arrow{width:20px;height:20px;border:0;background:transparent;color:#9aaba4;}
  .life-v6 .jz-cat .hero{margin-top:0;flex:1;}
  .life-v6 .jz-cat .orb{width:44px;height:44px;font-size:20px;border-radius:14px;box-shadow:none;border:0;}
  .life-v6 .jz-cat.cleaning .orb{background:linear-gradient(145deg,#214842,#0d221f);}
  .life-v6 .jz-cat.repair .orb{background:linear-gradient(145deg,#2a4260,#101d31);}
  .life-v6 .jz-cat.moving .orb{background:linear-gradient(145deg,#6d5544,#2a1d15);}
  .life-v6 .jz-cat.nanny .orb{background:linear-gradient(145deg,#5e5566,#2a222f);}
  .life-v6 .jz-cat.telecom .orb{background:linear-gradient(145deg,#1d4e89,#0b2444);}
  .life-v6 .jz-cat.insurance .orb{background:linear-gradient(145deg,#8c6224,#3d2a0e);}
  .life-v6 .jz-cat.consumer_finance .orb{background:linear-gradient(145deg,#0f1a4d,#0a1028);}
  .life-v6 .jz-cat.health_care .orb{background:linear-gradient(145deg,#0e7490,#063844);}
  .life-v6 .jz-cat.home_maintain .orb{background:linear-gradient(145deg,#3f6212,#1a2c07);}
  .life-v6 .jz-cat.asset .orb{background:linear-gradient(145deg,#1e3a5f,#0c1828);}
  .life-v6 .jz-cat.recycle .orb{background:linear-gradient(145deg,#166534,#0a2e18);}
  .life-v6 .jz-cat.community .orb{background:linear-gradient(145deg,#6d28d9,#2e1065);}
  .life-v6 .jz-cat h3{font-size:14px;color:var(--ink);}
  .life-v6 .jz-cat .desc{display:block !important;font-size:10px;color:var(--muted);margin-top:2px;-webkit-line-clamp:1;}
  .life-v6 .jz-cat:nth-child(1){grid-column:span 2;background:linear-gradient(120deg,#f7f4ee,#fff);}
  .life-v6 .jz-cat:nth-child(1) h3{font-size:18px;}
  .life-v6 .jz-cat:nth-child(1) .orb{width:52px;height:52px;font-size:24px;}
  .life-v6 .jz-cat:nth-child(1) .desc{display:block !important;-webkit-line-clamp:2;}

  /* 领券中心 / 热门 / 专题：统一内容边距 */
  #pane-jiazheng,.jz-market{--g:18px;}
  .jz-coupon-sec{margin-top:4px;}
  .jz-coupon{display:flex;gap:10px;overflow-x:auto;padding:2px var(--g) 4px;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;}
  .jz-coupon::-webkit-scrollbar{height:0;}
  .jz-coupon .ticket{flex:0 0 168px;scroll-snap-align:start;display:flex;flex-direction:column;border-radius:12px;
    overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 6px 14px rgba(15,42,38,.08);position:relative;
    background:linear-gradient(145deg,#ff8a3d,#c44a14);min-height:108px;}
  .jz-coupon .ticket.teal{background:linear-gradient(145deg,#14b8a6,#0f766e);}
  .jz-coupon .ticket.navy{background:linear-gradient(145deg,#1e3a5f,#0f1a4d);}
  .jz-coupon .ticket.violet{background:linear-gradient(145deg,#7c3aed,#5b21b6);}
  .jz-coupon .ticket.green{background:linear-gradient(145deg,#16a34a,#166534);}
  .jz-coupon .ticket .amt{padding:12px 12px 6px;font-family:var(--serif);line-height:1;}
  .jz-coupon .ticket .amt b{font-size:28px;font-weight:700;}
  .jz-coupon .ticket .amt b small{font-size:13px;margin-left:1px;}
  .jz-coupon .ticket .amt span{display:block;font-size:10px;opacity:.88;margin-top:4px;font-family:var(--font);}
  .jz-coupon .ticket .rule{padding:0 12px 10px;font-size:10px;opacity:.82;line-height:1.35;}
  .jz-coupon .ticket .claim{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:rgba(0,0,0,.12);font-size:10px;font-weight:700;border-top:1px dashed rgba(255,255,255,.28);}
  .jz-coupon .ticket .claim i{font-style:normal;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.94);color:#9a3412;}
  .jz-coupon .ticket.teal .claim i{color:#0f766e;}
  .jz-coupon .ticket.navy .claim i{color:#0f1a4d;}
  .jz-coupon .ticket.violet .claim i{color:#5b21b6;}
  .jz-coupon .ticket.green .claim i{color:#166534;}

  /* 热门推荐 · 横滑 */
  .jz-hot-rail{display:flex;gap:10px;overflow-x:auto;padding:2px var(--g) 2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .jz-hot-rail::-webkit-scrollbar{height:0;}
  .jz-hot-rail .card{flex:0 0 156px;scroll-snap-align:start;border-radius:14px;background:#fff;border:1px solid #e8eeeb;
    box-shadow:0 6px 14px rgba(15,42,38,.05);padding:12px;display:flex;flex-direction:column;gap:5px;color:inherit;text-decoration:none;}
  .jz-hot-rail .card .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff;}
  .jz-hot-rail .card.cleaning .ic{background:linear-gradient(145deg,#214842,#0d221f);}
  .jz-hot-rail .card.repair .ic{background:linear-gradient(145deg,#2a4260,#101d31);}
  .jz-hot-rail .card.moving .ic{background:linear-gradient(145deg,#6d5544,#2a1d15);}
  .jz-hot-rail .card.nanny .ic{background:linear-gradient(145deg,#5e5566,#2a222f);}
  .jz-hot-rail .card.telecom .ic{background:linear-gradient(145deg,#1d4e89,#0b2444);}
  .jz-hot-rail .card.insurance .ic{background:linear-gradient(145deg,#8c6224,#3d2a0e);}
  .jz-hot-rail .card.consumer_finance .ic{background:linear-gradient(145deg,#0f1a4d,#0a1028);}
  .jz-hot-rail .card.health_care .ic{background:linear-gradient(145deg,#0e7490,#063844);}
  .jz-hot-rail .card.home_maintain .ic{background:linear-gradient(145deg,#3f6212,#1a2c07);}
  .jz-hot-rail .card.asset .ic{background:linear-gradient(145deg,#1e3a5f,#0c1828);}
  .jz-hot-rail .card.recycle .ic{background:linear-gradient(145deg,#166534,#0a2e18);}
  .jz-hot-rail .card.community .ic{background:linear-gradient(145deg,#6d28d9,#2e1065);}
  .jz-hot-rail .card b{font-size:12px;color:var(--ink);font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .jz-hot-rail .card .meta{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jz-hot-rail .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;}
  .jz-hot-rail .card .pr{font-family:var(--serif);font-size:13px;color:var(--gold-deep);}
  .jz-hot-rail .card .go{font-size:10px;font-weight:700;color:#0f766e;background:rgba(15,118,110,.08);padding:4px 8px;border-radius:999px;}

  /* 专题窗口 · 多专题横滑（与热门同左缘，卡宽接近一屏） */
  .jz-topic{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    padding:0 var(--g) 24px;}
  .jz-topic::-webkit-scrollbar{height:0;}
  .jz-topic-win{flex:0 0 calc(100% - 28px);scroll-snap-align:start;border-radius:18px;overflow:hidden;
    border:1px solid rgba(15,42,38,.08);box-shadow:0 10px 24px rgba(15,42,38,.08);color:#fff;position:relative;max-width:360px;}
  .jz-topic-win::before{content:"";position:absolute;inset:0;pointer-events:none;}
  .jz-topic-win.theme-home::before{background:radial-gradient(ellipse at 90% 0%,rgba(255,217,138,.14),transparent 40%),
      linear-gradient(145deg,#1a4a43 0%,#0d2e2a 55%,#163a34 100%);}
  .jz-topic-win.theme-care::before{background:radial-gradient(ellipse at 90% 0%,rgba(165,243,252,.16),transparent 40%),
      linear-gradient(145deg,#0e7490 0%,#0a4a5c 55%,#063844 100%);}
  .jz-topic-win.theme-asset::before{background:radial-gradient(ellipse at 90% 0%,rgba(253,230,138,.14),transparent 40%),
      linear-gradient(145deg,#1e3a5f 0%,#0f1a4d 55%,#0a1028 100%);}
  .jz-topic-win.theme-green::before{background:radial-gradient(ellipse at 90% 0%,rgba(187,247,208,.14),transparent 40%),
      linear-gradient(145deg,#166534 0%,#14532d 55%,#0a2e18 100%);}
  .jz-topic-hero{position:relative;z-index:2;display:block;padding:14px 14px 10px;color:#fff;text-decoration:none;}
  .jz-topic-hero .eyebrow{font-size:9px;letter-spacing:.16em;opacity:.65;}
  .jz-topic-hero h3{font-family:var(--serif);font-size:20px;margin-top:4px;line-height:1.15;}
  .jz-topic-hero p{font-size:11px;opacity:.85;margin-top:5px;max-width:30ch;line-height:1.4;}
  .jz-topic-hero .cta{display:inline-flex;align-items:center;margin-top:10px;font-size:11px;font-weight:700;
    padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.94);color:#0f3d38;}
  .jz-topic-win.theme-care .jz-topic-hero .cta{color:#0e7490;}
  .jz-topic-win.theme-asset .jz-topic-hero .cta{color:#0f1a4d;}
  .jz-topic-win.theme-green .jz-topic-hero .cta{color:#166534;}
  .jz-topic-slots{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px;}
  .jz-topic-slots a{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;border-radius:12px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:#fff;text-decoration:none;min-height:68px;}
  .jz-topic-slots a .ic{font-size:15px;line-height:1;}
  .jz-topic-slots a b{font-size:12px;font-weight:700;}
  .jz-topic-slots a span{font-size:9px;opacity:.7;}

  /* 我的订单快捷入口 */
  .jz-ordbar{display:flex;background:#fff;border:1px solid #e5ebe8;border-radius:14px;
    margin:0 18px;padding:12px 0;box-shadow:0 4px 12px rgba(15,42,38,.04);}
  .jz-ordbar a{flex:1;text-align:center;font-size:11px;color:#17352f;position:relative;font-weight:600;}
  .jz-ordbar a .ic{font-size:18px;display:block;margin-bottom:3px;}
  .jz-ordbar a .bdg{position:absolute;top:-4px;right:22%;background:#dc2626;color:#fff;font-size:9px;
    min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px;font-weight:700;}
  .collage{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 8px;}
  .ctile{position:relative;border-radius:16px;overflow:hidden;color:#fff;display:block;min-height:108px;
    box-shadow:0 8px 20px rgba(15,42,38,.12);}
  .ctile .bg{position:absolute;inset:0;background-color:#0c4d44;}
  .ctile .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(8,18,16,.72),rgba(8,18,16,.12) 55%);}
  .ctile.empty{opacity:.72;}
  .ctile .in{position:relative;z-index:2;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:108px;}
  .ctile.tall{grid-row:span 2;min-height:200px;}
  .ctile.tall .in{min-height:200px;}
  .ctile.wide{grid-column:span 2;min-height:120px;}
  .ctile .no{font-family:var(--serif);font-size:28px;font-weight:700;opacity:.35;line-height:1;}
  .ctile h3{font-family:var(--serif);font-size:17px;margin-top:4px;line-height:1.15;}
  .ctile .nums{display:flex;gap:10px;margin-top:8px;font-size:9px;opacity:.9;flex-wrap:wrap;}
  .ctile .nums b{font-family:var(--serif);font-size:13px;display:block;}
  .ctile .hot,.ctile .empty-tag{position:absolute;top:10px;right:10px;z-index:3;font-size:9px;font-weight:700;
    background:rgba(255,217,138,.25);color:#ffd98a;padding:2px 8px;border-radius:999px;}
  .ctile .empty-tag{background:rgba(255,255,255,.2);color:#fff;}
  .spread{padding:14px 18px 24px;}
  .spread-hero{display:block;border-radius:18px;overflow:hidden;margin-bottom:10px;color:#fff;box-shadow:0 12px 28px rgba(15,42,38,.14);}
  .spread-hero .img{height:180px;position:relative;background-color:#0c4d44;background-size:cover;background-position:center;}
  .spread-hero .img::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent 55%);}
  .spread-hero .cap{position:absolute;left:16px;bottom:14px;right:16px;z-index:2;}
  .spread-hero .cap .ek{font-size:9px;letter-spacing:.2em;opacity:.85;}
  .spread-hero .cap h3{font-family:var(--serif);font-size:22px;margin-top:4px;}
  .spread-hero .cap p{font-size:11px;opacity:.9;margin-top:4px;}
  .spread-hero .body{background:#fff;color:var(--ink);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
  .spread-hero .body b{font-family:var(--serif);font-size:20px;color:var(--gold-deep);}
  .spread-hero .body .bk{font-size:11px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--brand),var(--brand-2));padding:7px 14px;border-radius:999px;}
  .spread-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .mini-card{display:block;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(15,42,38,.06);}
  .mini-card .th{height:90px;background-size:cover;background-position:center;background-color:#0c4d44;}
  .mini-card .bd{padding:10px 11px 12px;}
  .mini-card .bd b{font-size:13px;color:var(--ink);display:block;line-height:1.3;}
  .mini-card .bd .pr{font-family:var(--serif);font-size:16px;color:var(--gold-deep);margin-top:6px;}
  .mini-card .bd .pr small{font-size:10px;font-family:var(--font);color:var(--muted);}
  .load-err{padding:24px 18px;text-align:center;color:var(--muted);font-size:13px;}
</style>

<script>
(function(){
  var pad = function(n){ return String(n).padStart(2,'0'); };

  function cityOf(d) {
    return (window.BZF_JZ && BZF_JZ.regionCity()) || (d && d.city && d.city.name) || '沈阳';
  }

  function applyChannelChrome(d) {
    var city = cityOf(d);
    var op = (window.BZF_JZ && BZF_JZ.regionOperator()) || '贝壳';
    var bizTerm = (window.BZF_REGION && BZF_REGION.biz && BZF_REGION.biz.term) || '保租房';
    var brand = (window.JUZHU && JUZHU.channelBrand) ? JUZHU.channelBrand() : { name: '新居住频道', short: '新居住', zone: '新居住专区' };
    var navBrand = document.getElementById('navBrand');
    if (navBrand) navBrand.textContent = brand.short;
    document.getElementById('navCitySub').textContent = city + ' · ' + brand.zone;
    document.getElementById('schemeLabel').textContent = '方案 C · ' + city + '真实数据';
    document.getElementById('bzfBannerTitle').textContent = city + bizTerm + ' · ' + brand.zone;
    document.getElementById('heroEk').textContent = 'Cover Collage · ' + city;
    document.title = brand.short + ' · ' + city + ' · ' + op;
  }

  function revealHome() {
    var app = document.querySelector('.app');
    if (!app || !app.classList.contains('is-booting')) return;
    app.classList.remove('is-booting');
    app.classList.add('is-ready');
  }

  function activateTab(tabId) {
    document.querySelectorAll('.seg-switch a').forEach(function(a) {
      a.classList.toggle('on', a.dataset.tab === tabId);
    });
    document.querySelectorAll('.pane').forEach(function(p) {
      p.classList.toggle('on', p.id === 'pane-' + tabId);
    });
    if (tabId === 'jiazheng') {
      requestAnimationFrame(function(){
        peekJzRail('jzSubs', 36);
        peekJzRail('jzCoupon', 52);
        peekJzRail('jzPromo', 28);
      });
    }
  }

  function renderHero(d){
    applyChannelChrome(d);
    var brand = (window.JUZHU && JUZHU.channelBrand) ? JUZHU.channelBrand() : { short: '新居住' };
    document.getElementById('heroTitle').textContent = cityOf(d) + ' · ' + brand.short;
    var stock = (d.stats && d.stats.unit_count != null)
      ? Number(d.stats.unit_count)
      : (d.projects || []).filter(function(p){ return (p.channel === 'rental' || p.channel === 'bzf') && (p.tags || []).indexOf('保租房') >= 0; })
          .reduce(function(sum, p){ return sum + JUZHU.managedUnits(p); }, 0);
    document.getElementById('heroStat').innerHTML =
      '<div><b>'+d.stats.project_count_bzf+'</b>保租项目</div>'+
      '<div><b>'+d.stats.project_count_trade+'</b>置换项目</div>'+
      '<div><b>'+stock+'</b>房源量</div>';
    document.getElementById('distCount').textContent = d.stats.district_count + ' 区 ›';
    var bgEl = document.querySelector('.split-hd .bg');
    if (d.city.hero_bg_image) {
      bgEl.style.backgroundImage = 'url(' + JUZHU.thumbUrl(d.city.hero_bg_image) + ')';
      bgEl.classList.add('has-img');
    } else {
      bgEl.style.backgroundImage = '';
      bgEl.classList.remove('has-img');
    }
  }

  function collageLayout(d, list) {
    if (!d.has_projects) return { tall: false, wide: false };
    var active = list.filter(function(x) { return x.has_projects; });
    var ai = active.findIndex(function(x) { return x.id === d.id; });
    if (ai < 0) return { tall: false, wide: false };
    var phase = ai % 5;
    return { tall: phase === 3, wide: phase === 2 };
  }

  // 磁力瓦片按房源量降序（规模大的区排前面）：主序=在管房源量，平手依次比项目数/原序；空区自然沉底
  function sortCollageByStock(list) {
    return list.slice().sort(function (a, b) {
      var s = JUZHU.districtManagedUnits(b) - JUZHU.districtManagedUnits(a);
      if (s) return s;
      var pc = (b.project_count || 0) - (a.project_count || 0);
      if (pc) return pc;
      return (a.sort_order || 0) - (b.sort_order || 0) || (a.id || 0) - (b.id || 0);
    });
  }

  function renderCollage(list){
    document.getElementById('collage').innerHTML = list.map(function(d,i){
      var lay = collageLayout(d, list);
      var cls = 'ctile'+(lay.tall?' tall':'')+(lay.wide?' wide':'')+(d.has_projects? '':' empty');
      var href = d.has_projects
        ? 'juzhu-bzf-list.html?district='+encodeURIComponent(d.name)+JUZHU.chainQS()
        : '#';
      var bg = d.cover_image
        ? 'background-image:url('+JUZHU.thumbUrl(d.cover_image)+');background-size:cover;background-position:center;'
        : '';
      var tag = d.is_hot ? '<span class="hot">热门</span>' :
        (!d.has_projects ? '<span class="empty-tag">暂无项目</span>' : '');
      return '<a class="'+cls+'" href="'+href+'"'+(d.has_projects?'':' onclick="return false"')+'>'+
        '<div class="bg '+(bg?'':' '+d.bg_class)+'" style="'+bg+'"></div>'+tag+
        '<div class="in"><span class="no">'+pad(i+1)+'</span><h3>'+d.name+'</h3>'+
        '<div class="nums">'+
          '<div><b>'+JUZHU.districtManagedUnits(d)+'</b>房源量</div>'+
          '<div><b>'+d.project_count+'</b>项目</div>'+
          '<div><b>'+(d.avg_price?'¥'+d.avg_price:'—')+'</b>均价</div>'+
        '</div></div></a>';
    }).join('');
  }

  // === 频道 pane（长租/民宿/新房/二手）：与频道 tab 一一对应，按当前城市 catalog 过滤 ===
  var CHANNEL_META = {
    rental:   { label: '长租', count: 'rentalCount',   list: 'rentalList',   empty: '该城市暂无在架长租房源 · 切换城市或从「找房」查看' },
    minsu:    { label: '民宿', count: 'minsuCount',    list: 'minsuList',    empty: '该城市暂无在架民宿门店 · 切换城市可见贵阳门店' },
    newhouse: { label: '新房', count: 'newhouseCount', list: 'newhouseList', empty: '该城市暂无在售新房楼盘' },
    resale:   { label: '二手', count: 'resaleCount',   list: 'resaleList',   empty: '该城市暂无在售二手房源' }
  };
  function channelHref(mode, x) {
    if (mode === 'minsu') return 'lvju-app-detail.html?id=' + x.id + JUZHU.chainQS();
    return 'juzhu-bzf-project.html?channel=' + mode + '&project=' + encodeURIComponent(x.slug) + JUZHU.chainQS();
  }
  function channelPrice(mode, x) {
    if (mode === 'rental') return x.price_from != null ? '¥' + Number(x.price_from).toLocaleString() + '<small>/月起</small>' : '价格面议';
    if (mode === 'minsu')  return x.price_from != null ? '¥' + Number(x.price_from).toLocaleString() + '<small>/晚起</small>' : '价格面议';
    return x.price_from != null ? x.price_from + '<small>起</small>' : '价格面议';
  }
  function renderChannelPane(mode, list) {
    var meta = CHANNEL_META[mode];
    var box = document.getElementById(meta.list);
    if (!box) return;
    document.getElementById(meta.count).textContent = list.length ? '共 ' + list.length + ' 个' : '—';
    if (!list.length) { box.innerHTML = '<p class="load-err">' + meta.empty + '</p>'; return; }
    box.innerHTML = list.map(function(x) {
      var tags = JUZHU.asTags(x.tags).slice(0, 3).join(' · ');
      var st = x.cover_image
        ? 'style="background-image:url(' + JUZHU.thumbUrl(x.cover_image) + ');background-size:cover;background-position:center;"'
        : '';
      var star = mode === 'minsu' ? '门店' : meta.label;
      return '<a class="lrow" href="' + channelHref(mode, x) + '">' +
        '<div class="th" ' + st + '><span class="star">' + star + '</span></div>' +

  // 横滑轴打开时错位 peek，提示可左右滑（三条错开）
  function peekJzRail(id, px){
    var el = document.getElementById(id);
    if (!el || el.children.length < 2) return;
    if (el.scrollWidth <= el.clientWidth + 12) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.style.scrollSnapType = 'none';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        if (reduce) {
          el.scrollLeft = px;
          el.style.scrollSnapType = '';
          return;
        }
        el.scrollLeft = 0;
        el.scrollTo({ left: px, behavior: 'smooth' });
        setTimeout(function(){ el.style.scrollSnapType = ''; }, 520);
      });
    });
  }

    if (!dt || !window.BZF_JZ) return;
    function paint(){ dt.textContent = '演示模式：' + (BZF_JZ.isDemo() ? '开' : '关'); }
    dt.addEventListener('click', function(){ BZF_JZ.setDemo(!BZF_JZ.isDemo()); paint(); });
    paint();
  })();

  // —— 省/市 切换器（省级 = 选「全省」，市级 = 选具体市）——
  var lastData = null;
  var sheetProv = null; // 面板当前展开的省
  function renderProvCol() {
    var provs = BZF_JZ.regionProvinces();
    document.getElementById('provCol').innerHTML = provs.map(function(p) {
      return '<a data-prov="' + p + '"' + (p === sheetProv ? ' class="on"' : '') + '>' + p + '</a>';
    }).join('');
  }
  function renderCityCol() {
    var cur = BZF_JZ.regionCity();
    var html = '<a data-city="' + sheetProv + '" class="allp' + (cur === sheetProv ? ' on' : '') + '">' + sheetProv + '全省</a>';
    html += BZF_JZ.citiesOf(sheetProv).map(function(c) {
      return '<a data-city="' + c + '"' + (c === cur ? ' class="on"' : '') + '>' + c + '</a>';
    }).join('');
    document.getElementById('cityGrid').innerHTML = html;
  }
  function openCitySheet() {
    if (!window.BZF_JZ) return;
    sheetProv = BZF_JZ.provinceOf(BZF_JZ.regionCity()) || BZF_JZ.regionProvinces()[0];
    renderProvCol();
    renderCityCol();
    document.getElementById('citySheet').classList.add('on');
  }
  function closeCitySheet() {
    document.getElementById('citySheet').classList.remove('on');
  }
  document.getElementById('navCitySub').addEventListener('click', openCitySheet);
  // —— 后端配置：读取 settings 控制城市切换器显隐 ——
  (function(){
    JUZHU.loadSettings().then(function(s){
      if (!s.show_city_switcher) {
        var sub = document.getElementById('navCitySub');
        if (sub) { sub.classList.remove('city-tap'); sub.style.cursor = 'default'; }
        var sheet = document.getElementById('citySheet');
        if (sheet) {
          sheet.style.display = 'none';
          sheet.classList.remove('on');
        }
      }
    }).catch(function(){});
  })();
  document.getElementById('citySheet').addEventListener('click', function(e) {
    if (e.target.hasAttribute('data-close')) { closeCitySheet(); return; }
    var prov = e.target.closest('[data-prov]');
    if (prov) { sheetProv = prov.getAttribute('data-prov'); renderProvCol(); renderCityCol(); return; }
    var pick = e.target.closest('[data-city]');
    if (!pick) return;
    BZF_JZ.setRegionCity(pick.getAttribute('data-city'));
    applyChannelChrome(lastData);
    if (lastData) {
      var brand = (window.JUZHU && JUZHU.channelBrand) ? JUZHU.channelBrand() : { short: '新居住' };
      document.getElementById('heroTitle').textContent = cityOf(lastData) + ' · ' + brand.short;
    }
    closeCitySheet();
  });

  Promise.all([JUZHU.load({ lite: true }), JUZHU.loadSettings()]).then(function(results) {
    var d = results[0];
    lastData = d;
    // 城市来源优先级：URL ?city= 直链（只读）> localStorage 用户选择 > 后端数据城市兜底。
    // 仅当 URL 与 localStorage 都没有城市来源时，才用数据城市初始化；
    // localStorage 已有用户选择的城市时，尊重它，不强制改回。
    if (window.BZF_JZ && d.city && d.city.name && !(BZF_JZ.urlCity && BZF_JZ.urlCity())) {
      var hasStored = false;
      try { hasStored = !!localStorage.getItem('bzf_jz_city'); } catch (e) {}
      if (!hasStored) {
        BZF_JZ.setRegionCity(d.city.name);
      }
    }
    paintTabs();
    renderHero(d);
    renderCollage(sortCollageByStock(JUZHU.districts()));
    renderTrade(JUZHU.tradeListings());
    // 频道 pane：长租排除「旅居」tag（旅居走民宿/旅居入口，避免同房源双入口）；其余频道全量
    var lvjuOnly = function(p){ return (JUZHU.asTags(p.tags) || []).indexOf('旅居') >= 0; };
    renderChannelPane('rental', JUZHU.projects({ channel: 'rental' }).filter(function(p){ return !lvjuOnly(p); }));
    renderChannelPane('minsu', JUZHU.projects({ channel: 'minsu' }));
    renderChannelPane('newhouse', JUZHU.projects({ channel: 'newhouse' }));
    renderChannelPane('resale', JUZHU.projects({ channel: 'resale' }));
    revealHome();
  }).catch(function(err) {
    document.getElementById('err').hidden = false;
    document.getElementById('err').textContent = '数据加载失败：'+err.message+'（请先运行 python3 juzhu/seed_from_folder.py）';
    paintTabs();
    revealHome();
  });
})();
</script>
</body>
</html>
