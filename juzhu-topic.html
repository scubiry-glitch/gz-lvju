  .scr{padding-bottom:88px;background:#f6f4ef;}
  .appbar{position:sticky;top:0;z-index:30;background:rgba(246,244,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(15,42,38,.06);}

  /* Cover · 杂志封面（首屏约 2.5 步旅程） */
  .cover{position:relative;color:#fff;overflow:hidden;isolation:isolate;min-height:25vh;}
  .cover::before{content:"";position:absolute;inset:0;z-index:0;
    background:var(--cover-bg,linear-gradient(160deg,#0b5d56,#1b4f47 55%,#c58d36));}
  .cover::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse at 88% 8%,rgba(255,255,255,.2),transparent 40%),
      repeating-linear-gradient(-18deg,rgba(255,255,255,.035) 0 1px,transparent 1px 28px),
      linear-gradient(180deg,transparent 38%,rgba(0,0,0,.4) 100%);}
  .cover .in{position:relative;z-index:2;padding:18px 16px 38px;min-height:25vh;
    display:flex;flex-direction:column;justify-content:flex-end;}
  .cover .issue{font-size:9px;letter-spacing:.22em;opacity:.72;text-transform:uppercase;}
  .cover .scene{margin-top:10px;font-size:11px;letter-spacing:.06em;opacity:.88;}
  .cover h1{font-family:var(--serif);font-size:28px;line-height:1.14;margin-top:6px;font-weight:700;max-width:9em;
    animation:rise .55s cubic-bezier(.22,1,.36,1) both;}
  .cover .lede{margin-top:8px;font-size:12px;line-height:1.55;opacity:.92;max-width:32ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    animation:rise .55s .08s cubic-bezier(.22,1,.36,1) both;}
  .cover .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;
    animation:rise .55s .14s cubic-bezier(.22,1,.36,1) both;}
  .cover .meta span{font-size:9px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);}
  .cover .scroll-hint{display:none;}

  .theme-home{--cover-bg:linear-gradient(155deg,#0b5d56 0%,#11453f 48%,#9a6b28 100%);--accent:#0f766e;--accent-soft:#e8f5f2;--ink-on:#0b5d56;}
  .theme-care{--cover-bg:linear-gradient(155deg,#0a5568 0%,#0e7490 48%,#67e8f9 100%);--accent:#0e7490;--accent-soft:#e0f7fa;--ink-on:#0a5568;}
  .theme-asset{--cover-bg:linear-gradient(155deg,#0a1028 0%,#0f1a4d 48%,#b48a3f 100%);--accent:#0f1a4d;--accent-soft:#eef1f8;--ink-on:#0f1a4d;}
  .theme-green{--cover-bg:linear-gradient(155deg,#0f4a26 0%,#166534 48%,#86efac 100%);--accent:#166534;--accent-soft:#e8f8ee;--ink-on:#0f4a26;}
  .theme-neighbor{--cover-bg:linear-gradient(155deg,#3b1d0f 0%,#7c2d12 48%,#fbbf24 100%);--accent:#9a3412;--accent-soft:#fff7ed;--ink-on:#7c2d12;}

  /* 场景引言 */
  .scene-block{margin:-16px 12px 0;position:relative;z-index:5;background:#fff;border-radius:14px;padding:12px 14px;
    box-shadow:0 10px 24px rgba(15,42,38,.08);animation:rise .5s .12s cubic-bezier(.22,1,.36,1) both;}
  .scene-block .who{font-size:10px;letter-spacing:.12em;color:var(--accent,#0f766e);font-weight:700;}
  .scene-block h2{font-family:var(--serif);font-size:15px;line-height:1.35;margin-top:4px;color:var(--ink);}
  .scene-block p{margin-top:5px;font-size:11px;line-height:1.55;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}

  .sec{margin:14px 12px 0;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;}
  .sec-head h3{font-family:var(--serif);font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .sec-head h3::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(var(--accent,#0f766e),var(--gold));}
  .sec-head .more{font-size:10px;color:var(--muted);}

  /* 用户旅程 */
  .journey{position:relative;padding-left:2px;}
  .journey::before{content:"";position:absolute;left:17px;top:10px;bottom:10px;width:1.5px;
    background:linear-gradient(180deg,var(--accent,#0f766e),transparent);}
  .j-step{position:relative;display:grid;grid-template-columns:36px 1fr;gap:8px;margin-bottom:9px;
    opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;}
  .j-step.in,.j-step.ready{opacity:1;transform:none;}
  .j-step .n{width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--accent,#0f766e);
    color:var(--ink-on,#0b5d56);font-family:var(--serif);font-size:13px;font-weight:700;
    display:grid;place-items:center;box-shadow:0 3px 10px rgba(15,42,38,.07);z-index:1;}
  .j-step .card{background:#fff;border-radius:13px;padding:11px 12px 10px;border:1px solid rgba(15,42,38,.06);
    box-shadow:0 5px 14px rgba(15,42,38,.04);}
  .j-step .when{font-size:9px;letter-spacing:.08em;color:var(--accent,#0f766e);font-weight:700;}
  .j-step .card h4{font-family:var(--serif);font-size:14px;margin-top:3px;color:var(--ink);}
  .j-step .card p{margin-top:3px;font-size:11px;line-height:1.45;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .j-step .svc{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;
    padding:8px 10px;border-radius:10px;background:var(--accent-soft,#e8f5f2);text-decoration:none;color:inherit;}
  .j-step .svc .ic{font-size:16px;line-height:1;}
  .j-step .svc b{display:block;font-size:12px;color:var(--ink);}
  .j-step .svc span{font-size:9px;color:var(--muted);}
  .j-step .svc .go{font-size:11px;font-weight:700;color:var(--ink-on,#0b5d56);white-space:nowrap;}

  /* 推荐 */
  .picks{display:grid;gap:10px;}
  .pick{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;
    background:#fff;border-radius:16px;padding:10px;border:1px solid rgba(15,42,38,.06);
    text-decoration:none;color:inherit;box-shadow:0 6px 16px rgba(15,42,38,.04);
    transition:transform .2s ease,box-shadow .2s ease;}
  .pick:active{transform:scale(.985);}
  .pick .poster{width:76px;height:76px;border-radius:12px;color:#fff;position:relative;overflow:hidden;

  .pick .poster .t1{position:relative;z-index:1;font-size:9px;padding:8px 8px 0;opacity:.9;letter-spacing:.06em;}
  .pick .poster .t2{position:relative;z-index:1;font-family:var(--serif);font-size:15px;line-height:1.1;padding:4px 8px 0;font-weight:700;}
  .pick .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.2));}
  .pick .main{min-width:0;}
  .pick .main .why{font-size:10px;color:var(--accent,#0f766e);font-weight:700;letter-spacing:.04em;}
  .pick .main h4{font-size:14px;font-weight:800;margin-top:3px;line-height:1.25;color:var(--ink);

  .pick .main p{margin-top:3px;font-size:11px;color:var(--muted);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick .main .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .pick .main .tags span{font-size:9px;padding:2px 7px;border-radius:999px;background:var(--accent-soft,#e8f5f2);color:var(--ink-on,#0b5d56);}
  .pick .side{text-align:right;}
  .pick .side b{font-family:var(--serif);font-size:18px;color:#ef5a2a;line-height:1;}
  .pick .side b small{font-family:var(--font);font-size:10px;color:var(--muted);font-weight:400;}
  .pick .side .cta{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#fff;

  .bundle{margin:18px 14px 0;padding:16px;border-radius:16px;background:#fff;

  .bundle .lab{font-size:10px;letter-spacing:.14em;color:var(--accent,#0f766e);font-weight:700;}
  .bundle h3{font-family:var(--serif);font-size:16px;margin-top:4px;color:var(--ink);}
  .bundle ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;}
  .bundle li{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted);}
  .bundle li::before{content:"✓";color:var(--accent,#0f766e);font-weight:700;flex-shrink:0;}

  .more-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .more-cats a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;

  .more-cats .ic{font-size:18px;}
  .more-cats b{font-size:12px;font-weight:700;color:var(--ink);}
  .more-cats span{font-size:10px;color:var(--muted);}

  .foot-cta{margin:22px 14px 0;display:flex;gap:10px;}
  .foot-cta a{flex:1;text-align:center;padding:13px;border-radius:14px;font-size:13px;font-weight:700;text-decoration:none;}
  .foot-cta .pri{background:linear-gradient(90deg,var(--accent,#0f766e),color-mix(in oklab,var(--accent,#0f766e) 60%,#14b8a6));color:#fff;}
  .foot-cta .sec{background:#fff;color:var(--ink-on,#0b5d56);border:1px solid rgba(15,42,38,.1);}

  .topic-switch{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 0;-webkit-overflow-scrolling:touch;}
  .topic-switch::-webkit-scrollbar{display:none;}
  .topic-switch a{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:11px;background:#fff;
    color:var(--muted);border:1px solid rgba(15,42,38,.08);text-decoration:none;}
  .topic-switch a.on{background:var(--accent,#0f766e);color:#fff;border-color:transparent;font-weight:700;}

  .empty-tip{padding:24px;text-align:center;color:var(--muted);font-size:12px;}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(4px)}}
  @media (prefers-reduced-motion:reduce){
    .cover h1,.cover .lede,.cover .meta,.scene-block,.j-step{animation:none!important;opacity:1;transform:none;transition:none;}
  }
</style>

      },
      slots: [

      ]
    }
  };

  var topic = TOPICS[topicId] || TOPICS['new-home'];
  if (!TOPICS[topicId]) topicId = 'new-home';

  var root = document.getElementById('appRoot');
  root.classList.add(topic.theme);
  document.getElementById('cover').classList.add(topic.theme);

  document.title = topic.title + ' · 本地生活专题';
  document.getElementById('ttl').childNodes[0].nodeValue = topic.title;
  document.getElementById('issue').textContent = topic.issue;
  document.getElementById('sceneTag').textContent = topic.sceneTag;
  document.getElementById('title').textContent = topic.title;
  document.getElementById('lede').textContent = topic.lede;
  document.getElementById('meta').innerHTML = topic.meta.map(function (m) {
    return '<span>' + m + '</span>';
  }).join('');
  document.getElementById('who').textContent = topic.who;
  document.getElementById('sceneTitle').textContent = topic.sceneTitle;
  document.getElementById('sceneBody').textContent = topic.sceneBody;
  document.getElementById('journeyHint').textContent = topic.journeyHint;

  function cityQs(extra) {
    var qs = new URLSearchParams(extra || {});
    var city = JZ && JZ.regionCity && JZ.regionCity();
    if (city) qs.set('city', city);
    var s = qs.toString();
    return s ? '?' + s : '';
  }

  function listHref(cat) {
    return 'juzhu-jiazheng-list.html' + cityQs({ type: cat });
  }
  function detailHref(slug) {
    return 'juzhu-jiazheng-detail.html' + cityQs({ sku: slug });
  }

  // 旅程
  var journeyEl = document.getElementById('journey');
  journeyEl.innerHTML = topic.journey.map(function (step, i) {
    var href = step.sku ? detailHref(step.sku) : listHref(step.cat);
    return '<div class="j-step" data-i="' + i + '">' +
      '<div class="n">' + (i + 1) + '</div>' +
      '<div class="card">' +
        '<div class="when">' + step.when + '</div>' +
        '<h4>' + step.title + '</h4>' +
        '<p>' + step.body + '</p>' +
        '<a class="svc" href="' + href + '">' +
          '<div><div class="ic">' + step.icon + '</div></div>' +
          '<div style="flex:1;min-width:0"><b>' + step.catName + '</b><span>' + step.tip + '</span></div>' +
          '<div class="go">去预约 ›</div>' +
        '</a>' +
      '</div></div>';
  }).join('');

  // 组合提示
  var b = topic.bundle;
  document.getElementById('bundle').innerHTML =
    '<div class="lab">' + b.lab + '</div>' +
    '<h3>' + b.title + '</h3>' +
    '<ul>' + b.items.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ul>';

  // 相关频道
  document.getElementById('moreCats').innerHTML = topic.slots.map(function (s) {
    return '<a href="' + listHref(s.id) + '"><div class="ic">' + s.icon + '</div><b>' + s.name + '</b><span>' + s.tip + '</span></a>';
  }).join('');

  // 专题切换
  document.getElementById('topicSwitch').innerHTML = Object.keys(TOPICS).map(function (id) {
    var t = TOPICS[id];
    var on = id === topicId ? ' on' : '';
    return '<a class="' + on.trim() + '" href="juzhu-topic.html' + cityQs({ id: id }) + '">' + t.title + '</a>';
  }).join('');

  var first = topic.journey[0];
  document.getElementById('primaryCta').href = first.sku ? detailHref(first.sku) : listHref(first.cat);
  document.getElementById('backLink').href = 'index.html' + cityQs({ tab: 'jiazheng' });
  document.getElementById('backLife').href = 'index.html' + cityQs({ tab: 'jiazheng' });

  if (JZ && JZ.applyRegionChrome) {
    JZ.applyRegionChrome({ titleSub: '#ttlSub' });
  }

  // 推荐：按 slug 拉 SKU；失败则用旅程静态兜底
  var picksEl = document.getElementById('picks');
  function renderPicks(items) {
    if (!items.length) {
      picksEl.innerHTML = '<div class="empty-tip">暂无推荐，请稍后再试</div>';
      return;
    }
    picksEl.innerHTML = items.map(function (it) {
      var price = (it.price_from === 0 || it.price_from === '0')
        ? '<b><small>咨询</small></b>'
        : '<b>' + it.price_from + '<small>' + (it.price_unit || '起') + '</small></b>';
      var tags = (it.tags || []).slice(0, 2).map(function (t) {
        return '<span>' + t + '</span>';
      }).join('');
      var shortName = (it.name || '').split('·')[0].trim() || it.name;
      return '<a class="pick" href="' + detailHref(it.slug) + '">' +
        '<div class="poster"><div class="t1">PICK</div><div class="t2">' + shortName + '</div></div>' +
        '<div class="main">' +
          '<div class="why">' + (it._why || '专题精选') + '</div>' +
          '<h4>' + it.name + '</h4>' +
          '<p>' + (it.spec || '') + '</p>' +
          (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '</div>' +
        '<div class="side">' + price + '<div class="cta">预约</div></div>' +
      '</a>';
    }).join('');
  }

  function fallbackPicks() {
    return topic.picks.map(function (p, i) {
      var step = topic.journey.find(function (j) { return j.sku === p.slug; }) || topic.journey[i] || {};
      return {
        slug: p.slug,
        name: step.catName || p.slug,
        spec: step.tip || '',
        price_from: '—',
        price_unit: '',
        tags: ['专题推荐'],
        _why: p.why
      };
    });
  }

  if (JZ && JZ.skus) {
    JZ.skus({}).then(function (all) {
      var bySlug = {};
      (all || []).forEach(function (s) { bySlug[s.slug] = s; });
      var items = topic.picks.map(function (p) {
        var s = bySlug[p.slug];
        if (!s) return null;
        var copy = Object.assign({}, s);
        copy._why = p.why;
        return copy;
      }).filter(Boolean);
      renderPicks(items.length ? items : fallbackPicks());
    }).catch(function () {
      renderPicks(fallbackPicks());
    });
  } else {
    renderPicks(fallbackPicks());
  }

  // 旅程步骤入场：首屏前两步立刻可见，其余滚动渐入
  var io = window.IntersectionObserver ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' }) : null;
  document.querySelectorAll('.j-step').forEach(function (el, i) {
    if (i < 2) {
      el.classList.add('ready');
      return;
    }
    if (io) {
      el.style.transitionDelay = ((i - 2) * 0.05) + 's';
      io.observe(el);
    } else {
      el.classList.add('in');
    }
  });
})();
</script>
