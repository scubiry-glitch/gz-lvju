<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:,">
<title>找房专题 · 贝壳找房旅居</title>
<link rel="stylesheet" href="lvju-app.css?v=5">
<style>
  /* 找房专题落地页（?topic=slug&city=）：数据走 catalog?topic= 服务端过滤（settings KV 定义，
     scripts/find-topic-seed.cjs）；卡片与找房枢纽（lvju-app-search.html）同款同口径。 */
  .lcard{display:flex;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px;
    box-shadow:0 4px 14px rgba(15,42,38,.05);}
  .lcard .im{position:relative;flex:0 0 116px;height:87px;border-radius:10px;overflow:hidden;
    background-size:cover;background-position:center;background-color:#0c4d44;}
  .lcard .im .bdg{position:absolute;top:0;left:0;font-size:9px;font-weight:700;color:#fff;padding:2px 8px 2px 6px;border-radius:9px 0 9px 0;}
  .lcard .im .bdg.feat{background:linear-gradient(90deg,var(--gold),var(--gold-deep));}
  .lcard .im .bdg.onsale{background:linear-gradient(90deg,var(--brand),var(--brand-deep));}
  .lcard .in{flex:1;min-width:0;display:flex;flex-direction:column;}
  .lcard .t{display:flex;align-items:center;gap:5px;min-width:0;}
  .lcard .t .nm{font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lcard .t .ch{flex-shrink:0;font-size:9px;font-weight:700;color:#8c6224;background:var(--gold-soft);padding:1.5px 6px;border-radius:5px;}
  .lcard .meta{margin-top:4px;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;}
  .lcard .meta .sc{color:var(--gold-deep);font-weight:800;font-size:11.5px;font-family:var(--serif);}
  .lcard .meta .sc + i{font-style:normal;opacity:.55;}
  .lcard .tags{display:flex;gap:4px;margin-top:6px;overflow:hidden;}
  .lcard .tags span{flex-shrink:0;font-size:9px;color:var(--brand-deep);background:var(--brand-soft);padding:2px 6px;border-radius:4px;}
  .lcard .tags span.am{color:#92400e;background:#fef3c7;}
  .lcard .bt{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:6px;}
  .lcard .pr{color:var(--gold-deep);font-family:var(--serif);line-height:1;white-space:nowrap;}
  .lcard .pr i{font-style:normal;font-size:10px;margin-right:1px;}
  .lcard .pr b{font-size:19px;font-weight:700;}
  .lcard .pr small{font-size:9.5px;color:var(--muted);font-family:var(--font);margin-left:2px;}
  .lcard .go{flex-shrink:0;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    padding:8px 17px;border-radius:999px;box-shadow:0 4px 10px rgba(11,93,86,.22);}
  .lcard .go.tel{background:#fff;color:#92400e;border:1px solid #ecd9ac;box-shadow:none;}
  .hlist{padding:12px 12px 24px;}
  /* 本页 appbar 为实体流内元素（非 ghost 覆盖），hero 顶部留白相应收窄 */
  .hero-sm{padding-top:18px;}
  .hero-sm .stat{gap:16px;}
  .hero-sm .stat div + div{border-left:1px solid rgba(255,255,255,.25);padding-left:16px;}
  /* 去哪玩横滑小卡 */
  .playrow{display:flex;gap:9px;overflow-x:auto;padding:2px 14px 10px;}
  .playrow::-webkit-scrollbar{height:0;}
  .playrow a{position:relative;flex:0 0 118px;height:78px;border-radius:11px;overflow:hidden;color:#fff;
    background-size:cover;background-position:center;background-color:#0c4d44;box-shadow:0 5px 14px rgba(10,40,36,.15);}
  .playrow a::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,16,.04) 35%,rgba(8,18,16,.7) 100%);}
  .playrow a .pin{position:absolute;left:8px;right:6px;bottom:6px;z-index:2;font-size:10px;font-weight:600;
    line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.4);}
  .playrow a .k{position:absolute;top:5px;left:7px;z-index:2;font-size:8px;font-weight:700;padding:1px 6px;
    border-radius:999px;background:rgba(8,18,16,.45);backdrop-filter:blur(3px);}
</style>
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="appbar">
      <a class="bk" href="lvju-app-search.html" onclick="if(history.length>1){history.back();return false}">‹</a>
      <div class="ttl" id="tbTitle">找房专题<small>候鸟 · 康养 · 亲子 · 整栋</small></div>
      <div class="act"><span>♡</span><span>⤴</span></div>
    </div>

    <div class="hero-sm">
      <div class="bg" id="tbBg"></div>
      <div class="in">
        <div class="ek">Live Topic · 找房专题</div>
        <h1 id="tbName">加载中…</h1>
        <p id="tbDesc"></p>
        <div class="stat" id="tbStat"></div>
      </div>
    </div>

    <div class="hlist" id="listingWrap">
      <div style="text-align:center;color:#9aa5a1;padding:28px 0;font-size:12px;">加载中…</div>
    </div>

    <!-- 去哪玩：同城市路线 + 周边玩法（内容域与房源专题的挂接，规则 19） -->
    <div id="playSec"></div>

    <div class="banner gold">
      <span class="bi">🔎</span>
      <div class="bt"><b>没找到想要的？</b><p>找房枢纽支持区域 / 价格 / 评分筛选与全频道搜索</p></div>
      <a class="go" id="hubLink" href="lvju-app-search.html">去筛选 ›</a>
    </div>
  </div>

  <div class="tabbar">
    <a href="lvju-app-home-demo.html"><span class="ti">🏠</span>首页</a>
    <a class="on"><span class="ti">🔎</span>找房</a>
    <a href="lvju-app-spots.html"><span class="ti">📖</span>内容</a>
    <a href="lvju-app-orders.html"><span class="ti">🧾</span>订单</a>
    <a href="lvju-app-me.html"><span class="ti">👤</span>我的</a>
  </div>
</div>
<script>
/* 专题落地：本地 META 只管文案与兜底（label 以服务端 settings KV 下发的 topic.label 为准），
   清单与 scripts/find-topic-seed.cjs / 枢纽页 TOPICS 一致（bzf 为规则 15 既有专题）。 */
(function(){
  var qs = new URLSearchParams(location.search);
  var SLUG = qs.get('topic') || '';
  var CITY = qs.get('city') || (function(){ try { return localStorage.getItem('bzf_jz_city') || ''; } catch(e){ return ''; } })() || '贵阳';

  var META = {
    houniao:   { label: '候鸟过冬',   desc: '温暖过冬 · 候鸟式南飞旅居，连住 15 晚起', fb: 's-wanfeng' },
    kangyang:  { label: '康养度假',   desc: '森林 / 温泉 / 湿地 · 慢节奏康养目的地', fb: 's-stilt' },
    qinzi:     { label: '亲子研学',   desc: '田园 / 山林 · 带娃研学与自然课堂', fb: 's-country' },
    zhengdong: { label: '整栋包栋',   desc: '整栋院落 · 家庭聚会与团建包栋', fb: 's-xijiang' },
    bzf:       { label: '保租房专区', desc: '国企持有方房源 · 白名单运营商运营 · 统一监管', fb: 's-city' },
  };
  var meta = META[SLUG];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('zh-CN'); }
  function hasLvjuTag(p){ return (p.tags || []).indexOf('旅居') >= 0; }
  function channelChip(p){
    if (p.channel === 'rental') return hasLvjuTag(p) ? '旅居' : '长租';
    if (p.channel === 'minsu')  return hasLvjuTag(p) ? '旅居' : '民宿';
    return ({ rental: '长租', minsu: '民宿', newhouse: '新房', resale: '二手' })[p.channel] || p.channel;
  }

  document.getElementById('hubLink').href = 'lvju-app-search.html?city=' + encodeURIComponent(CITY);
  document.getElementById('tbName').textContent = meta ? meta.label : '找房专题';
  document.getElementById('tbDesc').textContent = meta ? meta.desc : '';
  if (!meta) {
    document.title = '找房专题 · 贝壳找房旅居';
    document.getElementById('tbBg').className = 'bg s-xijiang';
    document.getElementById('tbStat').innerHTML = '';
    document.getElementById('listingWrap').innerHTML =
      '<div style="text-align:center;color:#9aa5a1;padding:30px 16px;font-size:12px;line-height:1.8;">' +
      '该专题不存在或暂未上线<br/><a href="lvju-app-search.html?city=' + encodeURIComponent(CITY) +
      '" style="display:inline-block;margin-top:10px;padding:8px 22px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;font-weight:700;font-size:12.5px;">去找房枢纽</a></div>';
    return;
  }
  document.title = meta.label + ' · 找房专题 · 贝壳找房旅居';
  document.querySelector('#tbTitle small').textContent = meta.label;

  var dmap = {}, umap = {};

  function cardHtml(p){
    var d = dmap[p.district_id];
    var loc = (d && p.address && p.address.indexOf(d.name) === 0) ? p.address : [d ? d.name : '', p.address || ''].filter(Boolean).join(' · ');
    var fam = p.channel === 'newhouse' ? 'newhouse' : (p.channel === 'resale' ? 'resale' : 'stay');
    var badge = fam === 'stay' ? (p.is_featured ? '<span class="bdg feat">精选</span>' : '') : '<span class="bdg onsale">在售</span>';
    var fb = fam === 'newhouse' ? 's-city' : (fam === 'resale' ? 's-river' : 's-xijiang');
    var im = p.cover_image
      ? '<div class="im" style="background-image:url(' + esc(p.cover_image) + ')">' + badge
      : '<div class="im ' + fb + '">' + badge;
    im += '</div>';
    var r = p.rating || {};
    var meta2;
    if (fam === 'stay' && p.rating_status === 'passed' && r.stars) {
      meta2 = '<span class="sc">★' + esc(r.stars) + (r.score ? '.' + esc(String(r.score).slice(-1)) : '') + '</span>' +
        '<i>' + esc(channelChip(p)) + '</i><span>' + esc(loc) + '</span>';
    } else {
      var extra = (fam === 'newhouse' && p.managed_unit_count != null) ? ' · 房源 ' + fmt(p.managed_unit_count) : '';
      meta2 = '<span>' + esc(loc) + extra + '</span>';   // 频道已在标题行 .ch 呈现，不重复
    }
    var tags = (p.tags || []).filter(function(t){ return t !== '保租房' && t !== '演示' && t !== '精选'; }).slice(0, 3);
    var ins = fam === 'stay'
      ? (p.insurance_types || []).slice(0, 1).map(function(t){ return '<span class="am">' + (t.icon || '🛡') + ' ' + esc(t.short || t.label) + '</span>'; }).join('')
      : '';
    var tagHtml = tags.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + ins;

    var price, href, cta;
    if (fam === 'stay') {
      var pf = p.price_from;
      if (pf == null && p.channel === 'rental') {
        var rents = (umap[p.id] || []).map(function(u){ return u.rent_monthly; }).filter(function(v){ return v > 0; });
        if (rents.length) pf = Math.min.apply(null, rents);
      }
      price = pf != null ? '<i>¥</i><b>' + fmt(pf) + '</b><small>' + (p.channel === 'minsu' ? '/晚起' : '/月起') + '</small>' : '<span style="font-size:13px;">价格面议</span>';
      href = 'lvju-app-detail.html?id=' + p.id;
      cta = p.bookable ? '<span class="go">预订</span>' : '<span class="go tel">📞 咨询</span>';
    } else if (fam === 'newhouse') {
      price = p.price_total != null ? '<i>¥</i><b>' + fmt(p.price_total) + '</b><small>万起</small>'
        : (p.price_from != null ? '<i>¥</i><b>' + fmt(p.price_from) + '</b><small>/㎡起</small>' : '<span style="font-size:13px;">价格面议</span>');
      href = 'lvju-app-newhouse-detail.html?id=' + p.id;
      cta = '<span class="go">查看</span>';
    } else {
      var us = (umap[p.id] || []).slice().sort(function(a,b){ return (a.price_total||9e9) - (b.price_total||9e9); });
      var u0 = us[0];
      var total = (u0 && u0.price_total != null) ? u0.price_total : p.price_total;
      price = total != null ? '<i>¥</i><b>' + fmt(total) + '</b><small>万起</small>'
        : (p.price_from != null ? '<i>¥</i><b>' + fmt(p.price_from) + '</b><small>万起</small>' : '<span style="font-size:13px;">价格面议</span>');
      href = 'lvju-app-resale-detail.html?id=' + p.id + (u0 ? '&unit=' + u0.id : '');
      cta = '<span class="go">查看</span>';
    }
    return '<a class="lcard" href="' + href + '">' + im +
      '<div class="in"><div class="t"><span class="nm">' + esc(p.name) + '</span><span class="ch">' + esc(channelChip(p)) + '</span></div>' +
      '<div class="meta">' + meta2 + '</div>' +
      (tagHtml ? '<div class="tags">' + tagHtml + '</div>' : '') +
      '<div class="bt"><span class="pr">' + price + '</span>' + cta + '</div>' +
      '</div></a>';
  }

  // 去哪玩：同城市路线 + 景点（房源专题 ↔ 内容域挂接；数据源 routes/spots 公开接口）
  (function loadPlay(){
    var sec = document.getElementById('playSec');
    function done(rs){
      var routes = (rs[0] && rs[0].routes || []).slice(0, 4);
      var spots = (rs[1] && rs[1].spots || []).slice(0, 6);
      if (!routes.length && !spots.length) { sec.innerHTML = ''; return; }
      var html = '<div class="sec-h"><span class="bar"></span><h2>去哪玩</h2><span class="more">同城内容</span></div>';
      var cov = function(list){ for (var i = 0; i < list.length; i++) { if (list[i].cover_image) return 'background-image:url(' + esc(list[i].cover_image) + ')'; } return ''; };
      if (routes.length) {
        html += '<div class="playrow">' + routes.map(function(r){
          var stops = r.stops || [];
          return '<a href="lvju-app-routes.html?city=' + encodeURIComponent(CITY) + '"' +
            (r.cover_image ? ' style="background-image:url(' + esc(r.cover_image) + ')"' : (cov(stops) ? ' style="' + cov(stops) + '"' : '')) + '>' +
            '<span class="k">路线 · ' + r.days + ' 日</span><span class="pin">' + esc(r.name) + '</span></a>';
        }).join('') + '</div>';
      }
      if (spots.length) {
        html += '<div class="playrow">' + spots.map(function(s){
          return '<a href="lvju-app-spot-post.html?id=' + s.id + '"' +
            (s.cover_image ? ' style="background-image:url(' + esc(s.cover_image) + ')"' : '') + '>' +
            '<span class="k">' + esc(s.type_label || '玩法') + '</span><span class="pin">' + esc(s.name) + '</span></a>';
        }).join('') + '</div>';
      }
      sec.innerHTML = html;
    }
    Promise.all([
      fetch('/api/juzhu/routes?city=' + encodeURIComponent(CITY)).then(function(r){ return r.json(); }).catch(function(){ return {}; }),
      fetch('/api/juzhu/spots?city=' + encodeURIComponent(CITY) + '&type=scenic').then(function(r){ return r.json(); }).catch(function(){ return {}; })
    ]).then(done);
  })();

  fetch('/api/juzhu/catalog?topic=' + encodeURIComponent(SLUG) + '&city=' + encodeURIComponent(CITY))
    .then(function(r){ return r.json(); })
    .then(function(cat){
      if (cat.error) throw new Error(cat.error);
      dmap = {}; (cat.districts || []).forEach(function(d){ dmap[d.id] = d; });
      umap = {}; (cat.units || []).forEach(function(u){ (umap[u.project_id] = umap[u.project_id] || []).push(u); });
      var label = (cat.topic && cat.topic.label) || meta.label;
      document.getElementById('tbName').textContent = label;
      document.title = label + ' · 找房专题 · 贝壳找房旅居';
      var cityName = (cat.city && cat.city.name) || CITY;
      var ps = (cat.projects || []).slice()
        .sort(function(a,b){ return (b.is_featured||0) - (a.is_featured||0) || (a.featured_rank||999) - (b.featured_rank||999); });
      document.getElementById('tbStat').innerHTML =
        '<div><b>' + ps.length + '</b><span>套在架</span></div><div><b>' + esc(cityName) + '</b><span>所在城市</span></div>';
      var bgEl = document.getElementById('tbBg');
      var cov = '';
      for (var j = 0; j < ps.length; j++) { if (ps[j].cover_image) { cov = ps[j].cover_image; break; } }
      if (cov) { bgEl.className = 'bg'; bgEl.style.background = 'url(' + esc(cov) + ') center/cover no-repeat'; }
      else bgEl.className = 'bg ' + meta.fb;
      var wrap = document.getElementById('listingWrap');
      if (!ps.length) {
        wrap.innerHTML = '<div style="text-align:center;color:#9aa5a1;padding:30px 16px;font-size:12px;line-height:1.8;">' +
          '「' + esc(label) + '」当前城市暂无在架房源 · 可到找房枢纽切换城市<br/>' +
          '<a href="lvju-app-search.html?city=' + encodeURIComponent(CITY) +
          '" style="display:inline-block;margin-top:10px;padding:8px 22px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;font-weight:700;font-size:12.5px;">去找房枢纽</a></div>';
        return;
      }
      wrap.innerHTML = ps.map(cardHtml).join('');
    })
    .catch(function(){
      document.getElementById('listingWrap').innerHTML =
        '<div style="text-align:center;color:#b45309;padding:28px 0;font-size:12px;">无法连接新居住数据库 · 请稍后再试</div>';
    });
})();
</script>
</body>
</html>
