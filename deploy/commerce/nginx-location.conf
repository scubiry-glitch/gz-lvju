    # commerce-preview:begin
    # M1-A persistent commerce API; existing /api/ routes keep using port 8766.
    location ^~ /api/commerce/v1/ {
        proxy_pass http://127.0.0.1:38780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /commerce/ { return 404; }
    location ^~ /deploy/ { return 404; }
    # commerce-preview:end
