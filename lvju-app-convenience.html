<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>旅游便民 · 出行·向导 · 贝壳旅居·内容服务</title>
<link rel="stylesheet" href="lvju-app.css?v=7">
<style>
  /* 便民服务：白卡 2×4（不要青绿底） */
  .conv-svc{margin:0 0 14px;padding:0 12px;}
  .conv-svc-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  }
  .conv-tile{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 4px 10px;
    text-align:center;color:var(--ink);text-decoration:none;
  }
  .conv-tile .ic{
    width:36px;height:36px;margin:0 auto;border-radius:9px;overflow:hidden;
    display:block;
  }
  .conv-tile .ic img{width:100%;height:100%;display:block;object-fit:cover;}
  .conv-tile b{display:block;margin-top:6px;font-size:11px;font-weight:600;line-height:1.2;color:#222;}
  .conv-tile small{display:block;margin-top:3px;font-size:9px;line-height:1.2;color:#9aa5a1;}
  .banner .bi{background:transparent;padding:0;overflow:hidden;}
  .banner .bi img{width:100%;height:100%;display:block;object-fit:cover;}
</style>
</head>
<body>
<div class="app">
  <div class="scr">

    <div class="hero-sm">
      <div class="bg s-city"></div>
      <div class="in">
        <div class="ek">Travel Helpers</div>
        <h1>出门在外<br>有人接得住</h1>
        <p>出行、向导、票务、寄存、急救，旅居在贵州的一整套便民服务</p>
      </div>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>便民服务</h2></div>
    <div class="conv-svc">
      <div class="conv-svc-grid">
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-charter.png" alt=""></span>
          <b>包车出行</b><small>持证司导</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-guide.png" alt=""></span>
          <b>本地向导</b><small>认证向导</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-ticket.png" alt=""></span>
          <b>门票预订</b><small>免排队</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-luggage.png" alt=""></span>
          <b>行李寄存</b><small>就近网点</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-weather.png" alt=""></span>
          <b>天气预报</b><small>景区实况</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-medical.png" alt=""></span>
          <b>医疗急救</b><small>就近医院</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-translate.png" alt=""></span>
          <b>翻译助手</b><small>方言/外语</small>
        </a>
        <a class="conv-tile" href="#">
          <span class="ic"><img src="assets/lvju/icons/conv-charge.png" alt=""></span>
          <b>充电租赁</b><small>共享充电</small>
        </a>
      </div>
    </div>

    <div class="sec-h"><span class="bar"></span><h2>黔东南 · 今日实况</h2></div>
    <div class="panel">
      <div class="kv"><span class="k">天气 · 西江</span><span class="v">⛅ 多云 22℃ / 16℃</span></div>
      <div class="kv"><span class="k">景区人流</span><span class="v">🟢 舒适 · 适宜出行</span></div>
      <div class="kv"><span class="k">空气质量</span><span class="v">优 · AQI 38</span></div>
    </div>

    <div class="banner">
      <span class="bi"><img src="assets/lvju/icons/guide-bi.png" alt=""></span>
      <div class="bt"><b>贵州旅居服务热线</b><p>12301 · 投诉举报 / 咨询求助 7×24h</p></div>
      <a class="go" href="#">一键拨打 ›</a>
    </div>

  </div>

  <div id="tab-bar" data-series="lvju" data-active="spots"></div>
</div>
<script src="screens/_navmobile.js?v=3"></script>
</body>
</html>
