<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>支付 · 家政服务</title>
<link rel="stylesheet" href="jiazheng-app.css?v=2" />
</head>
<body>
<div class="jz-wrap">
  <div class="jz-top">
    <a class="jz-back" href="javascript:history.back()"></a>
    <span class="jz-title">支付订单</span>
    <div></div>
  </div>

  <div style="background:linear-gradient(135deg,#0f766e 0%,#0b5d56 100%);color:#fff;padding:36px 16px;text-align:center;">
    <div style="font-size:13px;opacity:.85;margin-bottom:4px;">应付金额</div>
    <div style="font-size:36px;font-weight:700;font-family:'Noto Serif SC',serif;" id="amount">¥0.00</div>
    <div style="font-size:11px;opacity:.7;margin-top:6px;" id="orderNo">订单号 --</div>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;">
    <div style="font-size:14px;font-weight:500;padding:14px 0 8px;border-bottom:1px solid var(--line);">选择支付方式</div>
    <label class="jz-form-row" style="cursor:pointer;">
      <span class="lb">💚 微信支付</span>
      <span class="vl" style="color:var(--muted);font-size:12px;">推荐</span>
      <input type="radio" name="pay" value="wechat" checked style="margin-left:8px;" />
    </label>
    <label class="jz-form-row" style="cursor:pointer;">
      <span class="lb">💙 支付宝</span>
      <span class="vl"></span>
      <input type="radio" name="pay" value="alipay" style="margin-left:8px;" />
    </label>
    <label class="jz-form-row" style="cursor:pointer;">
      <span class="lb">💜 余额 <span style="color:var(--muted);font-size:12px;">(¥0.00 不够)</span></span>
      <span class="vl"></span>
      <input type="radio" name="pay" value="balance" disabled style="margin-left:8px;" />
    </label>
    <label class="jz-form-row" style="cursor:pointer;">
      <span class="lb">💳 信用卡</span>
      <span class="vl"></span>
      <input type="radio" name="pay" value="card" style="margin-left:8px;" />
    </label>
  </div>

  <div style="background:var(--surface);padding:0 16px;margin-top:8px;">
    <div class="jz-form-row" style="cursor:pointer;">
      <span class="lb">使用优惠券</span>
      <span class="vl" style="color:var(--brand);">新用户立减 ¥10 ›</span>
    </div>
  </div>

  <div style="padding:14px 16px;font-size:12px;color:var(--muted);">
    · 支付即视为同意《服务协议》<br>
    · 订单将在支付完成后进入派单流程
  </div>

  <div class="jz-cta-bar">
    <a class="pri" href="javascript:;" id="payBtn" style="flex:2;">确认支付</a>
  </div>
</div>

<script src="jiazheng-data.js?v=6"></script>
<script>
var qs = new URLSearchParams(location.search);
var oid = qs.get('oid') || '';
JZ_DATA.getOrder(oid).then(function(order){
  if (!order || order.error) {
    document.querySelector('.jz-wrap').innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;">订单不存在</div>';
    return;
  }
  document.getElementById('amount').textContent = '¥' + order.fee.toFixed(1);
  document.getElementById('orderNo').textContent = '订单号 ' + order.id;

  document.getElementById('payBtn').addEventListener('click', function(){
    this.textContent = '支付中…';
    this.style.opacity = 0.7;
    setTimeout(function(){
      location.href = 'jiazheng-order.html?oid=' + oid;
    }, 800);
  });
}).catch(function(){
  document.querySelector('.jz-wrap').innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;">订单加载失败</div>';
});
</script>
</body>
</html>
