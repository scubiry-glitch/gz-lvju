<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>员工花名册 · 保租房 B 端</title>
  <style>
    :root {
      --bg: #f3f4f6; --surface: #ffffff; --fg: #111111;
      --muted: #6b7280; --border: #e5e7eb; --accent: #0f766e;
      --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
      --success: #16a34a; --warn: #ea580c; --danger: #dc2626; --gold:#ca8a04;
      --radius-sm: 6px; --radius-md: 10px;
      --font: system-ui, -apple-system, 'PingFang SC', sans-serif;
      --mono: ui-monospace, 'JetBrains Mono', monospace;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.5;}
    button{font:inherit; cursor:pointer; border:0; background:none; padding:0;}
    a{color:inherit; text-decoration:none;}

    .console{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}

    .main{padding:22px 28px 40px;}
    .topbar{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
    .topbar h1{font-size:22px; font-weight:600; margin:0; flex:1;}
    .topbar .btn{padding:7px 14px; border-radius:6px; font-size:13px; border:1px solid var(--border); background:var(--surface);}
    .topbar .btn.pri{background:var(--accent); color:white; border-color:var(--accent);}

    /* KPI */
    .kpi-row{display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; margin-bottom:18px;}
    .ki{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; position:relative;}
    .ki::before{content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; background:var(--accent); border-radius:0 2px 2px 0;}
    .ki.gold::before{background:var(--gold);}
    .ki.ok::before{background:var(--success);}
    .ki.warn::before{background:var(--warn);}
    .ki .l{font-size:11px; color:var(--muted); margin-left:8px;}
    .ki .n{font-size:20px; font-weight:700; margin:2px 0 0 8px; line-height:1.1;}
    .ki .n .u{font-size:11px; color:var(--muted); font-weight:400; margin-left:3px;}
    .ki .d{font-size:11px; color:var(--muted); margin-left:8px; margin-top:2px;}
    .ki .d.ok{color:var(--success);}

    /* level filter row */
    .lv-filter{display:flex; gap:6px; margin-bottom:14px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); align-items:center; flex-wrap:wrap;}
    .lv-filter .lbl{font-size:12px; color:var(--muted); margin-right:6px;}
    .lvc{padding:6px 14px; border-radius:6px; font-size:12.5px; background:var(--bg); cursor:pointer; border:1px solid transparent; display:flex; align-items:center; gap:6px;}
    .lvc.on{background:var(--accent); color:white; border-color:var(--accent); font-weight:600;}
    .lvc .ct{font-size:10px; padding:1px 6px; background:var(--surface); border-radius:8px; color:var(--muted); font-weight:600;}
    .lvc.on .ct{background:rgba(255,255,255,0.25); color:white;}
    .lvc .lv-dot{width:8px; height:8px; border-radius:50%;}
    .lvc[data-lv=L1] .lv-dot{background:#d97706;}
    .lvc[data-lv=L2] .lv-dot{background:#9ca3af;}
    .lvc[data-lv=L3] .lv-dot{background:#10b981;}
    .lvc[data-lv=L4] .lv-dot{background:#3b82f6;}
    .lv-filter .info{margin-left:auto; font-size:11px; color:var(--muted);}

    /* secondary filters */
    .filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
    .fc{padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer;}
    .fc.on{color:var(--accent); border-color:var(--accent);}
    .fc svg{width:11px; height:11px;}
    .fsel{padding:6px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12px; color:var(--muted); font-family:inherit; max-width:180px;}
    .search{flex:1; min-width:240px; padding:6px 12px; border-radius:6px; background:var(--surface); border:1px solid var(--border); font-size:12px; display:flex; align-items:center; gap:8px;}
    .search input{flex:1; border:0; background:transparent; outline:none; font-size:12px;}

    /* staff table */
    .table-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
    .staff-tbl{width:100%; border-collapse:collapse; font-size:13px;}
    .staff-tbl th, .staff-tbl td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--border);}
    .staff-tbl th{background:#f9fafb; font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;}
    .staff-tbl tr:hover td{background:#f9fafb;}
    .staff-tbl td .av{display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; margin-right:8px; vertical-align:middle;}
    .staff-tbl td .nm{font-weight:600; vertical-align:middle;}
    .staff-tbl td .id-line{font-size:11px; color:var(--muted); margin-top:1px; margin-left:40px;}
    .lv-badge{display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:700; color:white;}
    .lv-badge.L1{background:linear-gradient(135deg, #92400e, #d97706);}
    .lv-badge.L2{background:linear-gradient(135deg, #6b7280, #9ca3af);}
    .lv-badge.L3{background:linear-gradient(135deg, #047857, #10b981);}
    .lv-badge.L4{background:linear-gradient(135deg, #1e40af, #3b82f6);}
    .role-pill{font-size:11px; color:var(--muted); padding:2px 8px; background:var(--bg); border-radius:4px;}
    .stars{color:var(--gold); font-size:11px; letter-spacing:1px;}
    .stars .e{color:var(--border);}
    .progress-mini{display:inline-block; width:80px; height:5px; background:var(--bg); border-radius:3px; overflow:hidden; vertical-align:middle; margin-right:6px;}
    .progress-mini .fl{height:100%; background:var(--accent); border-radius:3px;}
    .progress-mini .fl.warn{background:var(--warn);}
    .progress-mini .fl.ok{background:var(--success);}
    .stat-pill{font-size:10px; padding:2px 7px; border-radius:3px; font-weight:600;}
    .stat-pill.on{background:color-mix(in oklab, var(--success) 14%, transparent); color:var(--success);}
    .stat-pill.off{background:color-mix(in oklab, var(--danger) 14%, transparent); color:var(--danger);}
    .stat-pill.train{background:color-mix(in oklab, var(--warn) 14%, transparent); color:var(--warn);}
    .stat-pill.leave{background:var(--bg); color:var(--muted);}
    .row-actions{font-size:11px; text-align:right; white-space:nowrap;}
    .row-actions a{color:var(--accent); margin-left:8px; cursor:pointer;}
    .row-actions a.danger{color:var(--danger);}
    .empty{padding:34px; text-align:center; color:var(--muted); font-size:13px;}

    /* footer */
    .table-foot{padding:12px 16px; background:#f9fafb; border-top:1px solid var(--border); display:flex; align-items:center; gap:12px; font-size:12px; color:var(--muted);}
    .table-foot .src{margin-left:auto; font-size:11px;}

    /* modal & toast（对齐 p-jz-worker 形态） */
    .modal{display:none; position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:50; align-items:center; justify-content:center;}
    .modal.show{display:flex;}
    .modal .box{background:var(--surface); border-radius:12px; padding:20px 22px; width:540px; max-width:94vw; max-height:88vh; overflow:auto;}
    .modal h4{margin:0 0 14px; font-size:16px;}
    .fld{margin-bottom:10px;}
    .fld label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px;}
    .fld input,.fld select{width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:var(--surface); color:inherit; box-sizing:border-box;}
    .fld input[type=checkbox]{width:auto;}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .btns{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
    .btns .btn{padding:7px 16px; border-radius:6px; font-size:13px; border:1px solid var(--border); background:var(--surface);}
    .btns .btn.pri{background:var(--accent); color:white; border-color:var(--accent);}
    .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); background:#111827; color:white; padding:9px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:60;}
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
    .toast.err{background:var(--danger);}
  </style>
</head>
<body>
<div class="console">
  <div id="side-nav" data-series="b" data-active="staff"></div>

  <main class="main">
    <div class="topbar">
      <h1>员工花名册</h1>
      <span id="subTitle" style="font-size:12px; color:var(--muted);">加载中…</span>
      <button class="btn" id="btnExport">导出名册</button>
      <button class="btn" id="btnNew">+ 邀请入职</button>
      <button class="btn pri" id="btnRecruit">+ 从平台招募</button>
    </div>

    <!-- KPI（客户端聚合，剔除停薪留职） -->
    <div class="kpi-row" id="kpis"></div>

    <!-- level quick filter -->
    <div class="lv-filter" id="lvFilter">
      <span class="lbl">等级</span>
      <span class="info">L0 未签约 · L5+ 走经营轨</span>
    </div>

    <div class="filter-row">
      <select class="fsel" id="fRole"><option value="">岗位（全部）</option></select>
      <select class="fsel" id="fStation"><option value="">驻点 / 项目（全部）</option></select>
      <select class="fsel" id="fStatus">
        <option value="">在岗状态（全部）</option>
        <option value="active">在岗</option>
        <option value="observe">观察期</option>
        <option value="train">培训中</option>
        <option value="leave">休假</option>
        <option value="off">停薪留职</option>
      </select>
      <span class="fc" id="fExpire">合同到期 ≤90 天</span>
      <span class="fc" id="fRating">客评 ≥ 4.7</span>
      <span class="fc" id="fExtra">本周可加单</span>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="fQ" placeholder="搜姓名 / 工号 / 手机后 4 位" />
      </div>
    </div>

    <!-- table -->
    <div class="table-card">
      <table class="staff-tbl">
        <thead>
          <tr>
            <th>员工</th>
            <th>等级</th>
            <th>岗位</th>
            <th>驻点</th>
            <th>本月单量</th>
            <th>客评</th>
            <th>合同</th>
            <th>状态</th>
            <th style="text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
      </table>
      <div class="table-foot">
        <span id="footCount">共 0 条</span>
        <span class="src">数据源 operator_staff · 实时</span>
      </div>
    </div>
  </main>
</div>

<!-- 新增 / 编辑 -->
<div class="modal" id="modal">
  <div class="box">
    <h4 id="modalTitle">邀请入职</h4>
    <input type="hidden" id="m_id" />
    <div class="grid2">
      <div class="fld"><label>姓名 *</label><input id="m_name" maxlength="20" /></div>
      <div class="fld"><label>工号（留空自动生成）</label><input id="m_emp" placeholder="EMP-YYYY-NNNN" /></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>手机号</label><input id="m_phone" maxlength="11" placeholder="11 位数字" /></div>
      <div class="fld"><label>等级</label>
        <select id="m_level">
          <option value="L1">L1 基础认证</option>
          <option value="L2" selected>L2 独立服役</option>
          <option value="L3">L3 高级管家</option>
          <option value="L4">L4 督导/店长</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="fld"><label>岗位</label><input id="m_role" list="dlRole" placeholder="如 旅居房管" /></div>
      <div class="fld"><label>驻点 / 项目</label><input id="m_station" list="dlStation" placeholder="如 梧桐公馆" /></div>
    </div>
    <datalist id="dlRole"></datalist>
    <datalist id="dlStation"></datalist>
    <div class="grid2">
      <div class="fld"><label>本月单量</label><input id="m_orders" type="number" min="0" max="9999" value="0" /></div>
      <div class="fld"><label>客评（0 = 无）</label><input id="m_rating" type="number" min="0" max="5" step="0.1" value="0" /></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>合同类型</label>
        <select id="m_ctype"><option value="正式" selected>正式</option><option value="试用">试用</option></select>
      </div>
      <div class="fld"><label>合同到期</label><input id="m_cend" type="month" /></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>状态</label>
        <select id="m_status">
          <option value="active" selected>在岗</option>
          <option value="observe">观察期</option>
          <option value="train">培训中</option>
          <option value="leave">休假</option>
          <option value="off">停薪留职</option>
        </select>
      </div>
      <div class="fld"><label style="margin-top:22px;"><input type="checkbox" id="m_extra" style="width:auto;margin-right:6px;" />本周可加单</label></div>
    </div>
    <div class="fld"><label>备注</label><input id="m_note" maxlength="100" placeholder="如：师傅带教中" /></div>
    <div class="btns">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn pri" id="mSave">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="_console-login.js"></script>
<script src="_region.js?v=2"></script>
<script src="_nav.js"></script>
<script>
(function(){
  'use strict';
  var LEVELS = ['L1','L2','L3','L4'];
  var STATUS_LABEL = { active:'在岗', observe:'观察期', train:'培训中', leave:'休假', off:'停薪留职' };
  var STATUS_PILL  = { active:'on',   observe:'train',   train:'train',   leave:'leave',  off:'off' };
  var CHIP_LABEL   = { ALL:'全部', L4:'L4 督导/店长', L3:'L3 高级管家', L2:'L2 独立服役', L1:'L1 基础认证' };
  var all = [], filtered = [];

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function maskPhone(p){ p=String(p||''); return /^\d{11}$/.test(p) ? p.slice(0,3)+'****'+p.slice(7) : (p||'无手机号'); }
  function toast(msg, kind){
    var t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||'');
    clearTimeout(t._tm); t._tm=setTimeout(function(){ t.className='toast'; }, 1800);
  }
  // 合同到期 ≤90 天（YYYY-MM 按月末计；已过期同样计入「到期」）
  function expiringSoon(w){
    if(!w.contract_end) return false;
    var p=String(w.contract_end).match(/^(\d{4})-(\d{2})$/);
    if(!p) return false;
    var end=new Date(Number(p[1]), Number(p[2]), 0, 23, 59, 59);
    return (end.getTime() - Date.now()) <= 90*864e5;
  }

  // ===== 数据 =====
  function load(){
    return fetch('/api/juzhu/staff').then(function(r){ return r.json(); }).then(function(d){
      all = d.list || [];
      fillSelects(); renderLevelChips(); renderKpis(); applyFilter();
      $('subTitle').textContent = '在册 ' + onDuty().length + ' 人 · L1-L4 调度池';
    }).catch(function(e){ toast('加载失败：'+e.message, 'err'); });
  }
  function onDuty(){ return all.filter(function(w){ return w.status !== 'off'; }); }

  function fillSelects(){
    var roles = {}, stations = {};
    all.forEach(function(w){ if(w.role) roles[w.role]=1; if(w.station) stations[w.station]=1; });
    fillOne($('fRole'), Object.keys(roles).sort(), '岗位（全部）');
    fillOne($('fStation'), Object.keys(stations).sort(), '驻点 / 项目（全部）');
    $('dlRole').innerHTML = Object.keys(roles).sort().map(function(v){ return '<option value="'+esc(v)+'">'; }).join('');
    $('dlStation').innerHTML = Object.keys(stations).sort().map(function(v){ return '<option value="'+esc(v)+'">'; }).join('');
  }
  function fillOne(sel, values, label){
    var cur = sel.value;
    sel.innerHTML = '<option value="">'+label+'</option>' + values.map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
    if (values.indexOf(cur) !== -1) sel.value = cur;
  }

  // ===== KPI（只统计 status≠off，保证与等级分布可加和） =====
  function renderKpis(){
    var act = onDuty();
    var cnt = function(lv){ return act.filter(function(w){ return w.level === lv; }).length; };
    var total = act.reduce(function(s,w){ return s + (Number(w.month_orders)||0); }, 0);
    var avg = act.length ? Math.round(total / act.length) : 0;
    var l1sub = act.filter(function(w){ return w.level==='L1' && (w.status==='train'||w.status==='observe'); }).length;
    var tiles = [
      { cls:'',            l:'在岗总数', n:act.length, u:'人', d:'L1-L4 调度池' },
      { cls:'gold',        l:'L4 督导/店长', n:cnt('L4'), u:'人', d:'管 5+ 团队' },
      { cls:'ok',          l:'L3 高级管家', n:cnt('L3'), u:'人', d:'复杂场景骨干' },
      { cls:'',            l:'L2 独立服役', n:cnt('L2'), u:'人', d:'基本盘' },
      { cls:'warn',        l:'L1 基础认证', n:cnt('L1'), u:'人', d: l1sub ? ('含 '+l1sub+' 培训/观察') : '在岗基线' },
      { cls:'',            l:'月均接单', n:avg, u:'/人', d:'在岗均值' },
    ];
    $('kpis').innerHTML = tiles.map(function(t){
      return '<div class="ki '+t.cls+'"><div class="l">'+t.l+'</div><div class="n">'+t.n+'<span class="u">'+t.u+'</span></div><div class="d">'+t.d+'</div></div>';
    }).join('');
  }

  function renderLevelChips(){
    var act = onDuty();
    var cnt = function(lv){ return act.filter(function(w){ return w.level === lv; }).length; };
    var cur = (document.querySelector('.lvc.on') || {}).dataset ? document.querySelector('.lvc.on').dataset.lv : 'ALL';
    var html = '<span class="lbl">等级</span>';
    ['ALL','L4','L3','L2','L1'].forEach(function(lv){
      var n = lv==='ALL' ? act.length : cnt(lv);
      html += '<span class="lvc'+(lv===cur?' on':'')+'" data-lv="'+lv+'">'+(lv==='ALL'?'':'<span class="lv-dot"></span>')+CHIP_LABEL[lv]+' <span class="ct">'+n+'</span></span>';
    });
    html += '<span class="info">L0 未签约 · L5+ 走经营轨</span>';
    $('lvFilter').innerHTML = html;
    document.querySelectorAll('.lvc').forEach(function(c){
      c.addEventListener('click', function(){
        document.querySelectorAll('.lvc').forEach(function(x){ x.classList.remove('on'); });
        c.classList.add('on');
        applyFilter();
      });
    });
  }

  // ===== 过滤 + 渲染 =====
  function applyFilter(){
    var lv = (document.querySelector('.lvc.on')||{dataset:{lv:'ALL'}}).dataset.lv;
    var role = $('fRole').value, station = $('fStation').value, status = $('fStatus').value;
    var exp = $('fExpire').classList.contains('on');
    var rat = $('fRating').classList.contains('on');
    var ext = $('fExtra').classList.contains('on');
    var q = $('fQ').value.trim().toLowerCase();
    var qDigits = /^\d+$/.test(q);
    filtered = all.filter(function(w){
      if (lv !== 'ALL' && w.level !== lv) return false;
      if (role && w.role !== role) return false;
      if (station && w.station !== station) return false;
      if (status && w.status !== status) return false;
      if (exp && !expiringSoon(w)) return false;
      if (rat && !(Number(w.rating) >= 4.7)) return false;
      if (ext && !Number(w.can_extra)) return false;
      if (q) {
        var hitName = (w.name||'').toLowerCase().indexOf(q) !== -1;
        var hitEmp = (w.emp_no||'').toLowerCase().indexOf(q) !== -1;
        var hitPhone = qDigits && /^\d{4}$/.test(q) && String(w.phone||'').slice(-4) === q;
        if (!hitName && !hitEmp && !hitPhone) return false;
      }
      return true;
    });
    render();
  }

  function starsHtml(rating){
    var r = Number(rating)||0;
    if (r <= 0) return '<span style="color:var(--muted);">—</span>';
    var full = Math.max(1, Math.min(5, Math.round(r)));
    var s = ''; for (var i=0;i<5;i++) s += (i<full ? '★' : '<span class="e">★</span>');
    return '<span class="stars">'+s+'</span> '+r.toFixed(2);
  }
  function ordersHtml(w){
    var n = Number(w.month_orders)||0;
    if (n <= 0) return '<span style="color:var(--muted);">—</span>';
    var cls = n < 40 ? ' warn' : '';
    var note = w.note ? '（'+esc(w.note)+'）' : '';
    return '<span class="progress-mini"><span class="fl'+cls+'" style="width:'+Math.min(100,n)+'%;"></span></span>'+n+' 单'+note;
  }
  function contractHtml(w){
    if (w.status === 'off') return '停薪留职';
    if (!w.contract_end) return '—';
    return (w.contract_type === '试用' ? '试用至 ' : '至 ') + esc(w.contract_end)
      + (w.contract_type === '试用' ? ' ⓘ' : '')
      + (expiringSoon(w) ? ' ⚠' : '');
  }
  function render(){
    var body = $('tbody');
    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="9" class="empty">无匹配员工</td></tr>';
    } else {
      body.innerHTML = filtered.map(function(w){
        var editData = esc(JSON.stringify(w));
        return '<tr>' +
          '<td><span class="av">'+esc((w.name||'?').charAt(0))+'</span><span class="nm">'+esc(w.name)+'</span>' +
            '<div class="id-line">'+esc(w.emp_no||'—')+' · '+maskPhone(w.phone)+'</div></td>' +
          '<td><span class="lv-badge '+esc(w.level)+'">'+esc(w.level)+'</span></td>' +
          '<td>'+(w.role?'<span class="role-pill">'+esc(w.role)+'</span>':'—')+'</td>' +
          '<td>'+esc(w.station||'—')+'</td>' +
          '<td>'+ordersHtml(w)+'</td>' +
          '<td>'+starsHtml(w.rating)+'</td>' +
          '<td>'+contractHtml(w)+'</td>' +
          '<td><span class="stat-pill '+STATUS_PILL[w.status]+'">'+STATUS_LABEL[w.status]+'</span></td>' +
          '<td class="row-actions"><a data-edit="'+editData+'">编辑</a><a class="danger" data-del="'+w.id+'" data-name="'+esc(w.name)+'">删除</a></td>' +
        '</tr>';
      }).join('');
    }
    $('footCount').textContent = '共 ' + all.length + ' 人 · 当前 ' + filtered.length + ' 条';
    bindRows();
  }
  function bindRows(){
    document.querySelectorAll('[data-edit]').forEach(function(a){
      a.addEventListener('click', function(){ openModal(JSON.parse(a.dataset.edit)); });
    });
    document.querySelectorAll('[data-del]').forEach(function(a){
      a.addEventListener('click', function(){
        if (!confirm('确认删除员工「'+a.dataset.name+'」？')) return;
        api('DELETE', '/api/juzhu/staff/'+a.dataset.del).then(function(d){
          if (d.ok) { toast('已删除', 'ok'); load(); } else { toast(d.error || '删除失败', 'err'); }
        });
      });
    });
  }

  // ===== 写接口 =====
  function api(method, url, body){
    return fetch(url, {
      method: method,
      headers: body ? {'Content-Type':'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then(function(r){ return r.json().catch(function(){ return {}; }); });
  }

  function openModal(w){
    $('modalTitle').textContent = w ? '编辑员工' : '邀请入职';
    $('m_id').value = w ? w.id : '';
    $('m_name').value = w ? w.name : '';
    $('m_emp').value = w ? (w.emp_no||'') : '';
    $('m_phone').value = w ? (w.phone||'') : '';
    $('m_level').value = w ? w.level : 'L2';
    $('m_role').value = w ? (w.role||'') : '';
    $('m_station').value = w ? (w.station||'') : '';
    $('m_orders').value = w ? (Number(w.month_orders)||0) : 0;
    $('m_rating').value = w ? (Number(w.rating)||0) : 0;
    $('m_ctype').value = w ? (w.contract_type||'正式') : '正式';
    $('m_cend').value = w ? (w.contract_end||'') : '';
    $('m_status').value = w ? w.status : 'active';
    $('m_extra').checked = !!(w && Number(w.can_extra));
    $('m_note').value = w ? (w.note||'') : '';
    $('modal').classList.add('show');
  }
  function closeModal(){ $('modal').classList.remove('show'); }

  function save(){
    var id = $('m_id').value;
    var body = {
      name: $('m_name').value.trim(),
      emp_no: $('m_emp').value.trim(),
      phone: $('m_phone').value.trim(),
      level: $('m_level').value,
      role: $('m_role').value.trim(),
      station: $('m_station').value.trim(),
      month_orders: parseInt($('m_orders').value, 10) || 0,
      rating: $('m_rating').value === '' ? 0 : Number($('m_rating').value),
      contract_type: $('m_ctype').value,
      contract_end: $('m_cend').value || null,
      status: $('m_status').value,
      can_extra: $('m_extra').checked ? 1 : 0,
      note: $('m_note').value.trim(),
    };
    if (!body.name) { toast('请输入姓名', 'err'); return; }
    var req = id ? api('PUT', '/api/juzhu/staff/'+id, body) : api('POST', '/api/juzhu/staff', body);
    req.then(function(d){
      if (d.ok) { toast(id ? '已保存' : '已入职', 'ok'); closeModal(); load(); }
      else { toast(d.message || d.error || '保存失败', 'err'); }
    });
  }

  // ===== 导出 CSV（BOM + 手机打码，导出当前过滤结果） =====
  function exportCsv(){
    var head = ['工号','姓名','手机号','等级','岗位','驻点','本月单量','客评','合同类型','合同到期','状态','本周可加单','备注'];
    var lines = filtered.map(function(w){
      return [w.emp_no||'', w.name, maskPhone(w.phone), w.level, w.role||'', w.station||'',
        Number(w.month_orders)||0, (Number(w.rating)||0) > 0 ? Number(w.rating).toFixed(2) : '',
        w.contract_type||'', w.status==='off' ? '' : (w.contract_end||''), STATUS_LABEL[w.status],
        Number(w.can_extra) ? '是' : '否', w.note||''];
    });
    var csv = '\uFEFF' + [head].concat(lines).map(function(r){
      return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = '员工花名册.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('已导出 '+filtered.length+' 条', 'ok');
  }

  // ===== 绑定 =====
  function bind(){
    $('btnExport').addEventListener('click', exportCsv);
    $('btnNew').addEventListener('click', function(){ openModal(null); });
    $('btnRecruit').addEventListener('click', function(){ toast('平台招募通道：试点验证后开放'); });
    $('mCancel').addEventListener('click', closeModal);
    $('mSave').addEventListener('click', save);
    $('modal').addEventListener('click', function(e){ if (e.target === $('modal')) closeModal(); });
    ['fRole','fStation','fStatus'].forEach(function(id){ $(id).addEventListener('change', applyFilter); });
    ['fExpire','fRating','fExtra'].forEach(function(id){ $(id).addEventListener('click', function(){ $(id).classList.toggle('on'); applyFilter(); }); });
    $('fQ').addEventListener('input', applyFilter);
  }

  BZF_CONSOLE.requireLogin({ hint: '员工花名册' }).then(function(){
    bind();
    load();
  }).catch(function(e){ toast('登录失效：' + (e && e.message || e), 'err'); });
})();
</script>
</body>
</html>
