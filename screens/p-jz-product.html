<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>商家 SKU（服务产品）· 运营商工作台</title>
<style>
  :root{--bg:#f8fafc;--surface:#fff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0;--line:#f1f5f9;--accent:#0f766e;--accent-soft:color-mix(in oklab,var(--accent) 10%,transparent);--ok:#16a34a;--warn:#ea580c;--danger:#dc2626;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;line-height:1.5;}
  .console{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
  .main{min-width:0;}
  .content{padding:20px 24px;display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .kpi{background:var(--line);border-radius:9px;padding:11px;text-align:center;}
  .kpi b{font-size:20px;display:block;}
  .kpi span{font-size:11px;color:var(--muted);}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .filter-row select,.filter-row input{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:12px;background:#fff;}
  .fc{padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;}
  .fc.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0;}
  .badge{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;cursor:pointer;}
  .b-on{background:#dcfce7;color:#15803d;}
  .b-off{background:#fee2e2;color:#b91c1c;}
  .b-sold{background:#fef3c7;color:#92400e;}
  .btn{font:inherit;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.danger{color:var(--danger);border-color:#fecaca;}
  .btn.sm{padding:3px 8px;font-size:11px;}
  .actions{display:flex;gap:6px;}
  .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:100;align-items:center;justify-content:center;}
  .modal.show{display:flex;}
  .modal .box{background:#fff;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow-y:auto;}
  .modal h4{margin:0 0 14px;font-size:15px;}
  .modal .fld{margin-bottom:10px;}
  .modal .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .modal .fld input,.modal .fld select,.modal .fld textarea{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:13px;}
  .modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;display:none;}
  .toast.show{display:block;}
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--ok);}
  .price{color:#dc2626;font-weight:600;}
  .vendor-link{color:var(--accent);font-weight:500;}
  .group{margin-bottom:18px;}
  .group h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;}
  .spu-tag{font-size:10px;padding:1px 7px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:600;}
  .spu-tag.none{background:var(--line);color:var(--muted);}
  .wk-mini{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);}
  .wk-mini b{color:var(--accent);}
  .spu-hint{font-size:11px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .wk-picker{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;}
  .wk-picker label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);cursor:pointer;padding:3px 4px;border-radius:6px;}
  .wk-picker label:hover{background:var(--line);}
  .wk-picker .lvl{font-size:9px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:4px;padding:0 4px;}
  .wk-picker .empty{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:center;padding:8px;}
</style>
</head>
<body>
<div class="console">
  <div id="side-nav" data-series="b" data-active="jz-product"></div>
  <main class="main">
    <div class="top">
      <div class="crumb">控制台 / × B 运营商工作台 / <b>商家 SKU（服务产品）</b></div>
      <div class="top-actions">
        <button class="btn pri" id="btnNew">+ 新增 SKU</button>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <h3>产品概览 <span class="pill">B 端</span></h3>
        <div class="kpis" id="kpis"></div>
      </div>

      <div class="card">
        <h3>产品列表 <span class="pill" id="count">0</span></h3>
        <div class="filter-row">
          <select id="f_type">
            <option value="">全部类目</option>
            <option value="cleaning">保洁</option>
            <option value="repair">维修</option>
            <option value="moving">搬家</option>
            <option value="nanny">月嫂</option>
          </select>
          <select id="f_status">
            <option value="">全部状态</option>
            <option value="on">上架</option>
            <option value="off">下架</option>
            <option value="sold_out">售罄</option>
          </select>
          <select id="f_vendor">
            <option value="">全部商家</option>
          </select>
          <select id="f_city">
            <option value="">全部城市</option>
          </select>
          <input type="text" id="f_q" placeholder="搜索产品名..." style="flex:1;min-width:160px;" />
          <span class="muted" style="font-size:11px;">共 <b id="matched">0</b> 条</span>
        </div>
        <div id="list" style="max-height:60vh;overflow-y:auto;"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h4 id="modalTitle">新增 SKU</h4>
    <input type="hidden" id="m_id" />
    <div class="spu-hint">SKU = 平台 <b>SPU</b> + 本店<b>服务者</b> + 价格。先选商家和引用的 SPU，再勾选上门服务者。</div>
    <div class="grid">
      <div class="fld">
        <label>所属商家 *</label>
        <select id="m_vendor" required></select>
      </div>
      <div class="fld">
        <label>所属城市 *</label>
        <select id="m_city" required></select>
      </div>
      <div class="fld">
        <label>引用 SPU（平台标准品）*</label>
        <select id="m_spu" required><option value="">-- 选择 SPU --</option></select>
      </div>
    </div>
    <div class="grid">
      <div class="fld">
        <label>小程序路径 path *</label>
        <input type="text" id="m_path" placeholder="如：pages/service/detail" maxlength="200" required />
      </div>
      <div class="fld">
        <label>小程序参数 query *</label>
        <input type="text" id="m_query" placeholder="如：id=123&type=clean" maxlength="200" required />
      </div>
    </div>
    <div class="fld">
      <label>服务子类目</label>
      <input type="text" id="m_category" placeholder="如：日常保洁" />
    </div>
    <div class="fld">
      <label>产品标题 *</label>
      <input type="text" id="m_title" placeholder="如：日常保洁 2小时" maxlength="60" />
    </div>
    <div class="fld">
      <label>副标题</label>
      <input type="text" id="m_subtitle" placeholder="如：上门除尘 · 死无死角" maxlength="80" />
    </div>
    <div class="grid">
      <div class="fld">
        <label>服务时长（小时）</label>
        <input type="number" id="m_duration" step="0.5" min="0" value="2" />
      </div>
      <div class="fld">
        <label>面积范围</label>
        <input type="text" id="m_area" placeholder="≤50㎡" />
      </div>
    </div>
    <div class="grid">
      <div class="fld">
        <label>现价（元）*</label>
        <input type="number" id="m_price" step="0.01" min="0" value="79.8" required />
      </div>
      <div class="fld">
        <label>原价（元）</label>
        <input type="number" id="m_orig" step="0.01" min="0" placeholder="如 200" />
      </div>
    </div>
    <div class="grid">
      <div class="fld">
        <label>销量</label>
        <input type="number" id="m_sales" min="0" value="0" />
      </div>
      <div class="fld">
        <label>评分（0-5）</label>
        <input type="number" id="m_rating" step="0.1" min="0" max="5" value="4.7" />
      </div>
    </div>
    <div class="grid">
      <div class="fld">
        <label>排序</label>
        <input type="number" id="m_sort" min="0" value="99" />
      </div>
      <div class="fld">
        <label>状态</label>
        <select id="m_status">
          <option value="on">上架</option>
          <option value="off">下架</option>
          <option value="sold_out">售罄</option>
        </select>
      </div>
    </div>
    <div class="fld">
      <label>本店服务者（勾选可上门此 SKU 的服务者）</label>
      <div class="wk-picker" id="m_workers"><div class="empty">请先选择商家</div></div>
    </div>
    <div class="btns">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn pri" id="mSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="_region.js?v=2"></script>
<script src="_nav.js"></script>
<script>
// 管理台写接口已启用鉴权：自动给本页所有 /api/juzhu/jz/* 请求附带 API Key
// （须事先 localStorage.setItem('JUZHU_API_KEY', '<密钥>')；禁止内嵌历史默认密钥）。
(function(){
  var KEY = (window.localStorage && localStorage.getItem('JUZHU_API_KEY')) || '';
  var _fetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    init = init || {};
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/api/juzhu/jz') !== -1) {
      var h = Object.assign({}, init.headers);
      if (!h['X-API-Key']) h['X-API-Key'] = KEY;
      init.headers = h;
    }
    return _fetch(input, init);
  };
})();
</script>
<script>
(function(){
  const TYPE_LABELS = {cleaning:'保洁', repair:'维修', moving:'搬家', nanny:'月嫂'};
  const STATUS_LABELS = {on:'上架', off:'下架', sold_out:'售罄'};
  const $ = id => document.getElementById(id);
  const toast = (msg, kind) => {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast show ' + (kind||'');
    setTimeout(()=>t.className='toast', 1800);
  };

  let allProducts = [];
  let allVendors = [];
  let allSpu = [];
  let allWorkers = [];
  let allCities = [];

  async function load() {
    const [pr, vr, sr, wr, cr] = await Promise.all([
      fetch('/api/juzhu/jz/products').then(r=>r.json()),
      fetch('/api/juzhu/jz/vendors').then(r=>r.json()),
      fetch('/api/juzhu/jz/spu').then(r=>r.json()),
      fetch('/api/juzhu/jz/workers?all=1').then(r=>r.json()),
      fetch('/api/juzhu/cities').then(r=>r.json()),
    ]);
    allProducts = pr.list;
    allVendors = vr.list;
    allSpu = sr.list || [];
    allWorkers = wr.list || [];
    allCities = Array.isArray(cr) ? cr : [];
    // 商家下拉
    $('f_vendor').innerHTML = '<option value="">全部商家</option>' +
      allVendors.map(v => `<option value="${v.id}">${v.name}（${TYPE_LABELS[v.type]||v.type}）</option>`).join('');
    $('m_vendor').innerHTML = '<option value="">-- 选择商家 --</option>' +
      allVendors.map(v => `<option value="${v.id}">${v.name}（${TYPE_LABELS[v.type]||v.type}）</option>`).join('');
    // 城市筛选下拉（cities 表数据）
    $('f_city').innerHTML = '<option value="">全部城市</option>' +
      allCities.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    fillCityOptions('');
    applyFilter();
  }

  // 表单城市下拉：选商家后联动为该商家 city_ids 中的城市；未选商家时显示全部城市
  function fillCityOptions(vendorId) {
    const v = allVendors.find(x => String(x.id) === String(vendorId));
    const ids = v ? String(v.city_ids||'').split(',').filter(Boolean) : [];
    const opts = ids.length
      ? allCities.filter(c => ids.includes(String(c.id)))
      : allCities;
    $('m_city').innerHTML = '<option value="">-- 选择城市 --</option>' +
      opts.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  // SPU 下拉：全量展示，按类目 optgroup 分组（跨类目商品可正常回显/选择）
  function fillSpuOptions() {
    const groups = {};
    allSpu.forEach(s => { (groups[s.category_id] = groups[s.category_id]||[]).push(s); });
    $('m_spu').innerHTML = '<option value="">-- 不关联 SPU --</option>' +
      ['cleaning','repair','moving','nanny'].map(t => {
        const list = groups[t] || [];
        if (!list.length) return '';
        return `<optgroup label="${TYPE_LABELS[t]||t}">` +
          list.map(s => `<option value="${s.id}" data-name="${s.name}" data-cat="${s.category_name||''}" data-price="${s.price_from||0}" data-dur="${s.duration_min||0}">${s.name}（¥${s.price_from||0}）</option>`).join('') +
          '</optgroup>';
      }).join('');
  }

  // 渲染本店服务者勾选框
  function renderWorkerPicker(vendorId, checkedIds) {
    const wrap = $('m_workers');
    const ws = allWorkers.filter(w => String(w.vendor_id) === String(vendorId));
    if (!vendorId) { wrap.innerHTML = '<div class="empty">请先选择商家</div>'; return; }
    if (!ws.length) { wrap.innerHTML = '<div class="empty">该商家暂无服务者，请先在「服务者管理」添加</div>'; return; }
    const set = new Set((checkedIds||[]).map(String));
    wrap.innerHTML = ws.map(w =>
      `<label><input type="checkbox" value="${w.id}" ${set.has(String(w.id))?'checked':''}/> ${w.name} <span class="lvl">${w.level||'L3'}</span></label>`
    ).join('');
  }

  function applyFilter() {
    const t = $('f_type').value;
    const s = $('f_status').value;
    const v = $('f_vendor').value;
    const cid = $('f_city').value;
    const q = $('f_q').value.trim().toLowerCase();
    let list = allProducts.filter(p => {
      if (t && p.product_category !== t) return false;
      if (s && p.status !== s) return false;
      if (v && p.vendor_id != v) return false;
      if (cid && String(p.city_id) !== cid) return false;
      if (q && !p.title.toLowerCase().includes(q)) return false;
      return true;
    });
    render(list);
  }

  function render(list) {
    $('count').textContent = allProducts.length;
    $('matched').textContent = list.length;
    // KPI
    const byType = {};
    list.forEach(p => byType[p.product_category] = (byType[p.product_category]||0) + 1);
    $('kpis').innerHTML = Object.keys(TYPE_LABELS).map(t =>
      `<div class="kpi"><b>${byType[t]||0}</b><span>${TYPE_LABELS[t]}</span></div>`
    ).join('') + `<div class="kpi"><b>¥${list.reduce((s,p)=>s+(p.price||0),0).toFixed(0)}</b><span>总价</span></div>`;

    if (!list.length) { $('list').innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;">无匹配产品</p>'; return; }
    // 按类目分组
    const groups = {};
    list.forEach(p => { (groups[p.product_category] = groups[p.product_category]||[]).push(p); });
    let html = '';
    ['cleaning','repair','moving','nanny'].forEach(t => {
      if (!groups[t] || !groups[t].length) return;
      html += `<div class="group"><h4>${TYPE_LABELS[t]}（${groups[t].length}）</h4><table>`;
      html += '<thead><tr><th>SKU</th><th>商家</th><th>城市</th><th>引用 SPU</th><th>服务者</th><th>价格</th><th>状态</th><th>操作</th></tr></thead><tbody>';
      groups[t].forEach(p => {
        const badgeClass = p.status==='on'?'b-on':(p.status==='sold_out'?'b-sold':'b-off');
        const wkCount = (p.worker_ids||[]).length;
        html += `<tr>
          <td>
            <b>${p.title}</b>
            ${p.subtitle?`<div style="font-size:11px;color:var(--muted);">${p.subtitle}</div>`:''}
            ${p.category?`<span class="muted" style="font-size:10px;">[${p.category}]</span>`:''}
          </td>
          <td><span class="vendor-link">${p.vendor_name||'—'}</span></td>
          <td>${p.city_name||'—'}</td>
          <td>${p.spu_name?`<span class="spu-tag">${p.spu_name}</span>`:'<span class="spu-tag none">未关联</span>'}</td>
          <td><span class="wk-mini">👤 <b>${wkCount}</b> 人</span></td>
          <td><span class="price">¥${p.price}</span>${p.original_price?` <span class="muted" style="text-decoration:line-through;font-size:10px;">¥${p.original_price}</span>`:''}</td>
          <td><span class="badge ${badgeClass}" data-id="${p.id}" data-status="${p.status}">${STATUS_LABELS[p.status]||p.status}</span></td>
          <td class="actions">
            <button class="btn sm" data-edit='${JSON.stringify(p).replace(/'/g,"&#39;")}'>编辑</button>
            <button class="btn sm danger" data-del="${p.id}" data-name="${p.title}">删除</button>
          </td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    });
    $('list').innerHTML = html;

    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openModal(JSON.parse(b.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del, b.dataset.name));
    document.querySelectorAll('.badge[data-id]').forEach(b => b.onclick = () => toggle(b.dataset.id, b.dataset.status));
  }

  function openModal(p) {
    $('m_id').value = p ? p.id : '';
    $('modalTitle').textContent = p ? '编辑 SKU' : '新增 SKU';
    $('m_vendor').value = p ? p.vendor_id : '';
    fillCityOptions(p ? p.vendor_id : '');
    $('m_city').value = p && p.city_id ? String(p.city_id) : '';
    $('m_category').value = p ? (p.category||'') : '';
    $('m_title').value = p ? p.title : '';
    $('m_subtitle').value = p ? (p.subtitle||'') : '';
    $('m_duration').value = p ? (p.duration_hours||0) : 2;
    $('m_area').value = p ? (p.area_range||'') : '';
    $('m_price').value = p ? p.price : 79.8;
    $('m_orig').value = p ? (p.original_price||'') : '';
    $('m_sales').value = p ? (p.sales_count||0) : 0;
    $('m_rating').value = p ? (p.rating||0) : 4.7;
    $('m_sort').value = p ? (p.sort_order||99) : 99;
    $('m_status').value = p ? p.status : 'on';
    // SPU + 服务者
    fillSpuOptions();
    $('m_spu').value = p && p.channel_sku_id ? String(p.channel_sku_id) : '';
    $('m_path').value = p ? (p.path||'') : '';
    $('m_query').value = p ? (p.query||'') : '';
    renderWorkerPicker(p ? p.vendor_id : '', p ? (p.worker_ids||[]) : []);
    $('modal').classList.add('show');
  }
  function closeModal() { $('modal').classList.remove('show'); }
  $('btnNew').onclick = () => openModal(null);
  $('mCancel').onclick = closeModal;
  $('modal').onclick = e => { if (e.target.id==='modal') closeModal(); };

  // 选商家 → 城市下拉联动 + 全量 SPU 下拉 + 刷新本店服务者
  $('m_vendor').onchange = () => {
    const vid = $('m_vendor').value;
    fillCityOptions(vid);
    fillSpuOptions();
    $('m_spu').value = '';
    renderWorkerPicker(vid, []);
  };
  // 选 SPU → 回填 类目 / 价格 / 时长（标题为空时也带入）
  $('m_spu').onchange = () => {
    const opt = $('m_spu').selectedOptions[0];
    if (!opt || !opt.value) return;
    if (opt.dataset.cat) $('m_category').value = opt.dataset.cat;
    if (opt.dataset.price && !$('m_price').value) $('m_price').value = opt.dataset.price;
    if (!$('m_title').value) $('m_title').value = opt.dataset.name || '';
    if (opt.dataset.dur) $('m_duration').value = (parseInt(opt.dataset.dur)/60).toFixed(1).replace(/\.0$/,'');
  };

  ['f_type','f_status','f_vendor','f_city'].forEach(id => $(id).onchange = applyFilter);
  $('f_q').oninput = applyFilter;

  $('mSave').onclick = async () => {
    const body = {
      vendor_id: parseInt($('m_vendor').value),
      city_id: parseInt($('m_city').value) || null,
      category: $('m_category').value.trim(),
      title: $('m_title').value.trim(),
      subtitle: $('m_subtitle').value.trim(),
      duration_hours: parseFloat($('m_duration').value)||0,
      area_range: $('m_area').value.trim(),
      price: parseFloat($('m_price').value)||0,
      original_price: $('m_orig').value ? parseFloat($('m_orig').value) : null,
      sales_count: parseInt($('m_sales').value)||0,
      rating: parseFloat($('m_rating').value)||0,
      sort_order: parseInt($('m_sort').value)||99,
      status: $('m_status').value,
      channel_sku_id: $('m_spu').value ? parseInt($('m_spu').value) : null,
      path: $('m_path').value.trim(),
      query: $('m_query').value.trim(),
      worker_ids: [...document.querySelectorAll('#m_workers input:checked')].map(x => parseInt(x.value)),
    };
    if (!body.vendor_id) { toast('请选择商家', 'err'); return; }
    if (!body.city_id) { toast('请选择城市', 'err'); return; }
    if (!body.title) { toast('请输入 SKU 标题', 'err'); return; }
    if (!body.channel_sku_id) { toast('请选择引用 SPU', 'err'); return; }
    if (!body.path) { toast('请输入小程序路径 path', 'err'); return; }
    if (!body.query) { toast('请输入小程序参数 query', 'err'); return; }
    const id = $('m_id').value;
    const url = id ? '/api/juzhu/jz/products/'+id : '/api/juzhu/jz/products';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (d.ok) { toast(id?'已更新':'已新增', 'ok'); closeModal(); load(); }
    else toast(d.error||'保存失败', 'err');
  };

  async function del(id, name) {
    if (!confirm('确认删除产品「'+name+'」？')) return;
    const r = await fetch('/api/juzhu/jz/products/'+id, {method:'DELETE'});
    const d = await r.json();
    if (d.ok) { toast('已删除', 'ok'); load(); }
    else toast(d.error||'删除失败', 'err');
  }

  async function toggle(id, cur) {
    const next = cur === 'on' ? 'off' : 'on';
    const r = await fetch('/api/juzhu/jz/products/'+id, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status: next})
    });
    const d = await r.json();
    if (d.ok) { toast(next==='on'?'已上架':'已下架', 'ok'); load(); }
    else toast('操作失败', 'err');
  }

  load();
})();
</script>
</body>
</html>
