<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>服务订单概览 · 服务认证中台</title>
<style>
  :root{--bg:#f8fafc;--surface:#fff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0;--line:#f1f5f9;--accent:#6366f1;--accent-soft:color-mix(in oklab,var(--accent) 10%,transparent);--ok:#16a34a;--warn:#ea580c;--danger:#dc2626;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;line-height:1.5;}
  .console{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
  .main{min-width:0;}
  .content{padding:20px 24px;display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;}
  .btn{font:inherit;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* funnel */
  .funnel{margin-top:12px;}
  .funnel-row{display:flex;align-items:center;margin-bottom:8px;gap:10px;}
  .funnel-label{width:72px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;}
  .funnel-bar{height:28px;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#fff;min-width:36px;transition:width .3s;}
  .funnel-count{font-size:12px;color:var(--muted);width:40px;flex-shrink:0;}
  .funnel-total{font-size:12px;color:var(--muted);margin-top:4px;text-align:center;}

  /* filters */
  .filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .filter-bar label{display:flex;align-items:center;gap:6px;}
  .filter-bar select,.filter-bar input[type=date]{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--fg);}
  .filter-bar .range-group{display:flex;gap:4px;}
  .filter-bar .range-group .btn{font-size:11px;padding:4px 10px;}
  .filter-bar .range-group .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filter-bar .sep{width:1px;height:20px;background:var(--border);}

  /* chart controls */
  .chart-ctl{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .chart-ctl .dim-group{display:flex;gap:4px;}
  .chart-ctl .dim-group .btn{font-size:11px;padding:4px 10px;}
  .chart-ctl .dim-group .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-ctl .status-group{display:flex;gap:4px;flex-wrap:wrap;}
  .chart-ctl .status-group .btn{font-size:11px;padding:4px 10px;}
  .chart-ctl .status-group .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-ctl .sep{width:1px;height:20px;background:var(--border);}

  /* canvas */
  .chart-wrap{position:relative;width:100%;}
  .chart-wrap canvas{display:block;width:100%;}

  .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;display:none;}
  .toast.show{display:block;}
  .toast.err{background:var(--danger);}
</style>
</head>
<body>
<div class="console">
  <div id="side-nav" data-series="p" data-active="jz-order-overview"></div>
  <main class="main">
    <div class="top">
      <div class="crumb">控制台 / × P 服务认证中台 / 居住服务 · 本地生活 / <b>服务订单概览</b></div>
    </div>
    <div class="content">

      <div class="card">
        <h3>筛选</h3>
        <div class="filter-bar">
          <label>城市 <select id="fCity"><option value="">全部城市</option></select></label>
          <label>商家 <select id="fVendor"><option value="">全部商家</option></select></label>
          <span class="sep"></span>
          <div class="range-group" id="rangeBtns">
            <button class="btn on" data-range="today">今日</button>
            <button class="btn" data-range="7d">近7天</button>
            <button class="btn" data-range="15d">近15天</button>
            <button class="btn" data-range="30d">近30天</button>
            <button class="btn" data-range="month">本月</button>
          </div>
          <span class="sep"></span>
          <label>自定义 <input type="date" id="fStart"> ~ <input type="date" id="fEnd"></label>
          <button class="btn" id="fReset">重置</button>
        </div>
      </div>

      <div class="card">
        <h3>订单状态漏斗 <span class="pill">实时</span></h3>
        <div id="funnelDate" style="font-size:12px;color:var(--muted);margin-bottom:4px;"></div>
        <div class="funnel" id="funnel"></div>
      </div>

      <div class="card">
        <h3>订单趋势 <span class="pill">折线图</span></h3>
        <div class="chart-ctl">
          <span style="font-size:12px;color:var(--muted);">维度</span>
          <div class="dim-group">
            <button class="btn on" data-dim="daily">按日</button>
            <button class="btn" data-dim="monthly">按月</button>
          </div>
          <span class="sep"></span>
          <span style="font-size:12px;color:var(--muted);">状态</span>
          <div class="status-group" id="statusBtns"></div>
        </div>
        <div class="chart-wrap"><canvas id="chart" height="300"></canvas></div>
      </div>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="_console-login.js"></script>
<script src="_nav.js"></script>
<script>
// 管理台接口须 API Key：自动给本页所有 /api/juzhu/jz/* 请求附带密钥
// （须事先 localStorage.setItem('JUZHU_API_KEY', '<密钥>')；禁止内嵌历史默认密钥）。
(function(){
  var KEY = (window.localStorage && localStorage.getItem('JUZHU_API_KEY')) || '';
  var _fetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    init = init || {};
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/api/juzhu/jz') !== -1) {
      var h = Object.assign({}, init.headers);
      if (!h['X-API-Key']) h['X-API-Key'] = KEY;
      init.headers = h;
    }
    return _fetch(input, init);
  };
})();
</script>
<script>
(function(){
  const STATUS_MAP = {
    pending:'待支付', paid:'已支付', assigned:'已派单',
    serving:'服务中', completed:'已完成', cancelled:'已取消'
  };
  const STATUS_ORDER = ['pending','paid','assigned','serving','completed','cancelled'];
  const FUNNEL_COLORS = ['#6366f1','#818cf8','#a5b4fc','#93c5fd','#6ee7b7','#fca5a5'];

  const $ = id => document.getElementById(id);
  const toast = (msg, kind) => {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast show ' + (kind||'');
    setTimeout(()=>t.className='toast', 1800);
  };

  let data = null;
  let curDim = 'daily';
  let curStatus = 'pending';

  // 筛选状态（start/end 空 = 默认今日，由服务端兜底）
  const state = { city:'', vendor:'', start:'', end:'' };

  function todayCst() { return new Date(Date.now() + 8*3600*1000).toISOString().slice(0,10); } // 北京日期，与服务端分桶同口径
  function shiftCst(n) { return new Date(Date.now() + 8*3600*1000 + n*86400000).toISOString().slice(0,10); }

  function presetRange(key) {
    const today = todayCst();
    if (key === '7d') return { start: shiftCst(-6), end: today };
    if (key === '15d') return { start: shiftCst(-14), end: today };
    if (key === '30d') return { start: shiftCst(-29), end: today };
    if (key === 'month') return { start: today.slice(0,8) + '01', end: today };
    return { start: today, end: today }; // today
  }

  function queryStr() {
    const parts = [];
    if (state.city) parts.push('city=' + encodeURIComponent(state.city));
    if (state.vendor) parts.push('vendor_id=' + encodeURIComponent(state.vendor));
    if (state.start && state.end) parts.push('start=' + state.start + '&end=' + state.end);
    return parts.length ? '?' + parts.join('&') : '';
  }

  function fillSelect(sel, items) {
    const cur = sel.value;
    const first = sel.querySelector('option');
    sel.innerHTML = '';
    sel.appendChild(first);
    items.forEach(it => {
      const o = document.createElement('option');
      if (typeof it === 'string') { o.value = it; o.textContent = it; }
      else { o.value = it.v; o.textContent = it.t; }
      sel.appendChild(o);
    });
    // 保留当前选择；当前值已不在可选项里（如数据变化）则回落到全部
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  }

  function fillFilterOptions(opts) {
    if (!opts) return;
    fillSelect($('fCity'), opts.cities || []);
    fillSelect($('fVendor'), (opts.vendors || []).map(v => ({ v: String(v.id), t: v.name || ('商家#' + v.id) })));
  }

  async function load() {
    try {
      const r = await fetch('/api/juzhu/jz/orders/overview' + queryStr());
      if (!r.ok) throw new Error('HTTP '+r.status);
      data = await r.json();
      fillFilterOptions(data.filter_options);
      renderFunnel(data.funnel, data.range);
      renderChart();
    } catch(e) {
      $('funnel').innerHTML = '<div class="loading">加载失败：'+e.message+'</div>';
    }
  }

  function renderFunnel(funnel, range) {
    const r = range || {};
    $('funnelDate').textContent = !r.end || r.start === r.end
      ? '日期：' + (r.start || todayCst())
      : '区间：' + r.start + ' ~ ' + r.end;

    const vals = STATUS_ORDER.map(s => funnel[s]||0);
    const max = Math.max(...vals, 1);
    const total = vals.reduce((a,b)=>a+b,0);

    let html = '';
    STATUS_ORDER.forEach((s, i) => {
      const v = vals[i];
      const pct = max > 0 ? Math.max((v/max)*100, 4) : 0;
      html += `<div class="funnel-row">
        <span class="funnel-label">${STATUS_MAP[s]}</span>
        <div class="funnel-bar" style="width:${pct}%;background:${FUNNEL_COLORS[i]}">${v>0?v:''}</div>
        <span class="funnel-count">${v}</span>
      </div>`;
    });
    html += `<div class="funnel-total">共 ${total} 单</div>`;
    $('funnel').innerHTML = html;
  }

  function renderChart() {
    if (!data) return;
    const list = curDim === 'daily' ? data.daily : data.monthly;
    const key = curDim === 'daily' ? 'date' : 'month';
    const labels = list.map(r => {
      const v = r[key];
      return curDim === 'daily' ? v.slice(5) : v; // MM-DD or YYYY-MM
    });
    const values = list.map(r => r[curStatus]||0);

    const canvas = $('chart');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.parentElement.clientWidth;
    const H = 300;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const pad = {top:20, right:20, bottom:40, left:44};
    const pw = W - pad.left - pad.right;
    const ph = H - pad.top - pad.bottom;

    ctx.clearRect(0, 0, W, H);

    // grid & Y axis
    const maxY = Math.max(...values, 1);
    const ySteps = 5;
    const yStep = Math.ceil(maxY / ySteps) || 1;
    const yMax = yStep * ySteps;

    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#64748b';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    for (let i = 0; i <= ySteps; i++) {
      const y = pad.top + ph - (i / ySteps) * ph;
      const val = i * yStep;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillText(val, pad.left - 8, y + 4);
    }

    // X labels（桶多时抽稀，最多约 14 个）
    ctx.textAlign = 'center';
    ctx.fillStyle = '#64748b';
    const xStep = pw / Math.max(labels.length - 1, 1);
    const labelStep = Math.ceil(labels.length / 14);
    labels.forEach((l, i) => {
      if (i % labelStep !== 0 && i !== labels.length - 1) return;
      const x = pad.left + i * xStep;
      ctx.fillText(l, x, H - pad.bottom + 16);
    });

    // line
    if (values.length < 2) return;
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    values.forEach((v, i) => {
      const x = pad.left + i * xStep;
      const y = pad.top + ph - (v / yMax) * ph;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // dots
    ctx.fillStyle = '#6366f1';
    values.forEach((v, i) => {
      if (v === 0) return;
      const x = pad.left + i * xStep;
      const y = pad.top + ph - (v / yMax) * ph;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#6366f1';
    });
  }

  // init status buttons
  (function(){
    let html = '';
    STATUS_ORDER.forEach((s,i) => {
      html += `<button class="btn${s===curStatus?' on':''}" data-status="${s}">${STATUS_MAP[s]}</button>`;
    });
    $('statusBtns').innerHTML = html;

    // bind dimension toggle
    document.querySelectorAll('.dim-group .btn').forEach(b => {
      b.onclick = function(){
        document.querySelectorAll('.dim-group .btn').forEach(x=>x.classList.remove('on'));
        this.classList.add('on');
        curDim = this.dataset.dim;
        renderChart();
      };
    });

    // bind status toggle
    document.querySelectorAll('.status-group .btn').forEach(b => {
      b.onclick = function(){
        document.querySelectorAll('.status-group .btn').forEach(x=>x.classList.remove('on'));
        this.classList.add('on');
        curStatus = this.dataset.status;
        renderChart();
      };
    });

    window.addEventListener('resize', renderChart);
  })();

  // bind filters
  (function(){
    $('fCity').onchange = function(){ state.city = this.value; load(); };
    $('fVendor').onchange = function(){ state.vendor = this.value; load(); };

    document.querySelectorAll('#rangeBtns .btn').forEach(b => {
      b.onclick = function(){
        document.querySelectorAll('#rangeBtns .btn').forEach(x=>x.classList.remove('on'));
        this.classList.add('on');
        const pr = presetRange(this.dataset.range);
        state.start = pr.start; state.end = pr.end;
        $('fStart').value = pr.start; $('fEnd').value = pr.end;
        load();
      };
    });

    const onCustomDate = function(){
      const s = $('fStart').value, e = $('fEnd').value;
      if (!s && !e) return;
      state.start = s || e; state.end = e || s; // 只填一端则按单日处理
      document.querySelectorAll('#rangeBtns .btn').forEach(x=>x.classList.remove('on'));
      load();
    };
    $('fStart').onchange = onCustomDate;
    $('fEnd').onchange = onCustomDate;

    $('fReset').onclick = function(){
      const pr = presetRange('today');
      state.city = ''; state.vendor = '';
      state.start = pr.start; state.end = pr.end;
      $('fCity').value = ''; $('fVendor').value = '';
      $('fStart').value = ''; $('fEnd').value = '';
      document.querySelectorAll('#rangeBtns .btn').forEach(x=>x.classList.toggle('on', x.dataset.range === 'today'));
      load();
    };
  })();

  // 初始区间 = 今日（与服务端缺省一致），日期输入框同步显示
  (function(){
    const pr = presetRange('today');
    state.start = pr.start; state.end = pr.end;
    $('fStart').value = pr.start; $('fEnd').value = pr.end;
  })();

  load();
})();
</script>
</body>
</html>
