<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>房源评级复核 · 认证中台</title>
  <style>
    :root {
      --bg: #f5f7fa; --surface: #fff; --fg: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --accent: #0f766e; --accent-2: #14b8a6;
      --gold: #b45309; --gold-soft: #fef3c7;
      --ok: #16a34a; --warn: #ea580c; --danger: #dc2626;
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
      --font: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:13px; line-height:1.5;}
    a{color:var(--accent); text-decoration:none;}
    
    .main-wrap{padding:24px 28px 80px;}
    
    /* page header */
    .page-header{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
      padding:18px 22px; margin-bottom:18px;
      display:flex; align-items:center; gap:14px;
    }
    .page-header h1{font-size:20px; margin:0; font-weight:700;}
    .page-header .sub{color:var(--muted); font-size:12px; margin-top:2px;}
    .page-header .right{margin-left:auto; display:flex; gap:8px; align-items:center;}
    .page-header .breadcrumb{font-size:11px; color:var(--muted); margin-bottom:4px;}
    .page-header .breadcrumb a{color:var(--accent);}
    
    /* stats row */
    .stats-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px;}
    .stat-card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
      padding:14px 16px; text-align:center;
    }
    .stat-card .num{font-size:28px; font-weight:700;}
    .stat-card .num.pending{color:var(--warn);}
    .stat-card .num.passed{color:var(--ok);}
    .stat-card .num.rejected{color:var(--danger);}
    .stat-card .label{font-size:11px; color:var(--muted); margin-top:4px;}
    
    /* filter bar */
    .filter-bar{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
      padding:12px 16px; margin-bottom:14px;
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .filter-bar .lbl{font-size:12px; color:var(--muted); font-weight:600;}
    .filter-bar select, .filter-bar input{
      padding:6px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
      font-size:12px; background:var(--surface);
    }
    .filter-bar .spacer{flex:1;}
    
    /* table */
    .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
    table{width:100%; border-collapse:collapse; font-size:12.5px;}
    thead{background:#fafafa;}
    th{padding:12px 14px; text-align:left; font-weight:600; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
    td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
    tr:hover td{background:#f8fafc;}
    tr:last-child td{border-bottom:none;}
    
    .house-id{font-family:ui-monospace,monospace; font-size:11px; color:var(--accent);}
    .star-badge{display:inline-flex; align-items:center; gap:2px; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600;}
    .star-badge.s5{background:linear-gradient(135deg,#fef3c7,#fde68a); color:#92400e;}
    .star-badge.s4{background:#ecfdf5; color:#047857;}
    .star-badge.s3{background:#eff6ff; color:#1d4ed8;}
    .star-badge.s2, .star-badge.s1{background:#f3f4f6; color:#4b5563;}
    
    .score-cell{display:flex; align-items:center; gap:8px;}
    .score-bar{width:80px; height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden;}
    .score-bar i{display:block; height:100%; border-radius:3px;}
    .score-num{font-weight:700; font-size:13px;}
    
    .status-tag{padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;}
    .status-tag.pending{background:#fef3c7; color:#92400e;}
    .status-tag.passed{background:#dcfce7; color:#166534;}
    .status-tag.rejected{background:#fee2e2; color:#991b1b;}
    
    .action-btns{display:flex; gap:6px;}
    .btn{padding:6px 12px; border-radius:var(--radius-sm); font-size:11px; font-weight:600; cursor:pointer; border:0;}
    .btn-primary{background:var(--accent); color:#fff;}
    .btn-ghost{background:var(--surface); color:var(--fg); border:1px solid var(--border);}
    .btn:hover{opacity:0.9;}
    
    /* pagination */
    .pagination{display:flex; justify-content:center; gap:4px; padding:16px;}
    .pagination button{padding:8px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:12px; cursor:pointer;}
    .pagination button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
    
    @media(max-width:900px){
      .stats-row{grid-template-columns:repeat(3,1fr);}
      .filter-bar{flex-wrap:wrap;}
    }
    @media(max-width:620px){
      .stats-row{grid-template-columns:1fr 1fr;}
      .main-wrap{padding:16px 12px;}
    }
  </style>
</head>
<body class="nv-with-side">
  <div id="side-nav" data-series="p" data-active="rating-review"></div>

  <div class="main-wrap">
    <div class="page-header">
      <div>
        <div class="breadcrumb"><a href="home.html">← 认证中台</a></div>
        <h1>🐚 房源评级复核</h1>
        <div class="sub">旅居星级 AI 打分引擎 · 中台复核 · 参考 <a href="../lvju-rating-standard.html" style="color:var(--accent);">评价标准</a></div>
      </div>
      <div class="right">
        <button class="btn btn-ghost">导出列表</button>
      </div>
    </div>

    <!-- stats（接真实计数；AI 准确率为引擎演示口径） -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="statTotal">—</div>
        <div class="label">总申请数</div>
      </div>
      <div class="stat-card">
        <div class="num pending" id="statPending">—</div>
        <div class="label">待复核</div>
      </div>
      <div class="stat-card">
        <div class="num passed" id="statPassed">—</div>
        <div class="label">已通过</div>
      </div>
      <div class="stat-card">
        <div class="num rejected" id="statRejected">—</div>
        <div class="label">已驳回</div>
      </div>
      <div class="stat-card">
        <div class="num" style="color:var(--accent);">82%</div>
        <div class="label">AI 准确率（演示）</div>
      </div>
    </div>

    <!-- 评级复核队列（真实数据；原「新居住保租房」块与「旅居房源复核（演示样例）」表融合，演示表已删） -->
    <div class="filter-bar" style="margin-top:8px;background:linear-gradient(90deg,#ecfdf5,#fff);">
      <span class="lbl">评级复核队列</span>
      <span style="font-size:11px;color:var(--muted);">数据来自 <code>juzhu-admin</code> → <code>/api/juzhu/ratings</code></span>
      <div class="spacer"></div>
      <input id="ratingSearch" type="text" placeholder="搜索编号/项目名…" style="padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;width:170px;">
      <select id="ratingChannel" style="padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;">
        <option value="">全部频道</option>
        <option value="rental">保租房 · 好房子</option>
        <option value="minsu">旅居 · 彩贝</option>
      </select>
      <select id="ratingStatus" style="padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;">
        <option value="pending" selected>待复核</option>
        <option value="passed">已通过</option>
        <option value="rejected">已驳回</option>
        <option value="">全部状态</option>
      </select>
      <a href="../juzhu-admin.html" class="btn btn-ghost" style="text-decoration:none;">内容后台 ↗</a>
    </div>
    <div class="table-wrap" style="margin-bottom:18px;">
      <table>
        <thead>
          <tr>
            <th>房源编号</th>
            <th>项目名称</th>
            <th>行政区</th>
            <th>频道</th>
            <th>AI 初评</th>
            <th>提交时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="juzhuRatings">
          <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="juzhuPager" style="padding:8px 0 14px;"></div>
  </div>

  <script src="_region.js"></script>
  <script src="_nav.js"></script>
  <script>
  (function(){
    var STATUS = { pending:'待复核', passed:'已通过', rejected:'已驳回', draft:'草稿' };
    var CH = {
      rental: { label: '保租房 · 好房子', bg: '#ecfdf5', fg: '#065f46' },
      minsu:  { label: '旅居 · 彩贝',    bg: '#fef3c7', fg: '#92400e' }
    };
    var PAGE_SIZE = 10, curPage = 1, allItems = [];
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function ratingObj(p){
      var r = p.rating;
      if (typeof r === 'string') { try { r = JSON.parse(r); } catch (_) { r = {}; } }
      return (!r || typeof r !== 'object') ? {} : r;
    }
    function scoreOf(r){
      if (r.score != null) return { v: r.score, w: Math.max(0, Math.min(100, +r.score)) };
      var d = r.dims, vals = (d && typeof d === 'object') ? Object.keys(d).map(function(k){ return +d[k]; }).filter(function(x){ return !isNaN(x); }) : [];
      if (!vals.length) return null;
      var avg = vals.reduce(function(a, b){ return a + b; }, 0) / vals.length;
      return { v: Math.round(avg * 10) / 10, w: Math.max(0, Math.min(100, avg)) };
    }
    function filtered(){
      var st = document.getElementById('ratingStatus').value;
      var ch = document.getElementById('ratingChannel').value;
      var q = (document.getElementById('ratingSearch').value || '').trim().toLowerCase();
      return allItems.filter(function(p){
        if (st && (p.rating_status || 'pending') !== st) return false;
        if (ch && (p.channel || '') !== ch) return false;
        if (q) {
          var r = ratingObj(p);
          var hay = ((r.code || '') + ' ' + String(p.id).padStart(5, '0') + ' ' + (p.name || '')).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
    }
    function render(){
      var tbody = document.getElementById('juzhuRatings');
      var pager = document.getElementById('juzhuPager');
      var items = filtered();
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">无符合筛选的房源 · 请在 <a href="../juzhu-admin.html">juzhu-admin</a> 提交评级</td></tr>';
        pager.innerHTML = '';
        return;
      }
      var pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      if (curPage > pages) curPage = pages;
      var RGCITY = (window.BZF_REGION && BZF_REGION.prov && BZF_REGION.prov.capital) || '沈阳';
      var RGBIZ  = (window.BZF_REGION && BZF_REGION.biz && BZF_REGION.biz.term) || '保租房';
      tbody.innerHTML = items.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE).map(function(p){
        var r = ratingObj(p);
        var code = r.code || (String(p.id).padStart(5,'0'));
        var c = CH[p.channel] || null;
        var chBadge = c
          ? '<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:'+c.bg+';color:'+c.fg+';white-space:nowrap;">'+c.label+'</span>'
          : esc(p.channel || '—');
        var sc = scoreOf(r);
        var scoreCell = sc
          ? '<div class="score-cell"><div class="score-bar"><i style="width:'+sc.w+'%;background:var(--accent);"></i></div><span class="score-num">'+sc.v+'</span></div>'
          : '—';
        var st = p.rating_status || 'pending';
        var dt = (p.rating_submitted_at || '').slice(0,10) || '—';
        return '<tr>'+
          '<td><span class="house-id">'+esc(code)+'</span></td>'+
          '<td><b>'+esc(p.name)+'</b><br><small style="color:var(--muted);">'+esc(RGCITY)+' · '+esc(RGBIZ)+'</small></td>'+
          '<td>'+esc(p.district_name||'—')+'</td>'+
          '<td>'+chBadge+'</td>'+
          '<td>'+scoreCell+'</td>'+
          '<td>'+esc(dt)+'</td>'+
          '<td><span class="status-tag '+st+'">'+(STATUS[st]||st)+'</span></td>'+
          '<td class="action-btns"><a href="p-rating-detail.html?id='+encodeURIComponent(code)+'" class="btn btn-primary">复核</a></td>'+
        '</tr>';
      }).join('');
      var pg = '<button'+(curPage===1?' disabled':'')+' data-pg="'+(curPage-1)+'">‹</button>';
      for (var i=1;i<=pages;i++) pg += '<button'+(i===curPage?' class="active"':'')+' data-pg="'+i+'">'+i+'</button>';
      pg += '<button'+(curPage===pages?' disabled':'')+' data-pg="'+(curPage+1)+'">›</button>';
      pg += '<span style="font-size:11px;color:var(--muted);align-self:center;margin-left:8px;">共 '+items.length+' 条</span>';
      pager.innerHTML = pg;
      Array.prototype.forEach.call(pager.querySelectorAll('button[data-pg]'), function(b){
        b.onclick = function(){
          var t = parseInt(b.getAttribute('data-pg'), 10);
          if (t >= 1 && t <= pages && t !== curPage) { curPage = t; render(); }
        };
      });
    }
    function resetPage(){ curPage = 1; render(); }
    function load(){
      fetch('/api/juzhu/ratings').then(function(r){ return r.json(); }).then(function(data){
        allItems = Array.isArray(data) ? data : (data.items || []);
        var counts = { pending:0, passed:0, rejected:0 };
        allItems.forEach(function(p){ var s = p.rating_status || 'pending'; if (counts[s] != null) counts[s]++; });
        document.getElementById('statTotal').textContent = allItems.length;
        document.getElementById('statPending').textContent = counts.pending;
        document.getElementById('statPassed').textContent = counts.passed;
        document.getElementById('statRejected').textContent = counts.rejected;
        resetPage();
      }).catch(function(){
        document.getElementById('juzhuRatings').innerHTML =
          '<tr><td colspan="8" style="text-align:center;color:#991b1b;padding:24px;">无法连接新居住 API（/api/juzhu/ratings）· 请启动 juzhu 服务</td></tr>';
      });
    }
    document.getElementById('ratingStatus').onchange = resetPage;
    document.getElementById('ratingChannel').onchange = resetPage;
    document.getElementById('ratingSearch').oninput = resetPage;
    load();
  })();
  </script>
</body>
</html>
