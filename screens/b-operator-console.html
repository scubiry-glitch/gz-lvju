<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资管大盘 · 国企持有方 + 白名单运营商（B 端）</title>
  <style>
    :root {
      --bg: #f3f4f6; --surface: #ffffff; --fg: #111111;
      --muted: #6b7280; --border: #e5e7eb; --accent: #0f766e;
      --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
      --success: #16a34a; --warn: #ea580c; --danger: #dc2626;
      --radius-sm: 6px; --radius-md: 10px;
      --font: system-ui, -apple-system, 'PingFang SC', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    a { color: inherit; text-decoration: none; }

    /* layout */
    .console { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* main */
    .main { padding: 22px 28px 40px; overflow-x: hidden; }
    .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .topbar h1 { font-size: 22px; font-weight: 600; margin: 0; flex: 1; }
    .topbar .range {
      padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .topbar .range svg { width: 14px; height: 14px; color: var(--muted); }
    .topbar .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .topbar .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; }

    /* kpi */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px 18px;
    }
    .kpi .lbl { font-size: 12px; color: var(--muted); }
    .kpi .num { font-size: 26px; font-weight: 700; margin-top: 4px; line-height: 1.1; }
    .kpi .delta { font-size: 12px; margin-top: 6px; }
    .kpi .delta.up { color: var(--success); }
    .kpi .delta.dn { color: var(--danger); }
    .kpi .spark { height: 32px; margin-top: 8px; background: linear-gradient(180deg, var(--accent-soft), transparent); border-radius: 4px; position: relative; }
    .kpi .spark::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 1px; background: var(--accent); opacity: 0.6; }

    /* two-col grid */
    .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* card */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .card-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-head h3 { font-size: 14px; font-weight: 600; margin: 0; }
    .card-head .actions { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
    .card-head .actions a { color: var(--accent); }
    .card-body { padding: 14px 18px; }

    /* table */
    table.proj { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.proj th, table.proj td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    table.proj th { font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; background: var(--bg); }
    table.proj tr:last-child td { border-bottom: 0; }
    .rate { display: flex; align-items: center; gap: 6px; }
    .rate-track { width: 60px; height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .rate-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
    .pill.ok { background: color-mix(in oklab, var(--success) 14%, transparent); color: var(--success); }
    .pill.warn { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
    .pill.danger { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }

    /* alerts */
    .alert-list { list-style: none; padding: 0; margin: 0; }
    .alert-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .alert-item:last-child { border-bottom: 0; }
    .alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .alert-dot.h { background: var(--danger); }
    .alert-dot.m { background: var(--warn); }
    .alert-dot.l { background: var(--muted); }
    .alert-item .title { font-weight: 500; }
    .alert-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* upcoming */
    .upcoming { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .up-box { padding: 12px; background: var(--bg); border-radius: var(--radius-sm); text-align: center; }
    .up-box .n { font-size: 22px; font-weight: 700; color: var(--warn); }
    .up-box .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .up-box .a { display: block; margin-top: 8px; font-size: 11px; color: var(--accent); }

    @media (max-width: 900px) {
      .console { grid-template-columns: 1fr; }
      .side { display: none; }
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="console">

  <!-- sidebar -->
  <div id="side-nav" data-series="b" data-active="console"></div>

  <!-- main -->
  <main class="main">

    <div class="topbar">
      <h1>运营总览</h1>
      <div class="range">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
        <span id="dataRange">实时 · 连接新居住数据库</span>
      </div>
      <div class="user">
        <div class="avatar">王</div>
        王经理 · 运营总监
      </div>
    </div>

    <!-- KPI · 全部来自 /api/juzhu/stats + /ratings，无 mock -->
    <div class="kpi-grid">
      <div class="kpi">
        <div class="lbl">在管项目（保租房）</div>
        <div class="num" id="kpiProjects">—</div>
        <div class="delta" id="kpiProjectsDelta"></div>
        <div class="spark"></div>
      </div>
      <div class="kpi">
        <div class="lbl">房源规模（项目申报）</div>
        <div class="num" id="kpiUnits">—</div>
        <div class="delta" id="kpiUnitsDelta"></div>
        <div class="spark"></div>
      </div>
      <div class="kpi">
        <div class="lbl">覆盖城市 / 行政区</div>
        <div class="num" id="kpiCoverage">—</div>
        <div class="delta" id="kpiCoverageDelta"></div>
        <div class="spark"></div>
      </div>
      <div class="kpi">
        <div class="lbl">好房子评级 · 已通过</div>
        <div class="num" id="kpiRating">—</div>
        <div class="delta" id="kpiRatingDelta"></div>
        <div class="spark"></div>
      </div>
    </div>

    <!-- main + alerts -->
    <div class="row2">
      <div class="card">
        <div class="card-head">
          <h3>行政区运营表现 · <span id="distSrc" style="font-weight:400;color:var(--muted);">/api/juzhu/districts</span></h3>
          <div class="actions"><a href="b-listing-mgmt.html">房源明细 →</a></div>
        </div>
        <div class="card-body" style="padding: 0;">
          <table class="proj">
            <thead>
              <tr>
                <th>行政区</th>
                <th>城市</th>
                <th>项目数</th>
                <th>房源规模</th>
                <th>均价（元/月）</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="distRows">
              <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>评级与数据预警 · <span id="alertCnt" style="color: var(--danger);"></span></h3>
          <div class="actions"><a href="p-rating-review.html">去复核 →</a></div>
        </div>
        <div class="card-body">
          <ul class="alert-list" id="alertList">
            <li class="alert-item"><div class="alert-dot l"></div><div><div class="title">加载中…</div></div></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- city split -->
    <div class="card">
      <div class="card-head">
        <h3>城市分布</h3>
        <div class="actions"><a href="#" onclick="return false;" title="合同数据未入库（暂无合同表），到期为示例模块已下线">合同到期 · 待接入</a></div>
      </div>
      <div class="card-body">
        <div class="upcoming" id="citySplit">
          <div class="up-box"><div class="n">—</div><div class="l">加载中…</div></div>
        </div>
      </div>
    </div>

    <!-- 运营商维度（持有方看绩效，不插手一线动作 · 规则 4） -->
    <div class="card" style="margin-top:16px;">
      <div class="card-head">
        <h3>运营商在管规模 · <span id="opSrc" style="font-weight:400;color:var(--muted);">/api/juzhu/stats.operators</span></h3>
        <div class="actions"><a href="b-listing-mgmt.html">房源明细 →</a></div>
      </div>
      <div class="card-body" style="padding: 0;">
        <table class="proj">
          <thead>
            <tr><th>运营商 / 持有方</th><th>类型</th><th>在管项目</th><th>在管房源</th></tr>
          </thead>
          <tbody id="opRows">
            <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px;">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="_region.js?v=2"></script>
<script src="_nav.js"></script>
<script>
(function(){
  var API = '/api/juzhu';
  function get(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  function fmt(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('zh-CN'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  Promise.all([
    get(API+'/stats'),
    get(API+'/districts'),
    get(API+'/cities'),
    get(API+'/ratings').catch(function(){ return { items: [] }; })
  ]).then(function(rs){
    var stats=rs[0], districts=rs[1]||[], cities=rs[2]||[], rated=(rs[3].items||[]);
    document.getElementById('dataRange').textContent = '实时 · 数据库已连接 · ' + districts.length + ' 行政区';

    // KPI
    document.getElementById('kpiProjects').textContent = fmt(stats.projects_rental != null ? stats.projects_rental : stats.projects_bzf);
    document.getElementById('kpiProjectsDelta').textContent =
      '运营商 ' + (stats.operators ? stats.operators.length : 0) + ' 家 · 另含卖旧买新 ' + fmt(stats.projects_trade) + ' 个';
    document.getElementById('kpiProjectsDelta').className = 'delta up';
    document.getElementById('kpiUnits').textContent = fmt(stats.units);
    document.getElementById('kpiUnitsDelta').textContent = '覆盖 ' + (stats.districts||0) + ' 个行政区';
    document.getElementById('kpiCoverage').textContent = (cities.length||0) + ' 城 / ' + (stats.districts||0) + ' 区';
    document.getElementById('kpiCoverageDelta').textContent = cities.map(function(c){ return c.name; }).join(' · ');
    document.getElementById('kpiCoverageDelta').className = 'delta up';
    var pend = rated.filter(function(p){ return p.rating_status==='pending'; }).length;
    var pass = rated.filter(function(p){ return p.rating_status==='passed'; }).length;
    var rej  = rated.filter(function(p){ return p.rating_status==='rejected'; }).length;
    var unrated = Math.max(0, (stats.projects_bzf||0) - rated.length);
    document.getElementById('kpiRating').textContent = fmt(pass);
    var rd = document.getElementById('kpiRatingDelta');
    rd.textContent = '待复核 ' + pend + ' · 驳回 ' + rej + ' · 未启动 ' + unrated;
    rd.className = 'delta ' + (unrated > 0 ? 'dn' : 'up');

    // 行政区表（按房源规模倒序，取前 12）
    var cityMap = {}; cities.forEach(function(c){ cityMap[c.id]=c.name; });
    var rows = districts.slice().sort(function(a,b){ return (b.unit_count||0)-(a.unit_count||0); }).slice(0,12);
    document.getElementById('distRows').innerHTML = rows.length ? rows.map(function(d){
      return '<tr>'+
        '<td><b>'+d.name+'</b></td>'+
        '<td>'+(cityMap[d.city_id]||'—')+'</td>'+
        '<td>'+fmt(d.project_count)+'</td>'+
        '<td>'+fmt(d.unit_count)+'</td>'+
        '<td>'+(d.avg_price?fmt(d.avg_price):'—')+'</td>'+
        '<td>'+(d.is_hot ? '<span class="pill ok">热门</span>' : '<span class="pill" style="background:var(--bg);color:var(--muted);">常规</span>')+'</td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">暂无行政区数据</td></tr>';

    // 城市分布
    var byCity = {};
    districts.forEach(function(d){
      var k=d.city_id; byCity[k]=byCity[k]||{p:0,u:0};
      byCity[k].p += (d.project_count||0); byCity[k].u += (d.unit_count||0);
    });
    document.getElementById('citySplit').innerHTML = cities.map(function(c){
      var v = byCity[c.id]||{p:0,u:0};
      return '<div class="up-box"><div class="n" style="color:var(--accent);">'+fmt(v.p)+'</div>'+
        '<div class="l">'+c.name+' · 项目</div>'+
        '<div class="a" style="color:var(--muted);">房源规模 '+fmt(v.u)+'</div></div>';
    }).join('') || '<div class="up-box"><div class="n">—</div><div class="l">暂无城市</div></div>';

    // 运营商维度（stats.operators：platform=平台自营/国企持有方直营，housing_operator=白名单运营商）
    var TYPE = { platform:'平台自营', housing_operator:'白名单运营商', lvju_host:'旅居托管' };
    var ops = stats.operators || [];
    document.getElementById('opRows').innerHTML = ops.length ? ops.map(function(o){
      return '<tr>'+
        '<td><b>'+esc(o.name)+'</b></td>'+
        '<td>'+(TYPE[o.type]||esc(o.type||'—'))+'</td>'+
        '<td>'+fmt(o.project_count)+'</td>'+
        '<td>'+fmt(o.unit_count)+'</td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px;">暂无运营商数据</td></tr>';

    // 预警（只列真实可算的信号）
    var alerts = [];
    if (pend > 0) alerts.push(['m','保租房评级待复核 '+pend+' 条','P 端复核后前台详情页生效']);
    if (rej > 0) alerts.push(['h','评级驳回未整改 '+rej+' 个项目','B 端需重新自评并提交']);
    if (unrated > 0) alerts.push(['h','保租房项目未启动好房子自评 '+unrated+' 个','在 b-listing-mgmt → 好房子评级录入 处理']);
    if (!alerts.length) alerts.push(['l','评级状态健康','全部在管项目均有评级结论']);
    alerts.push([null,'运营商工单 SLA 预警','待工单系统接入后按运营商维度展示，不在持有方大盘显示一线工单']);
    document.getElementById('alertCnt').textContent = '· ' + (alerts.length-1);
    document.getElementById('alertList').innerHTML = alerts.map(function(a){
      return '<li class="alert-item"><div class="alert-dot '+(a[0]||'l')+'"></div><div>'+
        '<div class="title">'+a[1]+'</div><div class="meta">'+a[2]+'</div></div></li>';
    }).join('');
  }).catch(function(e){
    document.getElementById('dataRange').textContent = '数据库未连接';
    document.getElementById('distRows').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#991b1b;padding:24px;">无法连接新居住 API（/api/juzhu/stats · /districts）· 请确认服务已部署</td></tr>';
    document.getElementById('alertList').innerHTML = '<li class="alert-item"><div class="alert-dot h"></div><div><div class="title">数据接口不可用</div><div class="meta">'+(e&&e.message||'')+'</div></div></li>';
  });
})();
</script>
</body>
</html>
